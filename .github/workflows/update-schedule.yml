name: Update Cobras Team Schedules

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download active team schedules
        run: |
          mkdir -p schedules
          mkdir -p logos/cache

          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const https = require("https");
          const http = require("http");
          const path = require("path");
          const crypto = require("crypto");

          const configText = fs.readFileSync("config.js", "utf8");

          const context = {};
          vm.createContext(context);
          vm.runInContext(
            configText +
            "\nthis.__teams = COBRAS_TEAMS;" +
            "\nthis.__settings = COBRAS_SETTINGS;",
            context
          );

          const teams = context.__teams;
          const settings = context.__settings;

          const activeSeasons =
            settings.activeGameChangerSeasons || [];

          console.log(
            "Active GameChanger seasons:",
            activeSeasons.join(", ")
          );

          /*
            ----------------------------------------
            DOWNLOAD HELPER
            ----------------------------------------
          */

          function download(url, destination) {

            return new Promise((resolve, reject) => {

              const client =
                url.startsWith("https://")
                  ? https
                  : http;

              const request =
                client.get(
                  url,
                  {
                    headers: {
                      "User-Agent":
                        "McHenry-Cobras-Schedule-Updater"
                    }
                  },
                  response => {

                    /*
                      Follow redirects
                    */

                    if (
                      response.statusCode >= 300 &&
                      response.statusCode < 400 &&
                      response.headers.location
                    ) {

                      response.resume();

                      return download(
                        response.headers.location,
                        destination
                      )
                        .then(resolve)
                        .catch(reject);
                    }


                    if (response.statusCode !== 200) {

                      response.resume();

                      return reject(
                        new Error(
                          `HTTP ${response.statusCode}`
                        )
                      );
                    }


                    const contentType =
                      response.headers["content-type"] || "";

                    let extension = ".jpg";

                    if (
                      contentType.includes("png")
                    ) {
                      extension = ".png";

                    } else if (
                      contentType.includes("webp")
                    ) {
                      extension = ".webp";

                    } else if (
                      contentType.includes("gif")
                    ) {
                      extension = ".gif";

                    } else if (
                      contentType.includes("svg")
                    ) {
                      extension = ".svg";
                    }


                    const finalDestination =
                      destination + extension;

                    const file =
                      fs.createWriteStream(
                        finalDestination
                      );

                    response.pipe(file);

                    file.on(
                      "finish",
                      () => {

                        file.close(
                          () =>
                            resolve({
                              path:
                                finalDestination,
                              contentType
                            })
                        );

                      }
                    );

                    file.on(
                      "error",
                      reject
                    );

                  }
                );


              request.on(
                "error",
                reject
              );


              request.setTimeout(
                30000,
                () => {

                  request.destroy(
                    new Error(
                      "Logo download timed out"
                    )
                  );

                }
              );

            });

          }


          /*
            ----------------------------------------
            PROCESS ONE TEAM
            ----------------------------------------
          */

          async function processTeam(
            key,
            team
          ) {

            if (!team.active) {

              console.log(
                `Skipping inactive team: ${key}`
              );

              return [];
            }


            if (
              !team.gameChangerTeams
            ) {

              console.log(
                `Skipping ${team.name}: no GameChanger seasons configured`
              );

              return [];
            }


            const teamCalendarEvents = [];


            for (
              const season of activeSeasons
            ) {

              const gameChangerTeamId =
                team.gameChangerTeams[season];


              if (!gameChangerTeamId) {

                console.log(
                  `${team.name}: no GameChanger ID for ${season}`
                );

                continue;
              }


              console.log(
                `Downloading ${team.name} - ${season}`
              );


              const scheduleUrl =
                `https://api.team-manager.gc.com/public/teams/${gameChangerTeamId}/games`;


              const scheduleFile =
                path.join(
                  "schedules",
                  `${key}-${season
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, "-")
                    .replace(/^-|-$/g, "")}.json`
                );


              const response =
                await fetch(
                  scheduleUrl
                );


              if (!response.ok) {

                throw new Error(
                  `Schedule HTTP ${response.status} for ${key} / ${season}`
                );

              }


              const games =
                await response.json();


              if (!Array.isArray(games)) {

                throw new Error(
                  `Unexpected schedule format for ${key} / ${season}`
                );

              }


              /*
                ----------------------------------
                DOWNLOAD OPPONENT LOGOS
                ----------------------------------
              */

              const logoMap =
                new Map();


              for (
                const game of games
              ) {

                const opponent =
                  game.opponent_team;


                if (
                  !opponent ||
                  !opponent.avatar_url
                ) {
                  continue;
                }


                const originalUrl =
                  opponent.avatar_url;


                if (
                  logoMap.has(originalUrl)
                ) {

                  opponent.avatar_url =
                    logoMap.get(
                      originalUrl
                    );

                  continue;
                }


                const hash =
                  crypto
                    .createHash("sha1")
                    .update(originalUrl)
                    .digest("hex")
                    .substring(0, 16);


                const basePath =
                  path.join(
                    "logos",
                    "cache",
                    hash
                  );


                try {

                  const result =
                    await download(
                      originalUrl,
                      basePath
                    );


                  const localUrl =
                    result.path
                      .replace(
                        /\\/g,
                        "/"
                      );


                  logoMap.set(
                    originalUrl,
                    localUrl
                  );


                  opponent.avatar_url =
                    localUrl;


                  console.log(
                    `  Saved opponent logo: ${localUrl}`
                  );


                } catch (error) {

                  console.log(
                    `  Could not download opponent logo: ${error.message}`
                  );

                }

              }


              /*
                ----------------------------------
                ADD COBRAS METADATA TO EACH GAME
                ----------------------------------
              */

              for (
                const game of games
              ) {

                game.cobras_gamechanger_season =
                  season;

                game.cobras_gamechanger_team_id =
                  gameChangerTeamId;

                game.cobras_team_key =
                  key;

                game.cobras_team_name =
                  team.name;


                /*
                  Add games to calendar feed.
                */

                teamCalendarEvents.push({

                  id:
                    `${key}-${season}-${game.id}`,

                  type:
                    "gamechanger",

                  title:
                    `${team.name} vs ${
                      game.opponent_team?.name ||
                      "Opponent"
                    }`,

                  start:
                    game.start_ts,

                  end:
                    game.end_ts,

                  timezone:
                    game.timezone ||
                    "America/Chicago",

                  teamKey:
                    key,

                  teamName:
                    team.name,

                  opponent:
                    game.opponent_team?.name ||
                    "Opponent",

                  homeAway:
                    game.home_away ||
                    "",

                  gameStatus:
                    game.game_status ||
                    "",

                  season:
                    season,

                  gameChangerTeamId:
                    gameChangerTeamId,

                  gameChangerGameId:
                    game.id,

                  opponentLogo:
                    game.opponent_team?.avatar_url ||
                    ""

                });

              }


              fs.writeFileSync(
                scheduleFile,
                JSON.stringify(
                  games,
                  null,
                  2
                ) + "\n"
              );


              console.log(
                `Saved ${scheduleFile}`
              );


              console.log(
                `${team.name}: ${games.length} games downloaded for ${season}`
              );

            }


            console.log(
              `${team.name}: ${teamCalendarEvents.length} calendar games added`
            );


            return teamCalendarEvents;

          }


          /*
            ----------------------------------------
            ORGANIZATION EVENTS
            ----------------------------------------
          */

          const organizationEvents = [

            {
              id:
                "uniform-fitting-2026",

              type:
                "organization",

              title:
                "Uniform Fitting",

              start:
                "2026-12-12",

              end:
                "2026-12-12",

              allDay:
                true,

              category:
                "Organization",

              description:
                "Cobras uniform fitting",

              teamKey:
                "",

              teamName:
                "All Cobras",

              source:
                "Cobras"

            },


            {
              id:
                "pictures-2027",

              type:
                "organization",

              title:
                "Team Pictures",

              start:
                "2027-02-28",

              end:
                "2027-02-28",

              allDay:
                true,

              category:
                "Organization",

              description:
                "Cobras team pictures",

              teamKey:
                "",

              teamName:
                "All Cobras",

              source:
                "Cobras"

            },


            {
              id:
                "steak-fry-2027",

              type:
                "organization",

              title:
                "Cobras Steak Fry",

              start:
                "2027-03-13",

              end:
                "2027-03-13",

              allDay:
                true,

              category:
                "Fundraiser",

              description:
                "Annual Cobras Steak Fry",

              teamKey:
                "",

              teamName:
                "All Cobras",

              source:
                "Cobras"

            },


            {
              id:
                "jr-memorial-2027",

              type:
                "organization",

              title:
                "JR Memorial Tournament",

              start:
                "2027-04-15",

              end:
                "2027-04-18",

              allDay:
                true,

              category:
                "Tournament",

              description:
                "JR Memorial Tournament",

              teamKey:
                "",

              teamName:
                "All Cobras",

              source:
                "Cobras"

            },


            {
              id:
                "cobras-for-a-cause-2027",

              type:
                "organization",

              title:
                "Cobras for a Cause",

              start:
                "2027-06-03",

              end:
                "2027-06-06",

              allDay:
                true,

              category:
                "Tournament",

              description:
                "Cobras for a Cause tournament",

              teamKey:
                "",

              teamName:
                "All Cobras",

              source:
                "Cobras"

            }

          ];


          /*
            ----------------------------------------
            MAIN
            ----------------------------------------
          */

          async function main() {

            const allCalendarEvents = [];


            for (
              const [key, team]
              of Object.entries(teams)
            ) {

              try {

                const events =
                  await processTeam(
                    key,
                    team
                  );

                allCalendarEvents.push(
                  ...events
                );

              } catch (error) {

                console.error(
                  `ERROR processing ${key}: ${error.message}`
                );

                process.exitCode = 1;

              }

            }


            /*
              Add organization events.
            */

            allCalendarEvents.push(
              ...organizationEvents
            );


            /*
              Sort calendar chronologically.
            */

            allCalendarEvents.sort(
              (a, b) =>
                new Date(a.start) -
                new Date(b.start)
            );


            /*
              Calendar feed metadata.
            */

            const calendarFeed = {

              generatedAt:
                new Date().toISOString(),

              cobrasSeason:
                settings.cobrasSeason,

              activeGameChangerSeasons:
                activeSeasons,

              eventCount:
                allCalendarEvents.length,

              events:
                allCalendarEvents

            };


            fs.writeFileSync(
              "calendar-events.json",
              JSON.stringify(
                calendarFeed,
                null,
                2
              ) + "\n"
            );


            console.log("");
            console.log(
              "========================================"
            );

            console.log(
              `Created calendar-events.json with ${allCalendarEvents.length} events`
            );

            console.log(
              `GameChanger events: ${
                allCalendarEvents.filter(
                  e =>
                    e.type === "gamechanger"
                ).length
              }`
            );

            console.log(
              `Organization events: ${
                allCalendarEvents.filter(
                  e =>
                    e.type === "organization"
                ).length
              }`
            );

            console.log(
              "========================================"
            );

          }


          main();

          NODE

      - name: Show generated files
        run: |
          echo "=== Schedules ==="
          ls -lah schedules || true

          echo ""
          echo "=== Cached logos ==="
          ls -lah logos/cache || true

          echo ""
          echo "=== Calendar feed ==="
          ls -lah calendar-events.json || true

      - name: Save schedules, logos, and calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedules logos/cache calendar-events.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Cobras schedules and calendar"
            git push
          fi
