name: Update Cobras Team Schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all active team schedules
        run: |
          mkdir -p schedules

          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const https = require("https");

          /*
            Load config.js so the GitHub Action uses
            the same team configuration as the website.
          */

          const code =
            fs.readFileSync("config.js", "utf8") +
            "\nresult = COBRAS_TEAMS;";

          const context = {
            result: null
          };

          vm.createContext(context);
          vm.runInContext(code, context);

          const teams = context.result;

          if (!teams) {
            throw new Error(
              "Unable to load COBRAS_TEAMS from config.js"
            );
          }

          function download(url) {

            return new Promise((resolve, reject) => {

              https.get(url, response => {

                let data = "";

                response.on("data", chunk => {
                  data += chunk;
                });

                response.on("end", () => {

                  if (
                    response.statusCode >= 200 &&
                    response.statusCode < 300
                  ) {

                    resolve(data);

                  } else {

                    reject(
                      new Error(
                        `HTTP ${response.statusCode} for ${url}`
                      )
                    );

                  }

                });

              }).on("error", reject);

            });

          }

          async function main() {

            for (
              const [key, team]
              of Object.entries(teams)
            ) {

              /*
                Inactive teams are not current Cobras teams.
                Do not download or update their schedules.
              */

              if (!team.active) {

                console.log(
                  `Skipping inactive team: ${key}`
                );

                continue;

              }


              /*
                An active team without a GameChanger ID
                is still a valid Cobras team.

                We simply cannot download its schedule yet.
              */

              if (!team.gameChangerTeamId) {

                console.log(
                  `Skipping ${team.name}: no GameChanger team ID`
                );

                continue;

              }


              const url =
                "https://api.team-manager.gc.com/public/teams/" +
                encodeURIComponent(
                  team.gameChangerTeamId
                ) +
                "/games";


              console.log(
                `Downloading ${team.name} (${key})`
              );


              try {

                const data =
                  await download(url);


                /*
                  Make sure the response is valid JSON
                  before saving it.
                */

                JSON.parse(data);


                fs.writeFileSync(
                  `schedules/${key}.json`,
                  data
                );


                console.log(
                  `Saved schedules/${key}.json`
                );


              } catch (error) {

                /*
                  One team's failure should not prevent
                  all of the other Cobras teams from updating.
                */

                console.error(
                  `Failed to download ${team.name}:`,
                  error.message
                );

              }

            }

          }


          main().catch(error => {

            console.error(error);

            process.exit(1);

          });

          NODE


      - name: Show downloaded schedules
        run: |

          echo "=============================="
          echo "Downloaded schedule files:"
          echo "=============================="

          ls -lh schedules


      - name: Save schedules
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedules/


          if git diff --cached --quiet; then

            echo "No schedule changes to save."

          else

            git commit \
              -m "Update Cobras team schedules"

            git push

          fi
