name: Update Cobras Team Schedules

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download active team schedules
        run: |
          mkdir -p schedules
          mkdir -p logos/cache

          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const https = require("https");
          const http = require("http");
          const path = require("path");
          const crypto = require("crypto");

          const configText = fs.readFileSync("config.js", "utf8");

          const context = {};
          vm.createContext(context);
          vm.runInContext(configText + "\nthis.__teams = COBRAS_TEAMS;", context);

          const teams = context.__teams;

          function download(url, destination) {
            return new Promise((resolve, reject) => {
              const client = url.startsWith("https://") ? https : http;

              const request = client.get(url, {
                headers: {
                  "User-Agent": "McHenry-Cobras-Schedule-Updater"
                }
              }, response => {

                if (
                  response.statusCode >= 300 &&
                  response.statusCode < 400 &&
                  response.headers.location
                ) {
                  response.resume();
                  return download(response.headers.location, destination)
                    .then(resolve)
                    .catch(reject);
                }

                if (response.statusCode !== 200) {
                  response.resume();
                  return reject(
                    new Error(`HTTP ${response.statusCode}`)
                  );
                }

                const contentType =
                  response.headers["content-type"] || "";

                let extension = ".jpg";

                if (contentType.includes("png")) {
                  extension = ".png";
                } else if (contentType.includes("webp")) {
                  extension = ".webp";
                } else if (contentType.includes("gif")) {
                  extension = ".gif";
                } else if (contentType.includes("svg")) {
                  extension = ".svg";
                }

                const finalDestination =
                  destination + extension;

                const file = fs.createWriteStream(finalDestination);

                response.pipe(file);

                file.on("finish", () => {
                  file.close(() => resolve({
                    path: finalDestination,
                    contentType
                  }));
                });

                file.on("error", reject);
              });

              request.on("error", reject);

              request.setTimeout(30000, () => {
                request.destroy(
                  new Error("Logo download timed out")
                );
              });
            });
          }

          async function processTeam(key, team) {

            if (!team.active) {
              console.log(`Skipping inactive team: ${key}`);
              return;
            }

            if (!team.gameChangerTeamId) {
              console.log(
                `Skipping ${team.name}: no GameChanger team ID`
              );
              return;
            }

            console.log(
              `Downloading ${team.name} (${key})`
            );

            const scheduleUrl =
              `https://api.team-manager.gc.com/public/teams/${team.gameChangerTeamId}/games`;

            const scheduleFile =
              path.join("schedules", `${key}.json`);

            const response = await fetch(scheduleUrl);

            if (!response.ok) {
              throw new Error(
                `Schedule HTTP ${response.status} for ${key}`
              );
            }

            const games = await response.json();

            if (!Array.isArray(games)) {
              throw new Error(
                `Unexpected schedule format for ${key}`
              );
            }

            const logoMap = new Map();

            for (const game of games) {

              const opponent = game.opponent_team;

              if (!opponent || !opponent.avatar_url) {
                continue;
              }

              const originalUrl = opponent.avatar_url;

              if (logoMap.has(originalUrl)) {
                opponent.avatar_url = logoMap.get(originalUrl);
                continue;
              }

              const hash = crypto
                .createHash("sha1")
                .update(originalUrl)
                .digest("hex")
                .substring(0, 16);

              const basePath =
                path.join("logos", "cache", hash);

              try {

                const result =
                  await download(originalUrl, basePath);

                const localUrl =
                  result.path.replace(/\\/g, "/");

                logoMap.set(originalUrl, localUrl);
                opponent.avatar_url = localUrl;

                console.log(
                  `  Saved opponent logo: ${localUrl}`
                );

              } catch (error) {

                console.log(
                  `  Could not download opponent logo: ${error.message}`
                );
              }
            }

            /*
              The downloaded schedule already contains the
              globally selected Cobras GameChanger season data
              and each game is tagged with cobras_gamechanger_season.
              We preserve that behavior here.
            */
            fs.writeFileSync(
              scheduleFile,
              JSON.stringify(games, null, 2) + "\n"
            );

            console.log(
              `Saved ${scheduleFile}`
            );
          }

          async function main() {

            for (const [key, team] of Object.entries(teams)) {
              try {
                await processTeam(key, team);
              } catch (error) {
                console.error(
                  `ERROR processing ${key}: ${error.message}`
                );
                process.exitCode = 1;
              }
            }
          }

          main();
          NODE

      - name: Build combined upcoming games feed
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const vm = require("vm");

          const configText = fs.readFileSync("config.js", "utf8");

          const context = {};
          vm.createContext(context);
          vm.runInContext(configText + "\nthis.__teams = COBRAS_TEAMS;", context);

          const teams = context.__teams;
          const schedulesDir = "schedules";
          const now = Date.now();

          const upcoming = [];

          for (const [teamKey, team] of Object.entries(teams)) {
            if (!team || !team.active || !team.gameChangerTeamId) {
              continue;
            }

            const scheduleFile =
              path.join(schedulesDir, `${teamKey}.json`);

            if (!fs.existsSync(scheduleFile)) {
              console.log(`No schedule file for ${teamKey}; skipping.`);
              continue;
            }

            let games;

            try {
              games = JSON.parse(
                fs.readFileSync(scheduleFile, "utf8")
              );
            } catch (error) {
              console.log(
                `Could not parse ${scheduleFile}: ${error.message}`
              );
              continue;
            }

            if (!Array.isArray(games)) {
              continue;
            }

            for (const game of games) {
              if (!game || !game.start_ts) {
                continue;
              }

              const startTime = new Date(game.start_ts).getTime();

              if (Number.isNaN(startTime) || startTime < now) {
                continue;
              }

              if (game.game_status === "completed") {
                continue;
              }

              upcoming.push({
                teamKey,
                teamName: team.name,
                season: game.cobras_gamechanger_season || null,
                game
              });
            }
          }

          const seen = new Set();

          const deduped = upcoming
            .sort(
              (a, b) =>
                new Date(a.game.start_ts) -
                new Date(b.game.start_ts)
            )
            .filter(item => {
              const key =
                `${item.teamKey}|${item.game.id}`;

              if (seen.has(key)) {
                return false;
              }

              seen.add(key);
              return true;
            });

          fs.writeFileSync(
            "upcoming-games.json",
            JSON.stringify(deduped, null, 2) + "\n"
          );

          console.log(
            `Created upcoming-games.json with ${deduped.length} upcoming games.`
          );

          for (const item of deduped.slice(0, 10)) {
            console.log(
              `${item.teamName} | ${item.game.start_ts} | ${item.game.opponent_team?.name || "TBD"} | ${item.season || "unknown season"}`
            );
          }
          NODE

      - name: Show downloaded files
        run: |
          echo "=== Schedules ==="
          ls -lah schedules || true

          echo ""
          echo "=== Upcoming games feed ==="
          ls -lah upcoming-games.json || true

          echo ""
          echo "=== Cached logos ==="
          ls -lah logos/cache || true

      - name: Save schedules, feed, and logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedules upcoming-games.json logos/cache

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Cobras schedules and upcoming games"
            git push
          fi
