name: Update Lorenz 12U Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Lorenz schedule from GameChanger
        run: |
          curl -L \
            -H "Accept: application/json" \
            "https://api.team-manager.gc.com/public/teams/jWdOuqoTjKow/games" \
            -o schedule.json

      - name: Check downloaded schedule
        run: |
          echo "Downloaded schedule:"
          cat schedule.json

      - name: Commit schedule if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule.json

          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update Lorenz 12U schedule"
            git push
          fi
