name: Update Cobras Team Schedules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download active team schedules
        run: |
          mkdir -p schedules
          mkdir -p logos/cache

          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const https = require("https");
          const http = require("http");
          const path = require("path");
          const crypto = require("crypto");

          const configText = fs.readFileSync("config.js", "utf8");

          const context = {};
          vm.createContext(context);
          vm.runInContext(configText + "\nthis.__teams = COBRAS_TEAMS;", context);

          const teams = context.__teams;

          function download(url, destination) {
            return new Promise((resolve, reject) => {
              const client = url.startsWith("https://") ? https : http;

              const request = client.get(url, {
                headers: {
                  "User-Agent": "McHenry-Cobras-Schedule-Updater"
                }
              }, response => {

                // Follow redirects
                if (
                  response.statusCode >= 300 &&
                  response.statusCode < 400 &&
                  response.headers.location
                ) {
                  response.resume();
                  return download(response.headers.location, destination)
                    .then(resolve)
                    .catch(reject);
                }

                if (response.statusCode !== 200) {
                  response.resume();
                  return reject(
                    new Error(`HTTP ${response.statusCode}`)
                  );
                }

                const contentType =
                  response.headers["content-type"] || "";

                let extension = ".jpg";

                if (contentType.includes("png")) {
                  extension = ".png";
                } else if (contentType.includes("webp")) {
                  extension = ".webp";
                } else if (contentType.includes("gif")) {
                  extension = ".gif";
                } else if (contentType.includes("svg")) {
                  extension = ".svg";
                }

                const finalDestination =
                  destination + extension;

                const file = fs.createWriteStream(finalDestination);

                response.pipe(file);

                file.on("finish", () => {
                  file.close(() => resolve({
                    path: finalDestination,
                    contentType
                  }));
                });

                file.on("error", reject);
              });

              request.on("error", reject);

              request.setTimeout(30000, () => {
                request.destroy(
                  new Error("Logo download timed out")
                );
              });
            });
          }

          async function processTeam(key, team) {

            if (!team.active) {
              console.log(`Skipping inactive team: ${key}`);
              return;
            }

            if (!team.gameChangerTeamId) {
              console.log(
                `Skipping ${team.name}: no GameChanger team ID`
              );
              return;
            }

            console.log(
              `Downloading ${team.name} (${key})`
            );

            const scheduleUrl =
              `https://api.team-manager.gc.com/public/teams/${team.gameChangerTeamId}/games`;

            const scheduleFile =
              path.join("schedules", `${key}.json`);

            const response = await fetch(scheduleUrl);

            if (!response.ok) {
              throw new Error(
                `Schedule HTTP ${response.status} for ${key}`
              );
            }

            const games = await response.json();

            if (!Array.isArray(games)) {
              throw new Error(
                `Unexpected schedule format for ${key}`
              );
            }

            const logoMap = new Map();

            for (const game of games) {

              const opponent = game.opponent_team;

              if (!opponent || !opponent.avatar_url) {
                continue;
              }

              const originalUrl = opponent.avatar_url;

              if (logoMap.has(originalUrl)) {
                opponent.avatar_url = logoMap.get(originalUrl);
                continue;
              }

              const hash = crypto
                .createHash("sha1")
                .update(originalUrl)
                .digest("hex")
                .substring(0, 16);

              const basePath =
                path.join("logos", "cache", hash);

              try {

                const result =
                  await download(originalUrl, basePath);

                /*
                  Use a root-relative URL so team.html can
                  display it regardless of which team page
                  is being viewed.
                */
                const localUrl =
                  result.path.replace(/\\/g, "/");

                logoMap.set(originalUrl, localUrl);
                opponent.avatar_url = localUrl;

                console.log(
                  `  Saved opponent logo: ${localUrl}`
                );

              } catch (error) {

                console.log(
                  `  Could not download opponent logo: ${error.message}`
                );

                /*
                  Don't destroy the original URL if the
                  download fails. The website can fall back
                  to its placeholder.
                */
              }
            }

            fs.writeFileSync(
              scheduleFile,
              JSON.stringify(games, null, 2) + "\n"
            );

            console.log(
              `Saved ${scheduleFile}`
            );
          }

          async function main() {

            for (const [key, team] of Object.entries(teams)) {
              try {
                await processTeam(key, team);
              } catch (error) {
                console.error(
                  `ERROR processing ${key}: ${error.message}`
                );
                process.exitCode = 1;
              }
            }
          }

          main();
          NODE

      - name: Show downloaded files
        run: |
          echo "=== Schedules ==="
          ls -lah schedules || true

          echo ""
          echo "=== Cached logos ==="
          ls -lah logos/cache || true

      - name: Save schedules and logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedules logos/cache

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Cobras schedules and opponent logos"
            git push
          fi
