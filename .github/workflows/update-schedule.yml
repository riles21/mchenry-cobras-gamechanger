name: Update Lorenz 12U Schedule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Lorenz schedule
        run: |
          curl -L "https://api.team-manager.gc.com/public/teams/jWdOuqoTjKow/games" -o schedule.json

      - name: Show downloaded data
        run: |
          echo "Schedule downloaded:"
          cat schedule.json

      - name: Save schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Lorenz 12U schedule"
            git push
          fi
