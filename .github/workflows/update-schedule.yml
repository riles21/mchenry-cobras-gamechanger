name: Update Cobras Team Schedules

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  update-schedules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download active team schedules
        run: |
          mkdir -p schedules
          mkdir -p logos/cache

          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const https = require("https");
          const http = require("http");
          const path = require("path");
          const crypto = require("crypto");

          /*
            Load config.js.

            We need both:
              COBRAS_SETTINGS
              COBRAS_TEAMS
          */

          const configText = fs.readFileSync("config.js", "utf8");

          const context = {};
          vm.createContext(context);

          vm.runInContext(
            configText +
            "\nthis.__settings = COBRAS_SETTINGS;" +
            "\nthis.__teams = COBRAS_TEAMS;",
            context
          );

          const settings = context.__settings;
          const teams = context.__teams;

          if (!settings) {
            throw new Error(
              "COBRAS_SETTINGS was not found in config.js"
            );
          }

          if (!teams) {
            throw new Error(
              "COBRAS_TEAMS was not found in config.js"
            );
          }

          /*
            Validate the global GameChanger season selection.
          */

          const activeGameChangerSeasons =
            Array.isArray(settings.activeGameChangerSeasons)
              ? settings.activeGameChangerSeasons
              : [];

          if (activeGameChangerSeasons.length === 0) {
            throw new Error(
              "No active GameChanger seasons are configured."
            );
          }

          console.log("");
          console.log("========================================");
          console.log("COBRAS SCHEDULE UPDATE");
          console.log("========================================");
          console.log(
            `Cobras season: ${settings.cobrasSeason || "Not specified"}`
          );
          console.log(
            `GameChanger seasons: ${activeGameChangerSeasons.join(", ")}`
          );
          console.log("========================================");
          console.log("");


          /*
            Download helper used for opponent logos.
          */

          function download(url, destination) {
            return new Promise((resolve, reject) => {

              const client =
                url.startsWith("https://")
                  ? https
                  : http;

              const request = client.get(
                url,
                {
                  headers: {
                    "User-Agent":
                      "McHenry-Cobras-Schedule-Updater"
                  }
                },
                response => {

                  /*
                    Follow redirects.
                  */

                  if (
                    response.statusCode >= 300 &&
                    response.statusCode < 400 &&
                    response.headers.location
                  ) {
                    response.resume();

                    return download(
                      response.headers.location,
                      destination
                    )
                      .then(resolve)
                      .catch(reject);
                  }

                  if (response.statusCode !== 200) {
                    response.resume();

                    return reject(
                      new Error(
                        `HTTP ${response.statusCode}`
                      )
                    );
                  }

                  const contentType =
                    response.headers["content-type"] || "";

                  let extension = ".jpg";

                  if (contentType.includes("png")) {
                    extension = ".png";
                  } else if (
                    contentType.includes("webp")
                  ) {
                    extension = ".webp";
                  } else if (
                    contentType.includes("gif")
                  ) {
                    extension = ".gif";
                  } else if (
                    contentType.includes("svg")
                  ) {
                    extension = ".svg";
                  }

                  const finalDestination =
                    destination + extension;

                  const file =
                    fs.createWriteStream(
                      finalDestination
                    );

                  response.pipe(file);

                  file.on("finish", () => {
                    file.close(() => {
                      resolve({
                        path: finalDestination,
                        contentType
                      });
                    });
                  });

                  file.on("error", reject);
                }
              );

              request.on("error", reject);

              request.setTimeout(30000, () => {
                request.destroy(
                  new Error(
                    "Logo download timed out"
                  )
                );
              });
            });
          }


          /*
            Download one GameChanger season for one team.
          */

          async function downloadSeason(
            teamKey,
            team,
            seasonName,
            gameChangerTeamId
          ) {

            if (!gameChangerTeamId) {
              console.log(
                `  ${seasonName}: no GameChanger team ID`
              );

              return [];
            }

            console.log(
              `  Downloading ${seasonName} (${gameChangerTeamId})`
            );

            const scheduleUrl =
              `https://api.team-manager.gc.com/public/teams/${gameChangerTeamId}/games`;

            const response =
              await fetch(scheduleUrl);

            if (!response.ok) {
              throw new Error(
                `Schedule HTTP ${response.status} ` +
                `for ${teamKey} / ${seasonName}`
              );
            }

            const games =
              await response.json();

            if (!Array.isArray(games)) {
              throw new Error(
                `Unexpected schedule format for ` +
                `${teamKey} / ${seasonName}`
              );
            }

            /*
              Stamp the source season onto each game.

              The GameChanger games endpoint does not currently
              return a season field in the individual game object.

              Since we know which season-specific GameChanger
              team ID produced these games, we can safely record
              that information ourselves.

              This is especially important when multiple seasons
              are combined later.
            */

            games.forEach(game => {
              game.cobras_gamechanger_season =
                seasonName;

              game.cobras_gamechanger_team_id =
                gameChangerTeamId;
            });

            console.log(
              `  ${seasonName}: ${games.length} games`
            );

            return games;
          }


          /*
            Download all selected seasons for one Cobras team.
          */

          async function processTeam(key, team) {

            if (!team.active) {
              console.log(
                `Skipping inactive team: ${key}`
              );

              return;
            }

            if (!team.gameChangerTeams) {
              console.log(
                `Skipping ${team.name}: ` +
                `no gameChangerTeams configuration`
              );

              return;
            }

            console.log("");
            console.log(
              `========================================`
            );
            console.log(
              `Processing ${team.name} (${key})`
            );
            console.log(
              `========================================`
            );

            const allGames = [];

            for (
              const seasonName
              of activeGameChangerSeasons
            ) {

              const gameChangerTeamId =
                team.gameChangerTeams[seasonName];

              const seasonGames =
                await downloadSeason(
                  key,
                  team,
                  seasonName,
                  gameChangerTeamId
                );

              allGames.push(
                ...seasonGames
              );
            }


            /*
              Sort all selected-season games chronologically.
            */

            allGames.sort(
              (a, b) =>
                new Date(a.start_ts) -
                new Date(b.start_ts)
            );


            /*
              Download/cache opponent logos.

              Use one map per team update so repeated
              logos are only downloaded once.
            */

            const logoMap =
              new Map();

            for (
              const game
              of allGames
            ) {

              const opponent =
                game.opponent_team;

              if (
                !opponent ||
                !opponent.avatar_url
              ) {
                continue;
              }

              const originalUrl =
                opponent.avatar_url;

              /*
                If this is already one of our local
                cached paths, don't try to download it.
              */

              if (
                originalUrl.startsWith(
                  "logos/cache/"
                )
              ) {
                continue;
              }

              if (
                logoMap.has(originalUrl)
              ) {
                opponent.avatar_url =
                  logoMap.get(originalUrl);

                continue;
              }

              const hash =
                crypto
                  .createHash("sha1")
                  .update(originalUrl)
                  .digest("hex")
                  .substring(0, 16);

              const basePath =
                path.join(
                  "logos",
                  "cache",
                  hash
                );

              try {

                const result =
                  await download(
                    originalUrl,
                    basePath
                  );

                /*
                  Use a root-relative path.
                */

                const localUrl =
                  result.path.replace(
                    /\\/g,
                    "/"
                  );

                logoMap.set(
                  originalUrl,
                  localUrl
                );

                opponent.avatar_url =
                  localUrl;

                console.log(
                  `  Saved opponent logo: ${localUrl}`
                );

              } catch (error) {

                console.log(
                  `  Could not download opponent logo: ` +
                  `${error.message}`
                );

                /*
                  Keep the original URL if the
                  download fails.
                */
              }
            }


            /*
              Save the combined schedule.

              Only seasons selected in:
                COBRAS_SETTINGS.activeGameChangerSeasons

              are present here.
            */

            const scheduleFile =
              path.join(
                "schedules",
                `${key}.json`
              );

            fs.writeFileSync(
              scheduleFile,
              JSON.stringify(
                allGames,
                null,
                2
              ) + "\n"
            );

            console.log(
              `Saved ${scheduleFile} ` +
              `(${allGames.length} games)`
            );
          }


          /*
            Process every configured team.
          */

          async function main() {

            for (
              const [key, team]
              of Object.entries(teams)
            ) {

              try {

                await processTeam(
                  key,
                  team
                );

              } catch (error) {

                console.error(
                  `ERROR processing ${key}: ` +
                  error.message
                );

                process.exitCode = 1;
              }
            }
          }

          main();
          NODE

      - name: Show downloaded files
        run: |
          echo "=== Schedules ==="
          ls -lah schedules || true

          echo ""
          echo "=== Cached logos ==="
          ls -lah logos/cache || true

      - name: Save schedules and logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedules logos/cache

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update Cobras schedules and opponent logos"
            git push
          fi
