<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobras X Feed Test</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    .title {
      background: #111;
      color: white;
      padding: 15px;
      font-size: 22px;
      font-weight: bold;
      border-bottom: 3px solid #ff5a00;
    }
  </style>
</head>

<body>

  <div class="title">
    COBRAS ON <span style="color:#ff5a00;">X</span>
  </div>

  <a
    class="twitter-timeline"
    data-theme="light"
    data-height="600"
    href="https://x.com/McHenryCobras?ref_src=twsrc%5Etfw"
  >
    Posts by McHenryCobras
  </a>

  <script>
    window.twttr = (function(d, s, id) {

      var js;
      var fjs = d.getElementsByTagName(s)[0];
      var t = window.twttr || {};

      if (d.getElementById(id)) {
        return t;
      }

      js = d.createElement(s);
      js.id = id;
      js.src = "https://platform.x.com/widgets.js";

      fjs.parentNode.insertBefore(js, fjs);

      t._e = [];

      t.ready = function(f) {
        t._e.push(f);
      };

      return t;

    }(document, "script", "twitter-wjs"));
  </script>

</body>
</html>
