<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cobras on X</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .widget {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: 1px solid #d5d5d5;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 58px;
      min-height: 58px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: #111111;
      border-bottom: 3px solid #ff5a00;
      color: #ffffff;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .title .orange {
      color: #ff5a00;
    }

    .follow-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 8px 14px;

      background: #ff5a00;
      color: #000000;

      border-radius: 3px;

      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.4px;
      text-transform: uppercase;

      text-decoration: none;
    }

    .follow-button:hover {
      background: #ff7a2a;
    }

    .feed {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      padding: 0 8px;
    }

    .timeline-container {
      width: 100%;
    }

    @media (max-width: 600px) {

      .header {
        height: 52px;
        min-height: 52px;
        padding: 0 12px;
      }

      .title {
        font-size: 18px;
      }

      .follow-button {
        padding: 7px 10px;
        font-size: 10px;
      }

      .feed {
        padding: 0 4px;
      }
    }
  </style>
</head>

<body>

  <div class="widget">

    <div class="header">

      <div class="title">
        COBRAS ON <span class="orange">X</span>
      </div>

      <a
        class="follow-button"
        href="https://x.com/McHenryCobras"
        target="_blank"
        rel="noopener noreferrer"
      >
        Follow Us →
      </a>

    </div>

    <div class="feed">

      <div class="timeline-container">

        <a
          class="twitter-timeline"
          data-theme="light"
          data-chrome="noheader nofooter"
          data-dnt="true"
          href="https://x.com/McHenryCobras?ref_src=twsrc%5Etfw"
        >
          Posts by McHenryCobras
        </a>

      </div>

    </div>

  </div>

  <script
    async
    src="https://platform.x.com/widgets.js"
    charset="utf-8">
  </script>

</body>
</html>
