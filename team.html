<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>McHenry Cobras</title>

  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(92%, 950px);
      margin: 0 auto;
      padding: 16px 0 50px;
    }

    /* =========================
       COBRAS BANNER
       ========================= */

    .brand-banner {
      height: 116px;
      border-radius: 12px;
      overflow: hidden;
      background:
        linear-gradient(105deg, #111 0%, #171717 50%, #54250f 100%);
      box-shadow: 0 5px 15px rgba(0,0,0,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .brand-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          -20deg,
          transparent 0,
          transparent 34px,
          rgba(255,255,255,.025) 35px,
          transparent 36px
        );
    }

    .brand-banner img {
      position: relative;
      z-index: 1;
      width: min(78%, 580px);
      max-height: 82px;
      object-fit: contain;
    }

    /* =========================
       HEADER
       ========================= */

    .team-header {
      text-align: center;
      padding: 24px 0 14px;
      border-bottom: 3px solid #ff5a00;
      margin-bottom: 20px;
    }

    .team-name {
      margin: 0;
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 800;
      line-height: 1.1;
    }

    .season {
      margin-top: 8px;
      color: #ff5a00;
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 800;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* =========================
       SECTION HEADERS
       ========================= */

    .section-title {
      margin: 18px 0 9px;
      font-size: 18px;
      font-weight: 800;
    }

    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 22px;
    }

    .section-count {
      color: #777;
      font-size: 12px;
    }

    /* =========================
       TEAM INFORMATION
       ========================= */

    .info-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.4fr 1fr auto;
      gap: 8px;
    }

    .info-card {
      min-height: 78px;
      padding: 13px 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 7px;
      box-shadow: 0 2px 5px rgba(0,0,0,.05);
    }

    .info-label {
      color: #ff5a00;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .info-sub {
      color: #777;
      font-size: 10px;
      margin-top: 4px;
    }

    /* =========================
       RECORD
       ========================= */

    .record-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      min-width: 165px;
      padding: 0;
      overflow: hidden;
    }

    .record-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 78px;
      border-left: 1px solid #eee;
    }

    .record-item:first-child {
      border-left: 0;
    }

    .record-number {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .record-label {
      margin-top: 5px;
      color: #555;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.4px;
    }

    /* =========================
       GAMECHANGER FOLLOW
       ========================= */

    .follow-card {
      margin-top: 10px;
      padding: 11px 13px;
      border-left: 4px solid #ff5a00;
      border-radius: 7px;
      background: #111;
      color: white;
      box-shadow: 0 3px 8px rgba(0,0,0,.12);

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .follow-title {
      font-size: 14px;
      font-weight: 800;
    }

    .follow-sub {
      margin-top: 3px;
      font-size: 10px;
      color: #ddd;
    }

    .follow-button {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 5px;
      background: #ff5a00;
      color: white;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .follow-button:hover {
      background: #e84f00;
    }

    /* =========================
       NEXT GAME
       ========================= */

    .next-game {
      position: relative;
      overflow: hidden;
      min-height: 108px;
      border-left: 4px solid #ff5a00;
      border-radius: 8px;
      background: #111;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,.16);

      display: grid;
      grid-template-columns: 85px 1fr 125px;
      align-items: center;
    }

    .next-game::after {
      content: "";
      position: absolute;
      right: -45px;
      top: -50px;
      width: 125px;
      height: 210px;
      border: 12px solid #54250f;
      border-radius: 50%;
      pointer-events: none;
    }

    .next-date {
      position: relative;
      z-index: 1;
      height: 72px;
      border-right: 1px solid #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .next-label {
      color: #ff5a00;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .next-month {
      color: #ff5a00;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .next-day {
      font-size: 28px;
      font-weight: 900;
      line-height: 1;
      margin: 2px 0;
    }

    .next-weekday {
      color: #ccc;
      font-size: 9px;
    }

    .next-opponent {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 15px;
    }

    .next-opponent-name {
      font-size: 17px;
      font-weight: 800;
    }

    .next-time {
      position: relative;
      z-index: 2;
      padding-right: 15px;
      text-align: right;
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =========================
       GAME LOGOS
       ========================= */

    .game-logo {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 50%;
      object-fit: contain;
      background: #eee;
    }

    .initials-logo {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 50%;
      background: #e9e9e9;
      border: 1px solid #d5d5d5;
      color: #555;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 13px;
      font-weight: 900;
    }

    /* =========================
       GAME CARDS
       ========================= */

    .games {
      display: grid;
      gap: 8px;
    }

    .game-card {
      display: grid;
      grid-template-columns: 68px 1fr auto;
      align-items: center;
      min-height: 72px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-left: 3px solid #ff5a00;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,.04);
    }

    .game-card.result {
      border-left-color: #777;
    }

    .game-date {
      height: 54px;
      border-right: 1px solid #eee;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .game-month {
      color: #ff5a00;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .game-day {
      font-size: 23px;
      font-weight: 900;
      line-height: 1;
      margin: 2px 0;
    }

    .game-weekday {
      color: #777;
      font-size: 9px;
    }

    .game-opponent {
      display: flex;
      align-items: center;
      gap: 11px;
      padding-left: 12px;
      min-width: 0;
    }

    .opponent-name {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }

    .home-away {
      margin-top: 3px;
      color: #777;
      font-size: 9px;
      font-weight: 700;
    }

    .game-location {
      margin-top: 4px;
      color: #666;
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 350px;
    }

    .game-right {
      text-align: right;
      min-width: 85px;
    }

    .game-time {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .score {
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    .result-label {
      margin-top: 2px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .result-label.win {
      color: #178a3b;
    }

    .result-label.loss {
      color: #b00020;
    }

    .result-label.tie {
      color: #777;
    }

    /* =========================
       LOCATION
       ========================= */

    .location-icon {
      margin-right: 3px;
    }

    /* =========================
       LOADING / ERROR
       ========================= */

    .loading {
      padding: 35px;
      text-align: center;
      color: #777;
    }

    .error {
      padding: 18px;
      border: 1px solid #e3b4b4;
      border-radius: 7px;
      background: #fff5f5;
      color: #a00000;
      font-size: 13px;
    }

    .empty {
      padding: 15px 0;
      color: #777;
      font-size: 13px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 760px) {

      .page {
        width: 94%;
        padding-top: 10px;
      }

      .brand-banner {
        height: 92px;
      }

      .brand-banner img {
        width: 84%;
        max-height: 68px;
      }

      .team-header {
        padding-top: 18px;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .record-card {
        grid-column: span 2;
      }

      .follow-card {
        align-items: stretch;
        flex-direction: column;
      }

      .follow-button {
        text-align: center;
      }

      .next-game {
        grid-template-columns: 72px 1fr;
        padding-right: 0;
      }

      .next-time {
        grid-column: 2;
        text-align: left;
        padding: 0 15px 12px;
        margin-top: -8px;
      }

      .next-game::after {
        right: -65px;
      }

      .game-card {
        grid-template-columns: 60px 1fr;
        padding: 8px 10px;
      }

      .game-right {
        grid-column: 2;
        text-align: left;
        padding-left: 59px;
        margin-top: -7px;
      }

      .game-location {
        max-width: 240px;
      }
    }

    @media (max-width: 450px) {

      .info-grid {
        grid-template-columns: 1fr;
      }

      .record-card {
        grid-column: auto;
      }

      .next-opponent-name {
        font-size: 14px;
      }

      .game-opponent {
        padding-left: 9px;
      }

      .opponent-name {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- COBRAS BRAND -->
  <div class="brand-banner">
    <img src="cobras-logo.png" alt="McHenry Cobras">
  </div>

  <!-- TEAM HEADER -->
  <header class="team-header">
    <h1 class="team-name" id="teamName">McHenry Cobras</h1>
    <div class="season" id="seasonName">Season</div>
  </header>

  <!-- TEAM INFORMATION -->
  <div class="section-title">Team Information</div>

  <div class="info-grid">

    <div class="info-card">
      <div class="info-label">Team</div>
      <div class="info-value" id="infoTeam">Loading...</div>
      <div class="info-sub" id="infoSeason"></div>
    </div>

    <div class="info-card">
      <div class="info-label">Coaches</div>
      <div class="info-value" id="infoCoaches">Loading...</div>
    </div>

    <div class="info-card">
      <div class="info-label">Roster</div>
      <div class="info-value" id="infoRoster">Loading...</div>
      <div class="info-sub" id="infoLocation"></div>
    </div>

    <div class="info-card record-card">

      <div class="record-item">
        <div class="record-number" id="wins">0</div>
        <div class="record-label">W</div>
      </div>

      <div class="record-item">
        <div class="record-number" id="losses">0</div>
        <div class="record-label">L</div>
      </div>

      <div class="record-item">
        <div class="record-number" id="ties">0</div>
        <div class="record-label">T</div>
      </div>

    </div>

  </div>

  <!-- GAMECHANGER -->
  <div class="follow-card">

    <div>
      <div class="follow-title">
        Follow this team on GameChanger
      </div>

      <div class="follow-sub">
        Get live scores, game updates, stats and team notifications.
      </div>
    </div>

    <a
      id="gameChangerLink"
      class="follow-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      Follow on GameChanger →
    </a>

  </div>

  <!-- NEXT GAME -->
  <div id="nextSection">
    <div class="section-title">Next Game</div>

    <div id="nextGame">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <!-- RECENT RESULTS -->
  <div id="resultsSection" style="display:none;">

    <div class="section-title-row">
      <div class="section-title">Recent Results</div>
      <div class="section-count" id="resultsCount"></div>
    </div>

    <div id="results" class="games"></div>

  </div>

  <!-- UPCOMING GAMES -->
  <div class="section-title-row">

    <div class="section-title">
      Upcoming Games
    </div>

    <div class="section-count" id="upcomingCount"></div>

  </div>

  <div id="upcoming" class="games">
    <div class="loading">Loading...</div>
  </div>

</div>


<script>

  /* =========================================================
     HELPERS
     ========================================================= */

  function getTeamKey() {

    const params = new URLSearchParams(window.location.search);

    return params.get("team");

  }


  function getTeamConfig(key) {

    if (!window.COBRAS_TEAMS) {
      throw new Error("config.js did not load.");
    }

    return window.COBRAS_TEAMS[key];

  }


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function getInitials(name) {

    if (!name) {
      return "⚾";
    }

    const cleaned = name
      .replace(/\([^)]*\)/g, "")
      .replace(/[^a-zA-Z0-9\s]/g, " ")
      .trim();

    const words = cleaned.split(/\s+/).filter(Boolean);

    if (words.length === 1) {
      return words[0].substring(0, 2).toUpperCase();
    }

    return (
      words[0].charAt(0) +
      words[words.length - 1].charAt(0)
    ).toUpperCase();

  }


  function logoFileName(name) {

    if (!name) {
      return null;
    }

    let value = name.toLowerCase();

    /*
      Normalize common GameChanger naming variations.
    */

    value = value
      .replace(/\([^)]*\)/g, "")
      .replace(/- fall/g, "")
      .replace(/12u white/g, "12u")
      .replace(/14u white/g, "14u")
      .replace(/17u white/g, "17u")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-|-$/g, "");

    return value + ".png";

  }


  function makeLogo(teamName, avatarUrl, sizeClass = "game-logo") {

    const localName = logoFileName(teamName);

    /*
      We intentionally DO NOT use the GameChanger avatar URL.

      Those URLs are temporary/signed and can expire,
      resulting in broken images.

      Instead:
        1. Try our local logo.
        2. If it doesn't exist, use initials.
    */

    if (localName) {

      const initials = getInitials(teamName);

      return `
        <img
          class="${sizeClass}"
          src="logos/${localName}"
          alt=""
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >
        <div
          class="initials-logo"
          style="display:none;"
          aria-hidden="true">
          ${escapeHtml(initials)}
        </div>
      `;

    }

    return `
      <div class="initials-logo" aria-hidden="true">
        ${escapeHtml(getInitials(teamName))}
      </div>
    `;

  }


  function gameDate(game) {

    return new Date(game.start_ts);

  }


  function formatDateParts(game) {

    const date = gameDate(game);

    const timezone = game.timezone || "America/Chicago";

    return {

      month: new Intl.DateTimeFormat("en-US", {
        month: "short",
        timeZone: timezone
      }).format(date),

      day: new Intl.DateTimeFormat("en-US", {
        day: "numeric",
        timeZone: timezone
      }).format(date),

      weekday: new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        timeZone: timezone
      }).format(date)

    };

  }


  function formatTime(game) {

    const date = gameDate(game);

    const timezone = game.timezone || "America/Chicago";

    return new Intl.DateTimeFormat("en-US", {

      hour: "numeric",
      minute: "2-digit",
      timeZone: timezone

    }).format(date);

  }


  function getHomeAway(game) {

    return game.home_away === "home"
      ? "HOME"
      : "AWAY";

  }


  /*
    Location support.

    The current GameChanger JSON we've seen does not contain
    a location field.

    This function checks several possible field names so
    that the page will automatically display one if the
    API/workflow provides it in the future.
  */

  function getGameLocation(game) {

    if (!game) {
      return "";
    }

    if (typeof game.location === "string") {
      return game.location;
    }

    if (typeof game.venue === "string") {
      return game.venue;
    }

    if (typeof game.field === "string") {
      return game.field;
    }

    if (game.location && typeof game.location === "object") {

      return (
        game.location.name ||
        game.location.address ||
        game.location.city ||
        ""
      );

    }

    if (game.venue && typeof game.venue === "object") {

      return (
        game.venue.name ||
        game.venue.address ||
        game.venue.city ||
        ""
      );

    }

    return "";

  }


  function locationHtml(game) {

    const location = getGameLocation(game);

    if (!location) {
      return "";
    }

    return `
      <div class="game-location">
        <span class="location-icon">📍</span>
        ${escapeHtml(location)}
      </div>
    `;

  }


  function getScore(game) {

    if (!game || !game.score) {
      return null;
    }

    const score = game.score;

    /*
      Expected GameChanger structure:

      score: {
        team: 4,
        opponent_team: 2
      }
    */

    if (
      typeof score.team === "number" &&
      typeof score.opponent_team === "number"
    ) {

      return {
        team: score.team,
        opponent: score.opponent_team
      };

    }

    return null;

  }


  function getResult(game) {

    const score = getScore(game);

    if (!score) {
      return null;
    }

    if (score.team > score.opponent) {
      return "WIN";
    }

    if (score.team < score.opponent) {
      return "LOSS";
    }

    return "TIE";

  }


  /* =========================================================
     NEXT GAME
     ========================================================= */

  function renderNextGame(game) {

    const container = document.getElementById("nextGame");

    if (!game) {

      container.innerHTML = `
        <div class="empty">
          No upcoming games scheduled.
        </div>
      `;

      return;

    }

    const parts = formatDateParts(game);

    const opponent =
      game.opponent_team?.name || "Opponent";

    const logo =
      game.opponent_team?.avatar_url || "";

    container.innerHTML = `

      <div class="next-game">

        <div class="next-date">

          <div class="next-label">
            Next Game
          </div>

          <div class="next-month">
            ${escapeHtml(parts.month)}
          </div>

          <div class="next-day">
            ${escapeHtml(parts.day)}
          </div>

          <div class="next-weekday">
            ${escapeHtml(parts.weekday)}
          </div>

        </div>

        <div class="next-opponent">

          ${makeLogo(opponent, logo)}

          <div>

            <div class="next-opponent-name">
              ${escapeHtml(opponent)}
            </div>

            <div class="home-away">
              ${getHomeAway(game)}
            </div>

            ${locationHtml(game)}

          </div>

        </div>

        <div class="next-time">
          ${escapeHtml(formatTime(game))}
        </div>

      </div>

    `;

  }


  /* =========================================================
     RESULT CARD
     ========================================================= */

  function renderResult(game) {

    const parts = formatDateParts(game);

    const opponent =
      game.opponent_team?.name || "Opponent";

    const logo =
      game.opponent_team?.avatar_url || "";

    const score = getScore(game);

    const result = getResult(game);

    let resultClass = "tie";

    if (result === "WIN") {
      resultClass = "win";
    }

    if (result === "LOSS") {
      resultClass = "loss";
    }

    const scoreText = score
      ? `${score.team} - ${score.opponent}`
      : "—";

    return `

      <div class="game-card result">

        <div class="game-date">

          <div class="game-month">
            ${escapeHtml(parts.month)}
          </div>

          <div class="game-day">
            ${escapeHtml(parts.day)}
          </div>

          <div class="game-weekday">
            ${escapeHtml(parts.weekday)}
          </div>

        </div>

        <div class="game-opponent">

          ${makeLogo(opponent, logo)}

          <div>

            <div class="opponent-name">
              ${escapeHtml(opponent)}
            </div>

            <div class="home-away">
              ${getHomeAway(game)}
            </div>

            ${locationHtml(game)}

          </div>

        </div>

        <div class="game-right">

          <div class="score">
            ${escapeHtml(scoreText)}
          </div>

          <div class="result-label ${resultClass}">
            ${escapeHtml(result || "")}
          </div>

        </div>

      </div>

    `;

  }


  /* =========================================================
     UPCOMING GAME CARD
     ========================================================= */

  function renderUpcoming(game) {

    const parts = formatDateParts(game);

    const opponent =
      game.opponent_team?.name || "Opponent";

    const logo =
      game.opponent_team?.avatar_url || "";

    return `

      <div class="game-card">

        <div class="game-date">

          <div class="game-month">
            ${escapeHtml(parts.month)}
          </div>

          <div class="game-day">
            ${escapeHtml(parts.day)}
          </div>

          <div class="game-weekday">
            ${escapeHtml(parts.weekday)}
          </div>

        </div>

        <div class="game-opponent">

          ${makeLogo(opponent, logo)}

          <div>

            <div class="opponent-name">
              ${escapeHtml(opponent)}
            </div>

            <div class="home-away">
              ${getHomeAway(game)}
            </div>

            ${locationHtml(game)}

          </div>

        </div>

        <div class="game-right">

          <div class="game-time">
            ${escapeHtml(formatTime(game))}
          </div>

        </div>

      </div>

    `;

  }


  /* =========================================================
     MAIN
     ========================================================= */

  async function loadTeam() {

    const key = getTeamKey();

    if (!key) {

      showError("No team was specified.");

      return;

    }

    const team = getTeamConfig(key);

    if (!team) {

      showError("Team not found.");

      return;

    }

    if (!team.active) {

      showError("This team is not currently active.");

      return;

    }

    /*
      Header
    */

    document.title =
      `McHenry Cobras ${team.name}`;

    document.getElementById("teamName").textContent =
      `McHenry Cobras ${team.name}`;

    document.getElementById("seasonName").textContent =
      team.season || "Season";

    /*
      Team information
    */

    document.getElementById("infoTeam").textContent =
      `McHenry Cobras ${team.name}`;

    document.getElementById("infoSeason").textContent =
      `${team.season || ""} · Baseball`;

    const coaches = [];

    if (team.headCoach) {
      coaches.push(team.headCoach);
    }

    if (Array.isArray(team.assistantCoaches)) {
      coaches.push(...team.assistantCoaches);
    }

    document.getElementById("infoCoaches").textContent =
      coaches.join(" · ");

    document.getElementById("infoRoster").textContent =
      "Roster";

    document.getElementById("infoLocation").textContent =
      "McHenry, Illinois";

    /*
      GameChanger link
    */

    if (team.gameChangerTeamId) {

      document.getElementById("gameChangerLink").href =
        `https://web.gc.com/teams/${team.gameChangerTeamId}`;

    }

    /*
      Load schedule
    */

    try {

      const response = await fetch(
        `schedules/${key}.json?v=${Date.now()}`
      );

      if (!response.ok) {
        throw new Error(
          `Unable to load schedules/${key}.json`
        );
      }

      const games = await response.json();

      if (!Array.isArray(games)) {
        throw new Error("Schedule data is not an array.");
      }

      /*
        Sort chronologically.
      */

      games.sort(
        (a, b) =>
          new Date(a.start_ts) -
          new Date(b.start_ts)
      );

      /*
        Determine completed vs upcoming.

        We use both game_status and the scheduled time
        so this remains useful even if GameChanger's
        status value varies.
      */

      const now = new Date();

      const completed = games.filter(game => {

        const status =
          String(game.game_status || "").toLowerCase();

        return (
          status === "completed" ||
          (
            new Date(game.end_ts || game.start_ts) < now &&
            getScore(game) !== null
          )
        );

      });

      const upcoming = games.filter(game => {

        const status =
          String(game.game_status || "").toLowerCase();

        return (
          status !== "completed" &&
          new Date(game.start_ts) >= now
        );

      });

      /*
        Record

        We calculate this from the actual completed games,
        rather than relying only on team metadata.
      */

      let wins = 0;
      let losses = 0;
      let ties = 0;

      completed.forEach(game => {

        const result = getResult(game);

        if (result === "WIN") {
          wins++;
        }

        if (result === "LOSS") {
          losses++;
        }

        if (result === "TIE") {
          ties++;
        }

      });

      document.getElementById("wins").textContent =
        wins;

      document.getElementById("losses").textContent =
        losses;

      document.getElementById("ties").textContent =
        ties;

      /*
        Next game
      */

      renderNextGame(upcoming[0]);

      /*
        Recent results

        Only show the section if there are completed games.
      */

      const resultsSection =
        document.getElementById("resultsSection");

      const resultsContainer =
        document.getElementById("results");

      if (completed.length > 0) {

        resultsSection.style.display = "block";

        const recent =
          [...completed]
            .reverse()
            .slice(0, 5);

        document.getElementById("resultsCount").textContent =
          `${completed.length} Game${completed.length === 1 ? "" : "s"}`;

        resultsContainer.innerHTML =
          recent.map(renderResult).join("");

      } else {

        resultsSection.style.display = "none";

      }

      /*
        Upcoming games

        Don't repeat the Next Game in this list.
      */

      const remainingUpcoming =
        upcoming.slice(1);

      document.getElementById("upcomingCount").textContent =
        `${remainingUpcoming.length} Game${remainingUpcoming.length === 1 ? "" : "s"}`;

      const upcomingContainer =
        document.getElementById("upcoming");

      if (remainingUpcoming.length === 0) {

        upcomingContainer.innerHTML = `
          <div class="empty">
            No additional upcoming games scheduled.
          </div>
        `;

      } else {

        upcomingContainer.innerHTML =
          remainingUpcoming
            .map(renderUpcoming)
            .join("");

      }

    } catch (error) {

      console.error(error);

      showError("Unable to load this team right now.");

    }

  }


  function showError(message) {

    document.getElementById("nextGame").innerHTML = "";

    document.getElementById("upcoming").innerHTML = `
      <div class="error">
        ${escapeHtml(message)}
      </div>
    `;

  }


  loadTeam();

</script>
