<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>McHenry Cobras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 18px 18px 50px;
    }

    /* =========================
       COBRAS HEADER
       ========================= */

    .brand-banner {
      position: relative;
      overflow: hidden;
      height: 145px;
      border-radius: 12px;
      background:
        linear-gradient(110deg, #0b0b0b 0%, #171717 55%, #54270f 100%);
      box-shadow: 0 5px 14px rgba(0,0,0,.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          -20deg,
          rgba(255,255,255,.025) 0,
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 38px
        );
      pointer-events: none;
    }

    .brand-banner::after {
      content: "";
      position: absolute;
      right: 70px;
      top: -80px;
      width: 230px;
      height: 300px;
      border-left: 14px solid rgba(255,90,0,.22);
      border-radius: 50%;
      transform: rotate(18deg);
      pointer-events: none;
    }

    .brand-logo {
      position: relative;
      z-index: 2;
      width: min(75%, 580px);
      max-height: 108px;
      object-fit: contain;
    }

    .team-heading {
      text-align: center;
      padding: 22px 0 12px;
    }

    .team-heading h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 900;
      letter-spacing: -1px;
    }

    .season {
      margin-top: 5px;
      color: #ff5a00;
      font-size: clamp(18px, 3vw, 25px);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .orange-line {
      height: 3px;
      background: #ff5a00;
      margin: 0 0 25px;
    }

    /* =========================
       TEAM INFORMATION
       ========================= */

    .section-title {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: 800;
    }

    .team-info-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr 1.05fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .info-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 13px 12px;
      min-height: 72px;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }

    .info-label {
      color: #ff5a00;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
    }

    .info-sub {
      margin-top: 4px;
      color: #777;
      font-size: 10px;
    }

    /* =========================
       RECORD
       ========================= */

    .record-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0;
      overflow: hidden;
      text-align: center;
    }

    .record-item {
      padding: 10px 5px;
      border-left: 1px solid #e5e5e5;
    }

    .record-item:first-child {
      border-left: 0;
    }

    .record-number {
      font-size: 23px;
      line-height: 1;
      font-weight: 900;
    }

    .record-label {
      margin-top: 4px;
      color: #777;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* =========================
       GAMECHANGER LINK
       ========================= */

    .gamechanger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 14px 0 24px;
      padding: 14px 16px;
      background: #111;
      color: white;
      border-left: 4px solid #ff5a00;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0,0,0,.12);
      text-decoration: none;
    }

    .gc-title {
      font-size: 15px;
      font-weight: 800;
    }

    .gc-subtitle {
      margin-top: 4px;
      color: #ddd;
      font-size: 11px;
    }

    .gc-button {
      display: inline-block;
      flex-shrink: 0;
      padding: 9px 15px;
      background: #ff5a00;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }

    .gamechanger:hover .gc-button {
      background: #e84f00;
    }

    /* =========================
       NEXT GAME
       ========================= */

    .next-game {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 88px 1fr auto;
      align-items: center;
      min-height: 118px;
      margin-bottom: 24px;
      padding: 16px;
      background: #111;
      color: white;
      border-left: 4px solid #ff5a00;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(0,0,0,.15);
    }

    .next-game::after {
      content: "";
      position: absolute;
      right: -45px;
      top: -80px;
      width: 160px;
      height: 260px;
      border: 12px solid rgba(255,90,0,.28);
      border-radius: 50%;
      transform: rotate(20deg);
      pointer-events: none;
    }

    .next-label {
      color: #ff5a00;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .next-date {
      text-align: center;
      border-right: 1px solid #444;
      padding-right: 15px;
    }

    .next-month {
      color: #ff5a00;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .next-day {
      font-size: 29px;
      font-weight: 900;
      line-height: 1;
      margin: 3px 0;
    }

    .next-weekday {
      color: #ccc;
      font-size: 10px;
    }

    .next-opponent {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-left: 15px;
    }

    .next-opponent img,
    .result-opponent img,
    .schedule-opponent img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .placeholder {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #eee;
      color: #777;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0;
    }

    .next-name {
      font-size: 18px;
      font-weight: 900;
    }

    .home-away {
      margin-top: 3px;
      color: #bbb;
      font-size: 10px;
      font-weight: 700;
    }

    .next-time {
      position: relative;
      z-index: 2;
      padding-right: 5px;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* =========================
       RESULTS / SCHEDULE
       ========================= */

    .section-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .game-count {
      color: #777;
      font-size: 11px;
    }

    .games {
      display: grid;
      gap: 9px;
    }

    .game-card,
    .result-card {
      display: grid;
      grid-template-columns: 75px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-left: 3px solid #ff5a00;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }

    .result-card {
      border-left-color: #777;
    }

    .game-date {
      text-align: center;
      border-right: 1px solid #e5e5e5;
      padding-right: 10px;
    }

    .game-month {
      color: #ff5a00;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .game-day {
      font-size: 23px;
      line-height: 1;
      font-weight: 900;
      margin: 2px 0;
    }

    .game-weekday {
      color: #777;
      font-size: 10px;
    }

    .game-opponent {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .opponent-name {
      font-size: 14px;
      font-weight: 800;
    }

    .game-location {
      margin-top: 3px;
      color: #777;
      font-size: 9px;
      font-weight: 700;
    }

    .game-right {
      text-align: right;
      white-space: nowrap;
    }

    .game-time {
      font-size: 13px;
      font-weight: 800;
    }

    /* =========================
       RESULTS
       ========================= */

    .result-score {
      text-align: right;
      min-width: 70px;
    }

    .score {
      font-size: 20px;
      font-weight: 900;
    }

    .result-status {
      margin-top: 3px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .result-status.win {
      color: #16823b;
    }

    .result-status.loss {
      color: #b3261e;
    }

    .result-status.tie {
      color: #777;
    }

    .empty-results {
      padding: 18px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    .section {
      margin-top: 24px;
    }

    .hidden {
      display: none !important;
    }

    .error {
      margin-top: 20px;
      padding: 20px;
      background: #fff5f5;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
      color: #a00000;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 760px) {

      .page {
        padding: 10px 10px 40px;
      }

      .brand-banner {
        height: 105px;
      }

      .brand-logo {
        width: 82%;
        max-height: 82px;
      }

      .team-heading {
        padding-top: 16px;
      }

      .orange-line {
        margin-bottom: 20px;
      }

      .team-info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .record-card {
        grid-column: span 2;
      }

      .next-game {
        grid-template-columns: 65px 1fr;
        gap: 10px;
      }

      .next-time {
        grid-column: 2;
        text-align: left;
        padding-left: 67px;
        margin-top: -12px;
      }

      .next-opponent {
        padding-left: 8px;
      }

      .next-name {
        font-size: 15px;
      }

      .game-card,
      .result-card {
        grid-template-columns: 62px 1fr auto;
        gap: 9px;
      }

      .game-opponent img,
      .result-opponent img,
      .schedule-opponent img {
        width: 43px;
        height: 43px;
      }

      .placeholder {
        width: 43px;
        height: 43px;
      }

      .opponent-name {
        font-size: 13px;
      }

      .game-right {
        font-size: 11px;
      }

      .result-score {
        min-width: 55px;
      }

      .score {
        font-size: 17px;
      }
    }

    @media (max-width: 520px) {

      .team-info-grid {
        grid-template-columns: 1fr;
      }

      .record-card {
        grid-column: auto;
      }

      .gamechanger {
        align-items: stretch;
        flex-direction: column;
      }

      .gc-button {
        text-align: center;
      }

      .brand-banner {
        height: 88px;
      }

      .brand-logo {
        width: 88%;
        max-height: 70px;
      }

      .next-game {
        grid-template-columns: 60px 1fr;
      }

      .next-time {
        padding-left: 60px;
      }

      .game-card,
      .result-card {
        grid-template-columns: 55px 1fr;
      }

      .game-right,
      .result-score {
        grid-column: 2;
        text-align: left;
        margin-top: -5px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- COBRAS BANNER -->
  <div class="brand-banner">
    <img
      class="brand-logo"
      src="cobras-logo.png"
      alt="McHenry Cobras Baseball"
    >
  </div>

  <!-- TEAM TITLE -->
  <div class="team-heading">
    <h1 id="teamTitle">McHenry Cobras</h1>
    <div class="season" id="teamSeason">2027 Season</div>
  </div>

  <div class="orange-line"></div>

  <!-- TEAM INFORMATION -->
  <section>

    <h2 class="section-title">Team Information</h2>

    <div class="team-info-grid">

      <div class="info-card">
        <div class="info-label">Team</div>
        <div class="info-value" id="teamName">Loading...</div>
        <div class="info-sub" id="teamSport"></div>
      </div>

      <div class="info-card">
        <div class="info-label">Coaches</div>
        <div class="info-value" id="coaches">Loading...</div>
      </div>

      <div class="info-card">
        <div class="info-label">Roster</div>
        <div class="info-value" id="rosterCount">Loading...</div>
        <div class="info-sub" id="teamLocation"></div>
      </div>

      <div class="info-card record-card">

        <div class="record-item">
          <div class="record-number" id="wins">0</div>
          <div class="record-label">W</div>
        </div>

        <div class="record-item">
          <div class="record-number" id="losses">0</div>
          <div class="record-label">L</div>
        </div>

        <div class="record-item">
          <div class="record-number" id="ties">0</div>
          <div class="record-label">T</div>
        </div>

      </div>

    </div>

  </section>


  <!-- GAMECHANGER -->
  <a
    id="gameChangerLink"
    class="gamechanger"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
  >
    <div>
      <div class="gc-title">
        Follow this team on GameChanger
      </div>

      <div class="gc-subtitle">
        Get live scores, game updates, stats and team notifications.
      </div>
    </div>

    <span class="gc-button">
      Follow on GameChanger →
    </span>
  </a>


  <!-- NEXT GAME -->
  <section id="nextGameSection" class="section">

    <h2 class="section-title">Next Game</h2>

    <div id="nextGame"></div>

  </section>


  <!-- RECENT RESULTS -->
  <section id="resultsSection" class="section hidden">

    <div class="section-heading-row">

      <h2 class="section-title">
        Recent Results
      </h2>

      <div id="resultCount" class="game-count"></div>

    </div>

    <div id="results" class="games"></div>

  </section>


  <!-- UPCOMING GAMES -->
  <section id="upcomingSection" class="section">

    <div class="section-heading-row">

      <h2 class="section-title">
        Upcoming Games
      </h2>

      <div id="upcomingCount" class="game-count"></div>

    </div>

    <div id="upcomingGames" class="games"></div>

  </section>


  <div id="error"></div>

</div>


<script src="config.js"></script>

<script>

  /* =========================
     HELPERS
     ========================= */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function getTeamKey() {

    const params =
      new URLSearchParams(window.location.search);

    return params.get("team") || "lorenz12u";

  }


  function formatDate(ts, timezone) {

    const date = new Date(ts);

    return {

      month:
        new Intl.DateTimeFormat("en-US", {
          month: "short",
          timeZone: timezone
        }).format(date),

      day:
        new Intl.DateTimeFormat("en-US", {
          day: "numeric",
          timeZone: timezone
        }).format(date),

      weekday:
        new Intl.DateTimeFormat("en-US", {
          weekday: "short",
          timeZone: timezone
        }).format(date),

      time:
        new Intl.DateTimeFormat("en-US", {
          hour: "numeric",
          minute: "2-digit",
          timeZone: timezone
        }).format(date)

    };

  }


  /* =========================
     LOCAL LOGOS
     ========================= */

  const LOCAL_LOGOS = {

    "Grayslake Coyotes 12U":
      "logos/grayslake-coyotes-12u.png",

    "Sparks North 12U- Lozano":
      "logos/sparks-north-12u-lozano.png",

    "GRB Rays Illinois - Moore 12U":
      "logos/grb-rays-illinois-moore-12u.png",

    "Elite NW 12U Milazzo":
      "logos/elite-nw-12u-milazzo.png",

    "Elite NW 12U Clouse":
      "logos/elite-nw-12u-clouse.png",

    "LITH Thunder 12U":
      "logos/lith-thunder-black-12u.png",

    "SBA Raiders-Lopresti 12U":
      "logos/sba-raiders-lopresti-12u.png"

  };


  function getLogo(game) {

    const opponentName =
      game &&
      game.opponent_team &&
      game.opponent_team.name
        ? game.opponent_team.name
        : "";

    const localLogo =
      LOCAL_LOGOS[opponentName];

    if (localLogo) {

      return `
        <img
          src="${localLogo}"
          alt=""
          onerror="this.onerror=null;this.src='${escapeHtml(
            game.opponent_team &&
            game.opponent_team.avatar_url
              ? game.opponent_team.avatar_url
              : ""
          )}'"
        >
      `;

    }


    const remoteLogo =
      game &&
      game.opponent_team &&
      game.opponent_team.avatar_url;


    if (remoteLogo) {

      return `
        <img
          src="${escapeHtml(remoteLogo)}"
          alt=""
        >
      `;

    }


    return `
      <div class="placeholder">
        ⚾
      </div>
    `;

  }


  function getHomeAway(game) {

    return game.home_away === "home"
      ? "HOME"
      : "AWAY";

  }


  function getOpponentName(game) {

    return escapeHtml(
      game &&
      game.opponent_team &&
      game.opponent_team.name
        ? game.opponent_team.name
        : "Opponent"
    );

  }


  function isCompleted(game) {

    return String(
      game.game_status || ""
    ).toLowerCase() === "completed";

  }


  function getScore(game) {

    if (!game.score) {
      return null;
    }

    const teamScore =
      Number(game.score.team);

    const opponentScore =
      Number(game.score.opponent_team);


    if (
      Number.isNaN(teamScore) ||
      Number.isNaN(opponentScore)
    ) {
      return null;
    }


    return {
      team: teamScore,
      opponent: opponentScore
    };

  }


  function getResult(score) {

    if (!score) {

      return {
        label: "",
        className: ""
      };

    }


    if (score.team > score.opponent) {

      return {
        label: "WIN",
        className: "win"
      };

    }


    if (score.team < score.opponent) {

      return {
        label: "LOSS",
        className: "loss"
      };

    }


    return {
      label: "TIE",
      className: "tie"
    };

  }


  /* =========================
     LOAD TEAM
     ========================= */

  async function loadTeam() {

    const teamKey =
      getTeamKey();


    const config =
      COBRAS_TEAMS || {};


    const teamConfig =
      config[teamKey];


    if (!teamConfig) {

      throw new Error(
        "Team '" +
        teamKey +
        "' was not found in config.js."
      );

    }


    if (!teamConfig.active) {

      throw new Error(
        "This team is not currently active."
      );

    }


    if (!teamConfig.gameChangerTeamId) {

      throw new Error(
        "This team does not have a GameChanger team ID."
      );

    }


    const teamId =
      teamConfig.gameChangerTeamId;


    /* =========================
       LOAD TEAM METADATA
       ========================= */

    let teamData = null;


    try {

      const response =
        await fetch(
          "https://api.team-manager.gc.com/public/teams/" +
          encodeURIComponent(teamId) +
          "?v=" +
          Date.now()
        );


      if (response.ok) {

        teamData =
          await response.json();

      }

    } catch (error) {

      console.warn(
        "Unable to load team metadata:",
        error
      );

    }


    /* =========================
       LOAD SCHEDULE
       ========================= */

    const scheduleResponse =
      await fetch(
        "schedules/" +
        teamKey +
        ".json?v=" +
        Date.now()
      );


    if (!scheduleResponse.ok) {

      throw new Error(
        "Unable to load schedule for " +
        teamConfig.name
      );

    }


    const games =
      await scheduleResponse.json();


    /* =========================
       TEAM HEADER
       ========================= */

    const actualTeamName =
      teamData && teamData.name
        ? teamData.name
        : "McHenry Cobras " +
          teamConfig.name;


    document.title =
      actualTeamName +
      " | McHenry Cobras";


    document.getElementById(
      "teamTitle"
    ).textContent =
      actualTeamName;


    document.getElementById(
      "teamSeason"
    ).textContent =
      teamConfig.season;


    document.getElementById(
      "teamName"
    ).textContent =
      actualTeamName;


    document.getElementById(
      "teamSport"
    ).textContent =
      teamConfig.season +
      " · Baseball";


    /* =========================
       COACHES
       ========================= */

    const coaches = [

      teamConfig.headCoach,

      ...(teamConfig.assistantCoaches || [])

    ].filter(Boolean);


    document.getElementById(
      "coaches"
    ).textContent =
      coaches.join(" · ");


    /* =========================
       TEAM METADATA
       ========================= */

    if (teamData) {

      const playerCount =
        teamData.player_count;


      if (
        playerCount !== undefined &&
        playerCount !== null
      ) {

        document.getElementById(
          "rosterCount"
        ).textContent =
          playerCount +
          (
            Number(playerCount) === 1
              ? " Player"
              : " Players"
          );

      } else {

        document.getElementById(
          "rosterCount"
        ).textContent =
          "Roster";

      }


      if (
        teamData.location &&
        teamData.location.city
      ) {

        const location =
          teamData.location.city +
          (
            teamData.location.state
              ? ", " +
                teamData.location.state
              : ""
          );


        document.getElementById(
          "teamLocation"
        ).textContent =
          location;

      }

    } else {

      document.getElementById(
        "rosterCount"
      ).textContent =
        "Roster";

    }


    /* =========================
       RECORD
       ========================= */

    let wins = 0;
    let losses = 0;
    let ties = 0;


    games.forEach(game => {

      if (!isCompleted(game)) {
        return;
      }


      const score =
        getScore(game);


      if (!score) {
        return;
      }


      if (score.team > score.opponent) {

        wins++;

      } else if (
        score.team < score.opponent
      ) {

        losses++;

      } else {

        ties++;

      }

    });


    document.getElementById(
      "wins"
    ).textContent =
      wins;


    document.getElementById(
      "losses"
    ).textContent =
      losses;


    document.getElementById(
      "ties"
    ).textContent =
      ties;


    /* =========================
       GAMECHANGER LINK
       ========================= */

    document.getElementById(
      "gameChangerLink"
    ).href =
      "https://web.gc.com/teams/" +
      encodeURIComponent(teamId);


    /* =========================
       SORT GAMES
       ========================= */

    games.sort(
      (a, b) =>
        new Date(a.start_ts) -
        new Date(b.start_ts)
    );


    const completedGames =
      games.filter(
        game => isCompleted(game)
      );


    const upcomingGames =
      games.filter(
        game => !isCompleted(game)
      );


    /* =========================
       NEXT GAME
       ========================= */

    const nextGame =
      upcomingGames.length
        ? upcomingGames[0]
        : null;


    if (nextGame) {

      const date =
        formatDate(
          nextGame.start_ts,
          nextGame.timezone
        );


      document.getElementById(
        "nextGame"
      ).innerHTML = `

        <div class="next-game">

          <div class="next-date">

            <div class="next-label">
              Next Game
            </div>

            <div class="next-month">
              ${date.month}
            </div>

            <div class="next-day">
              ${date.day}
            </div>

            <div class="next-weekday">
              ${date.weekday}
            </div>

          </div>


          <div class="next-opponent">

            ${getLogo(nextGame)}

            <div>

              <div class="next-name">
                ${getOpponentName(nextGame)}
              </div>

              <div class="home-away">
                ${getHomeAway(nextGame)}
              </div>

            </div>

          </div>


          <div class="next-time">
            ${date.time}
          </div>

        </div>

      `;

    } else {

      document.getElementById(
        "nextGameSection"
      ).innerHTML = `

        <h2 class="section-title">
          Next Game
        </h2>

        <div class="empty-results">
          No upcoming games currently scheduled.
        </div>

      `;

    }


    /* =========================
       RECENT RESULTS
       ========================= */

    const resultsContainer =
      document.getElementById(
        "results"
      );


    if (completedGames.length > 0) {

      document
        .getElementById(
          "resultsSection"
        )
        .classList.remove("hidden");


      document.getElementById(
        "resultCount"
      ).textContent =
        completedGames.length +
        (
          completedGames.length === 1
            ? " Game"
            : " Games"
        );


      const resultsToShow =
        [...completedGames].reverse();


      resultsContainer.innerHTML =
        resultsToShow
          .map(game => {

            const date =
              formatDate(
                game.start_ts,
                game.timezone
              );


            const score =
              getScore(game);


            const result =
              getResult(score);


            return `

              <div class="result-card">

                <div class="game-date">

                  <div class="game-month">
                    ${date.month}
                  </div>

                  <div class="game-day">
                    ${date.day}
                  </div>

                  <div class="game-weekday">
                    ${date.weekday}
                  </div>

                </div>


                <div class="game-opponent result-opponent">

                  ${getLogo(game)}

                  <div>

                    <div class="opponent-name">
                      ${getOpponentName(game)}
                    </div>

                    <div class="game-location">
                      ${getHomeAway(game)}
                    </div>

                  </div>

                </div>


                <div class="result-score">

                  <div class="score">

                    ${
                      score
                        ? score.team +
                          " - " +
                          score.opponent
                        : "Final"
                    }

                  </div>

                  <div class="result-status ${result.className}">
                    ${result.label}
                  </div>

                </div>

              </div>

            `;

          })
          .join("");


    } else {

      document
        .getElementById(
          "resultsSection"
        )
        .classList.add("hidden");

    }


    /* =========================
       UPCOMING GAMES
       ========================= */

    const upcomingContainer =
      document.getElementById(
        "upcomingGames"
      );


    /*
      The next game is featured above,
      so don't duplicate it below.
    */

    const remainingUpcoming =
      upcomingGames.slice(1);


    document.getElementById(
      "upcomingCount"
    ).textContent =
      upcomingGames.length +
      (
        upcomingGames.length === 1
          ? " Game"
          : " Games"
      );


    if (remainingUpcoming.length === 0) {

      if (upcomingGames.length === 0) {

        document
          .getElementById(
            "upcomingSection"
          )
          .classList.add("hidden");

      } else {

        upcomingContainer.innerHTML = `

          <div class="empty-results">
            No additional upcoming games scheduled.
          </div>

        `;

      }

    } else {

      upcomingContainer.innerHTML =
        remainingUpcoming
          .map(game => {

            const date =
              formatDate(
                game.start_ts,
                game.timezone
              );


            return `

              <div class="game-card">

                <div class="game-date">

                  <div class="game-month">
                    ${date.month}
                  </div>

                  <div class="game-day">
                    ${date.day}
                  </div>

                  <div class="game-weekday">
                    ${date.weekday}
                  </div>

                </div>


                <div class="game-opponent schedule-opponent">

                  ${getLogo(game)}

                  <div>

                    <div class="opponent-name">
                      ${getOpponentName(game)}
                    </div>

                    <div class="game-location">
                      ${getHomeAway(game)}
                    </div>

                  </div>

                </div>


                <div class="game-right">

                  <div class="game-time">
                    ${date.time}
                  </div>

                </div>

              </div>

            `;

          })
          .join("");

    }

  }


  /* =========================
     START
     ========================= */

  loadTeam()
    .catch(error => {

      console.error(error);

      document.getElementById(
        "error"
      ).innerHTML = `

        <div class="error">
          Unable to load this team right now.
        </div>

      `;

    });

</script>

</body>
</html>
