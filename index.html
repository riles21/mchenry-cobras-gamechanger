<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McHenry Cobras Baseball</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f5f5f5;
    color: #0d0d0d;
    font-family: Arial, Helvetica, sans-serif;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .page {
    width: min(940px, calc(100% - 24px));
    margin: 24px auto 60px;
  }

  /* =========================
     COBRAS HEADER
  ========================== */

  .brand-banner {
    height: 150px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(105deg, #111 0%, #151515 48%, #4b1f0c 100%);
    box-shadow: 0 5px 14px rgba(0,0,0,.15);
  }

  .brand-banner::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .35;
    background:
      repeating-linear-gradient(
        -25deg,
        transparent 0,
        transparent 28px,
        rgba(255,255,255,.045) 29px,
        transparent 30px
      );
  }

  .brand-logo {
    position: relative;
    z-index: 1;
    width: min(680px, 78%);
    max-height: 120px;
    object-fit: contain;
  }

  /* =========================
     HEADER
  ========================== */

  .page-heading {
    text-align: center;
    margin: 24px 0 10px;
  }

  .page-heading h1 {
    margin: 0;
    font-size: clamp(32px, 5vw, 44px);
    line-height: 1.08;
    font-weight: 800;
  }

  .season {
    margin-top: 9px;
    color: #ff5a00;
    font-size: clamp(20px, 3vw, 25px);
    font-weight: 800;
    letter-spacing: .5px;
  }

  .orange-line {
    height: 3px;
    background: #ff5a00;
    margin: 16px 0 25px;
  }

  /* =========================
     SECTION HEADERS
  ========================== */

  .section-title {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: 800;
  }

  /* =========================
     ORGANIZATION SUMMARY
  ========================== */

  .org-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .summary-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }

  .summary-number {
    font-size: 27px;
    font-weight: 800;
    line-height: 1;
  }

  .summary-label {
    margin-top: 7px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.1px;
    color: #666;
  }

  /* =========================
     TEAM DIRECTORY
  ========================== */

  .teams-section {
    margin-top: 28px;
  }

  .age-group {
    margin-top: 24px;
  }

  .age-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 9px;
  }

  .age-title {
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
  }

  .age-line {
    height: 1px;
    background: #d5d5d5;
    flex: 1;
  }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }

  .team-card {
    position: relative;
    min-height: 62px;
    background: white;
    border: 1px solid #ddd;
    border-left: 3px solid #ff5a00;
    border-radius: 8px;
    padding: 10px 38px 9px 13px;
    transition:
      transform .12s ease,
      box-shadow .12s ease,
      border-color .12s ease;
  }

  .team-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(0,0,0,.10);
    border-color: #ccc;
  }

  .team-name {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.15;
  }

  .coaches {
    margin-top: 5px;
    color: #666;
    font-size: 9px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-record {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    text-align: right;
  }

  .record-value {
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
  }

  .record-label {
    margin-top: 4px;
    font-size: 7px;
    font-weight: 800;
    color: #777;
    letter-spacing: .7px;
  }

  .arrow {
    position: absolute;
    right: 10px;
    bottom: 8px;
    color: #ff5a00;
    font-size: 15px;
    line-height: 1;
  }

  /* =========================
     FOOTER
  ========================== */

  .footer {
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid #ddd;
    text-align: center;
    color: #888;
    font-size: 9px;
  }

  /* =========================
     LOADING / ERROR
  ========================== */

  .loading {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 12px;
  }

  .error {
    background: #fff4f4;
    border: 1px solid #efb5b5;
    color: #c33;
    border-radius: 7px;
    padding: 14px;
    font-size: 12px;
  }

  /* =========================
     MOBILE
  ========================== */

  @media (max-width: 700px) {

    .page {
      width: calc(100% - 16px);
      margin-top: 10px;
    }

    .brand-banner {
      height: 105px;
      border-radius: 8px;
    }

    .brand-logo {
      width: 82%;
      max-height: 88px;
    }

    .page-heading {
      margin-top: 17px;
    }

    .page-heading h1 {
      font-size: 30px;
    }

    .season {
      font-size: 19px;
    }

    .org-summary {
      grid-template-columns: repeat(2, 1fr);
    }

    .team-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 400px) {

    .summary-number {
      font-size: 23px;
    }

    .summary-label {
      font-size: 8px;
    }

    .team-name {
      font-size: 13px;
    }
  }
</style>
</head>

<body>

<div class="page">

  <!-- =========================
       COBRAS BRAND
  ========================== -->

  <div class="brand-banner">
    <img
      class="brand-logo"
      src="cobras-logo.png"
      alt="McHenry Cobras"
    >
  </div>

  <!-- =========================
       PAGE HEADER
  ========================== -->

  <div class="page-heading">
    <h1>McHenry Cobras Baseball</h1>
    <div class="season">2027 SEASON</div>
  </div>

  <div class="orange-line"></div>

  <!-- =========================
       ORGANIZATION
  ========================== -->

  <section>
    <h2 class="section-title">Cobras Organization</h2>

    <div class="org-summary">

      <div class="summary-card">
        <div class="summary-number" id="activeTeams">0</div>
        <div class="summary-label">ACTIVE TEAMS</div>
      </div>

      <div class="summary-card">
        <div class="summary-number" id="orgWins">0</div>
        <div class="summary-label">WINS</div>
      </div>

      <div class="summary-card">
        <div class="summary-number" id="orgLosses">0</div>
        <div class="summary-label">LOSSES</div>
      </div>

      <div class="summary-card">
        <div class="summary-number" id="orgTies">0</div>
        <div class="summary-label">TIES</div>
      </div>

    </div>
  </section>

  <!-- =========================
       TEAMS
  ========================== -->

  <section class="teams-section">

    <h2 class="section-title">Cobras Teams</h2>

    <div id="teamDirectory">
      <div class="loading">Loading Cobras teams...</div>
    </div>

  </section>

  <div class="footer">
    McHenry Cobras Baseball · 2027 Season
  </div>

</div>

<script src="config.js"></script>

<script>
(function () {

  if (typeof COBRAS_TEAMS === "undefined") {

    document.getElementById("teamDirectory").innerHTML =
      '<div class="error">Unable to load team configuration.</div>';

    return;
  }

  const activeTeams = Object.entries(COBRAS_TEAMS)
    .filter(function ([key, team]) {
      return team &&
             team.active === true &&
             team.gameChangerTeamId;
    });

  document.getElementById("activeTeams").textContent =
    activeTeams.length;

  /*
    Age groups are determined from the beginning
    of the configured team name.

    Examples:
      8U Deubel       -> 8U
      12U Lorenz      -> 12U
      17U Deubel      -> 17U
  */

  const groups = {};

  activeTeams.forEach(function ([key, team]) {

    const match = String(team.name || "").match(/^(\d+U)/i);

    const age =
      match
        ? match[1].toUpperCase()
        : "Other";

    if (!groups[age]) {
      groups[age] = [];
    }

    groups[age].push({
      key: key,
      team: team
    });

  });

  /*
    Sort age groups numerically.
  */

  const sortedGroups = Object.entries(groups)
    .sort(function (a, b) {

      if (a[0] === "Other") return 1;
      if (b[0] === "Other") return -1;

      return parseInt(a[0]) - parseInt(b[0]);
    });

  const directory = document.getElementById("teamDirectory");

  if (sortedGroups.length === 0) {

    directory.innerHTML =
      '<div class="error">No active Cobras teams are configured.</div>';

    return;
  }

  directory.innerHTML = sortedGroups
    .map(function ([age, teams]) {

      teams.sort(function (a, b) {
        return a.team.name.localeCompare(b.team.name);
      });

      return `
        <div class="age-group">

          <div class="age-header">
            <div class="age-title">${escapeHtml(age)}</div>
            <div class="age-line"></div>
          </div>

          <div class="team-grid">
            ${teams.map(renderTeamCard).join("")}
          </div>

        </div>
      `;

    })
    .join("");

  /*
    Load every active team's cached schedule so the
    organization record can be calculated.
  */

  loadOrganizationRecord(activeTeams);

  /* =========================
     TEAM CARD
  ========================== */

  function renderTeamCard(item) {

    const key = item.key;
    const team = item.team;

    const coaches = [
      team.headCoach,
      ...(team.assistantCoaches || [])
    ].filter(Boolean);

    return `
      <a
        class="team-card"
        href="team.html?team=${encodeURIComponent(key)}"
      >

        <div class="team-name">
          ${escapeHtml(team.name)}
        </div>

        <div class="coaches">
          ${escapeHtml(coaches.join(" · "))}
        </div>

        <div
          class="team-record"
          id="record-${escapeHtml(key)}"
        >
          <div class="record-value">0-0-0</div>
          <div class="record-label">RECORD</div>
        </div>

        <div class="arrow">→</div>

      </a>
    `;
  }

  /* =========================
     ORGANIZATION RECORD
  ========================== */

  async function loadOrganizationRecord(activeTeams) {

    let totalWins = 0;
    let totalLosses = 0;
    let totalTies = 0;

    /*
      Fetch all active teams in parallel.
    */

    await Promise.all(
      activeTeams.map(async function ([key, team]) {

        try {

          const response = await fetch(
            "schedules/" +
            key +
            ".json?cache=" +
            Date.now()
          );

          if (!response.ok) {
            return;
          }

          const data = await response.json();

          const games = Array.isArray(data)
            ? data
            : Array.isArray(data.games)
              ? data.games
              : [];

          const record = calculateRecord(games);

          totalWins += record.wins;
          totalLosses += record.losses;
          totalTies += record.ties;

          const recordElement =
            document.getElementById("record-" + key);

          if (recordElement) {

            recordElement.innerHTML = `
              <div class="record-value">
                ${record.wins}-${record.losses}-${record.ties}
              </div>
              <div class="record-label">RECORD</div>
            `;

          }

        } catch (error) {

          console.warn(
            "Could not load schedule for",
            key,
            error
          );

        }

      })
    );

    document.getElementById("orgWins").textContent =
      totalWins;

    document.getElementById("orgLosses").textContent =
      totalLosses;

    document.getElementById("orgTies").textContent =
      totalTies;
  }

  /* =========================
     RECORD CALCULATION
  ========================== */

  function calculateRecord(games) {

    let wins = 0;
    let losses = 0;
    let ties = 0;

    games.forEach(function (game) {

      if (!game) {
        return;
      }

      const score = getScores(game);

      if (
        score.our === null ||
        score.opponent === null
      ) {
        return;
      }

      if (score.our > score.opponent) {
        wins++;
      }
      else if (score.our < score.opponent) {
        losses++;
      }
      else {
        ties++;
      }

    });

    return {
      wins: wins,
      losses: losses,
      ties: ties
    };
  }

  /* =========================
     SCORE EXTRACTION
  ========================== */

  function getScores(game) {

    let our = null;
    let opponent = null;

    const ourValues = [
      game.team_score,
      game.our_score
    ];

    const opponentValues = [
      game.opponent_score
    ];

    for (const value of ourValues) {

      if (
        value !== undefined &&
        value !== null &&
        value !== "" &&
        !isNaN(Number(value))
      ) {
        our = Number(value);
        break;
      }
    }

    for (const value of opponentValues) {

      if (
        value !== undefined &&
        value !== null &&
        value !== "" &&
        !isNaN(Number(value))
      ) {
        opponent = Number(value);
        break;
      }
    }

    /*
      Handle nested score objects.
    */

    if (
      (our === null || opponent === null) &&
      game.score &&
      typeof game.score === "object"
    ) {

      if (our === null) {

        const value =
          game.score.team ??
          game.score.home ??
          game.score.us;

        if (
          value !== undefined &&
          value !== null &&
          !isNaN(Number(value))
        ) {
          our = Number(value);
        }
      }

      if (opponent === null) {

        const value =
          game.score.opponent ??
          game.score.away;

        if (
          value !== undefined &&
          value !== null &&
          !isNaN(Number(value))
        ) {
          opponent = Number(value);
        }
      }
    }

    return {
      our: our,
      opponent: opponent
    };
  }

  /* =========================
     HTML ESCAPING
  ========================== */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

})();
</script>

</body>
</html>
