<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras 17U Riley</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .team-header {
      text-align: center;
      padding: 20px 16px 18px;
      border-bottom: 5px solid #ff5a00;
    }

    .team-logo {
      display: block;
      width: min(900px, 94%);
      height: auto;
      margin: 0 auto 12px;
    }

    .season {
      color: #555;
      font-size: 17px;
      margin-top: 4px;
    }

    .section-title {
      text-align: center;
      margin: 24px 12px 14px;
      font-size: 22px;
      font-weight: 800;
      color: #111;
    }

    .widget-wrap {
      width: 100%;
      overflow: hidden;
    }

    #gc-schedule-widget {
      width: 100%;
      min-height: 450px;
    }

    .mobile-link {
      display: block;
      margin: 18px 16px 28px;
      padding: 15px 18px;
      background: #ff5a00;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      border-radius: 5px;
    }

    .team-info {
      margin: 28px auto 35px;
      width: min(900px, 92%);
      padding: 24px 20px;
      background: #f5f5f5;
      border-top: 5px solid #ff5a00;
    }

    .team-info h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 23px;
      color: #111;
    }

    .staff-grid {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      text-align: center;
    }

    .staff-role {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .staff-name {
      color: #222;
      font-size: 18px;
      font-weight: 700;
    }

    .follow {
      text-align: center;
      margin: 10px 16px 35px;
    }

    .follow a {
      color: #ff5a00;
      font-weight: 800;
      text-decoration: none;
    }

    /* Desktop: full GameChanger team experience */
    #desktop-team {
      display: none;
      width: 100%;
      height: 1450px;
      border: 0;
    }

    /* Mobile: responsive official GameChanger schedule widget */
    #mobile-schedule {
      display: block;
    }

    @media (min-width: 768px) {
      #desktop-team {
        display: block;
      }

      #mobile-schedule,
      .mobile-only {
        display: none;
      }
    }

    @media (max-width: 767px) {
      .team-logo {
        width: 96%;
        margin-bottom: 8px;
      }

      .season {
        font-size: 15px;
      }

      .staff-grid {
        gap: 20px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="team-header">
    <img
      class="team-logo"
      src="./cobras-logo.png"
      alt="McHenry Cobras"
    >
    <div class="season">17U Riley • 2026 Season</div>
  </header>

  <!-- Desktop: full GameChanger experience -->
  <iframe
    id="desktop-team"
    src="https://web.gc.com/teams/pMdj4HZlj6tS/2026-summer-mchenry-cobras---riley-17u"
    title="McHenry Cobras 17U Riley on GameChanger"
    allowfullscreen>
  </iframe>

  <!-- Mobile: responsive official GameChanger schedule widget -->
  <section id="mobile-schedule">
    <div class="section-title">Schedule &amp; Results</div>

    <div class="widget-wrap">
      <div id="gc-schedule-widget"></div>
    </div>

    <a
      class="mobile-link mobile-only"
      href="https://web.gc.com/teams/pMdj4HZlj6tS/2026-summer-mchenry-cobras---riley-17u"
      target="_blank"
      rel="noopener">
      View Team, Roster &amp; Stats on GameChanger
    </a>
  </section>

  <section class="team-info">
    <h2>17U Riley Coaching Staff</h2>

    <div class="staff-grid">
      <div>
        <div class="staff-role">Head Coach</div>
        <div class="staff-name">Bryan Riley</div>
      </div>

      <div>
        <div class="staff-role">Assistant Coach</div>
        <div class="staff-name">Bob Tomlinson</div>
      </div>

      <div>
        <div class="staff-role">Assistant Coach</div>
        <div class="staff-name">Dan Dunn</div>
      </div>
    </div>
  </section>

  <div class="follow">
    <a
      href="https://web.gc.com/teams/pMdj4HZlj6tS/2026-summer-mchenry-cobras---riley-17u"
      target="_blank"
      rel="noopener">
      Follow 17U Riley on GameChanger →
    </a>
  </div>

  <script src="https://widgets.gc.com/static/js/sdk.v1.js"></script>
  <script>
    if (window.matchMedia("(max-width: 767px)").matches) {
      window.GC.team.schedule.init({
        target: "#gc-schedule-widget",
        widgetId: "d658d31b-468e-496a-939f-11fe8966b370",
        maxVerticalGamesVisible: 4
      });
    }
  </script>

</body>
</html>
