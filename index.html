<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .team-header {
      text-align: center;
      padding: 20px 16px 18px;
      border-bottom: 5px solid #ff5a00;
    }

    .team-logo {
      display: block;
      width: min(900px, 94%);
      height: auto;
      margin: 0 auto 12px;
    }

    .season {
      color: #555;
      font-size: 17px;
      margin-top: 4px;
    }

    .team-content {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    #desktop-team {
      order: 1;
      display: block;
      width: 100%;
      height: 1450px;
      border: 0;
    }

    .team-info {
      order: 2;
      margin: 28px auto 25px;
      width: min(900px, 92%);
      padding: 24px 20px;
      background: #f5f5f5;
      border-top: 5px solid #ff5a00;
    }

    .team-info h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 23px;
      color: #111;
    }

    .staff-grid {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      text-align: center;
    }

    .staff-role {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .staff-name {
      color: #222;
      font-size: 18px;
      font-weight: 700;
    }

    #mobile-content {
      display: none;
    }

    .gc-button,
    .facebook-button {
      display: block;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      border-radius: 5px;
    }

    .gc-button {
      padding: 15px 18px;
      width: min(520px, calc(100% - 32px));
      background: #ff5a00;
      color: #fff;
      margin-top: 0;
      margin-bottom: 22px;
    }

    .facebook-button {
      padding: 13px 18px;
      width: min(420px, calc(100% - 32px));
      background: #1877f2;
      color: #fff;
      margin-bottom: 26px;
    }

    .section-title {
      text-align: center;
      margin: 24px 12px 14px;
      font-size: 22px;
      font-weight: 800;
      color: #111;
    }

    .widget-wrap {
      width: 100%;
      overflow: hidden;
    }

    #gc-schedule-widget {
      width: 100%;
      min-height: 450px;
    }

    .error-message {
      margin: 30px auto;
      width: min(700px, 90%);
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
      border-top: 5px solid #ff5a00;
      color: #333;
    }

    @media (max-width: 767px) {
      .team-logo {
        width: 96%;
        margin-bottom: 8px;
      }

      .season {
        font-size: 15px;
      }

      .team-header {
        border-bottom: 0;
      }

      .team-info {
        border-top: 0;
        margin: 20px auto 22px;
      }

      #desktop-team {
        display: none;
      }

      #mobile-content {
        display: block;
      }

      .staff-grid {
        gap: 20px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="team-header">
    <img class="team-logo" src="./cobras-logo.png" alt="McHenry Cobras">
    <div class="season" id="team-season"></div>
  </header>

  <main class="team-content">

    <section class="team-info">
      <h2 id="staff-title"></h2>
      <div class="staff-grid" id="staff-grid"></div>
    </section>

    <iframe
      id="desktop-team"
      title="McHenry Cobras on GameChanger"
      allowfullscreen>
    </iframe>

    <section id="mobile-content">

      <a class="gc-button" id="mobile-gc-link" target="_blank" rel="noopener">
        View Team, Roster &amp; Stats on GameChanger
      </a>

      <a class="facebook-button" id="facebook-link" target="_blank" rel="noopener" style="display:none;">
        Follow Team on Facebook
      </a>

      <div class="section-title">Schedule &amp; Results</div>

      <div class="widget-wrap">
        <div id="gc-schedule-widget"></div>
      </div>

    </section>

  </main>

  <script src="./config.js"></script>
  <script src="https://widgets.gc.com/static/js/sdk.v1.js"></script>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const teamKey = params.get("team") || "riley17u";
      const team = COBRAS_TEAMS[teamKey];

      if (!team || !team.active) {
        document.querySelector(".team-content").innerHTML =
          '<div class="error-message"><strong>Team page not available.</strong><br>Please check the team link.</div>';
        return;
      }

      document.title = "McHenry Cobras " + team.name;

      document.getElementById("team-season").textContent =
        team.name + " • " + team.season;

      document.getElementById("staff-title").textContent =
        team.name + " Coaching Staff";

      const staffGrid = document.getElementById("staff-grid");

      if (team.headCoach) {
        staffGrid.insertAdjacentHTML(
          "beforeend",
          '<div><div class="staff-role">Head Coach</div><div class="staff-name">' +
          escapeHtml(team.headCoach) +
          '</div></div>'
        );
      }

      (team.assistantCoaches || []).slice(0, 3).forEach(function (coach) {
        if (coach) {
          staffGrid.insertAdjacentHTML(
            "beforeend",
            '<div><div class="staff-role">Assistant Coach</div><div class="staff-name">' +
            escapeHtml(coach) +
            '</div></div>'
          );
        }
      });

      const teamUrl =
        "https://web.gc.com/teams/" + team.gameChangerTeamId + "/schedule";

      const fullTeamUrl =
        "https://web.gc.com/teams/" + team.gameChangerTeamId;

      document.getElementById("desktop-team").src = teamUrl;
      document.getElementById("mobile-gc-link").href = fullTeamUrl;

      if (team.facebookUrl) {
        const facebook = document.getElementById("facebook-link");
        facebook.href = team.facebookUrl;
        facebook.textContent = "Follow " + team.name + " on Facebook";
        facebook.style.display = "block";
      }

      if (window.matchMedia("(max-width: 767px)").matches) {
        if (team.gameChangerWidgetId) {
          window.GC.team.schedule.init({
            target: "#gc-schedule-widget",
            widgetId: team.gameChangerWidgetId,
            maxVerticalGamesVisible: 4
          });
        } else {
          document.getElementById("gc-schedule-widget").innerHTML =
            '<div class="error-message">Schedule widget not configured yet.</div>';
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }
    })();
  </script>

</body>
</html>
