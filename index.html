<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras Lorenz 12U</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      border-bottom: 4px solid #ff5a00;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 15px;
    }

    /* RECORD */

    .record {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin: 0 auto 24px;
      padding: 14px 20px;
      max-width: 420px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .record-item {
      text-align: center;
      min-width: 70px;
    }

    .record-number {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .record-label {
      margin-top: 5px;
      color: #666;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .schedule {
      display: grid;
      gap: 14px;
    }

    .game {
      display: grid;
      grid-template-columns: 105px 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 16px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .date {
      text-align: center;
      border-right: 1px solid #eeeeee;
      padding-right: 15px;
    }

    .date .month {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .date .day {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      margin: 3px 0;
    }

    .date .weekday {
      color: #666;
      font-size: 13px;
    }

    .opponent {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .opponent img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 50%;
    }

    .opponent-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .opponent-name {
      font-size: 18px;
      font-weight: 700;
    }

    .home-away {
      margin-top: 4px;
      color: #777;
      font-size: 13px;
    }

    .time {
      text-align: right;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* COMPLETED GAME */

    .result {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 800;
    }

    .final {
      display: block;
      margin-top: 3px;
      color: #777;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .win {
      color: #16803c;
    }

    .loss {
      color: #b42318;
    }

    .tie {
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      padding: 20px;
      border: 1px solid #e0b4b4;
      background: #fff5f5;
      color: #a00000;
      border-radius: 8px;
    }

    @media (max-width: 650px) {
      .page {
        padding: 12px;
      }

      h1 {
        font-size: 26px;
      }

      .record {
        gap: 20px;
      }

      .record-number {
        font-size: 25px;
      }

      .game {
        grid-template-columns: 75px 1fr;
        gap: 12px;
      }

      .date {
        padding-right: 10px;
      }

      .date .day {
        font-size: 25px;
      }

      .time {
        grid-column: 2;
        text-align: left;
        margin-top: -8px;
      }

      .opponent-name {
        font-size: 16px;
      }

      .opponent img,
      .opponent-placeholder {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">
      <div class="eyebrow">McHenry Cobras Baseball</div>
      <h1>Lorenz 12U</h1>
      <div class="subtitle">2026 Fall Schedule</div>
    </header>

    <!-- RECORD -->

    <div class="record">
      <div class="record-item">
        <div id="wins" class="record-number">0</div>
        <div class="record-label">Wins</div>
      </div>

      <div class="record-item">
        <div id="losses" class="record-number">0</div>
        <div class="record-label">Losses</div>
      </div>

      <div class="record-item">
        <div id="ties" class="record-number">0</div>
        <div class="record-label">Ties</div>
      </div>
    </div>

    <div id="schedule" class="schedule">
      <div class="loading">Loading schedule...</div>
    </div>

  </div>

  <script>
    async function loadSchedule() {
      const container = document.getElementById("schedule");

      try {
        const response = await fetch("schedule.json?v=" + Date.now());

        if (!response.ok) {
          throw new Error("Unable to load schedule.json");
        }

        const games = await response.json();

        container.innerHTML = "";

        let wins = 0;
        let losses = 0;
        let ties = 0;

        games.forEach(game => {

          /*
           * Calculate record from completed games.
           *
           * GameChanger returns:
           * score.team
           * score.opponent_team
           * score.game_status
           */

          if (
            game.score &&
            game.score.game_status === "completed"
          ) {
            const teamScore = Number(game.score.team);
            const opponentScore = Number(game.score.opponent_team);

            if (teamScore > opponentScore) {
              wins++;
            } else if (teamScore < opponentScore) {
              losses++;
            } else {
              ties++;
            }
          }

          const date = new Date(game.start_ts);

          const month = new Intl.DateTimeFormat("en-US", {
            month: "short",
            timeZone: game.timezone
          }).format(date);

          const day = new Intl.DateTimeFormat("en-US", {
            day: "numeric",
            timeZone: game.timezone
          }).format(date);

          const weekday = new Intl.DateTimeFormat("en-US", {
            weekday: "short",
            timeZone: game.timezone
          }).format(date);

          const time = new Intl.DateTimeFormat("en-US", {
            hour: "numeric",
            minute: "2-digit",
            timeZone: game.timezone
          }).format(date);

          const homeAway =
            game.home_away === "home"
              ? "HOME"
              : "AWAY";

          const logo = game.opponent_team.avatar_url
            ? `<img src="${game.opponent_team.avatar_url}" alt="">`
            : `<div class="opponent-placeholder">⚾</div>`;

          /*
           * Show score only when GameChanger
           * says the game is completed.
           */

          let result = "";

          if (
            game.score &&
            game.score.game_status === "completed"
          ) {
            const teamScore = Number(game.score.team);
            const opponentScore = Number(game.score.opponent_team);

            let resultClass = "tie";

            if (teamScore > opponentScore) {
              resultClass = "win";
            } else if (teamScore < opponentScore) {
              resultClass = "loss";
            }

            result = `
              <div class="result ${resultClass}">
                ${teamScore} - ${opponentScore}
                <span class="final">FINAL</span>
              </div>
            `;
          }

          const card = document.createElement("div");
          card.className = "game";

          card.innerHTML = `
            <div class="date">
              <div class="month">${month}</div>
              <div class="day">${day}</div>
              <div class="weekday">${weekday}</div>
            </div>

            <div class="opponent">
              ${logo}

              <div>
                <div class="opponent-name">
                  ${game.opponent_team.name}
                </div>

                <div class="home-away">
                  ${homeAway}
                </div>

                ${result}
              </div>
            </div>

            <div class="time">
              ${result ? "" : time}
            </div>
          `;

          container.appendChild(card);
        });

        /*
         * Update record at the top.
         */

        document.getElementById("wins").textContent = wins;
        document.getElementById("losses").textContent = losses;
        document.getElementById("ties").textContent = ties;

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="error">
            Unable to load the schedule right now.
          </div>
        `;
      }
    }

    loadSchedule();
  </script>

</body>
</html>
