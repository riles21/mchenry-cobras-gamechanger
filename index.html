<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras GameChanger</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .cobras-header {
      text-align: center;
      padding: 18px 12px 14px;
      border-bottom: 4px solid #ff5a00;
    }
    .eyebrow {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      color: #111;
    }
    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 15px;
    }
    #gc-schedule-widget-test {
      width: 100%;
      min-height: 500px;
    }
  </style>
</head>
<body>

  <header class="cobras-header">
    <div class="eyebrow">McHenry Cobras Baseball</div>
    <h1>17U Riley</h1>
    <div class="subtitle">Game Schedule &amp; Results</div>
  </header>

  <div id="gc-schedule-widget-test"></div>

  <script src="https://widgets.gc.com/static/js/sdk.v1.js"></script>
  <script>
    window.GC.team.schedule.init({
      target: "#gc-schedule-widget-test",
      widgetId: "d658d31b-468e-496a-939f-11fe8966b370",
      maxVerticalGamesVisible: 4
    });
  </script>

</body>
</html>
