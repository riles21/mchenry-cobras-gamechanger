<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras 17U Riley</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .team-header {
      text-align: center;
      padding: 20px 16px 18px;
      border-bottom: 5px solid #ff5a00;
    }

    .team-logo {
      display: block;
      width: min(900px, 94%);
      height: auto;
      margin: 0 auto 12px;
    }

    .season {
      color: #555;
      font-size: 17px;
      margin-top: 4px;
    }

    .team-content {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Desktop: full GameChanger experience first, then staff */
    #desktop-team {
      order: 1;
      display: block;
      width: 100%;
      height: 1450px;
      border: 0;
    }

    .team-info {
      order: 2;
      margin: 28px auto 25px;
      width: min(900px, 92%);
      padding: 24px 20px;
      background: #f5f5f5;
      border-top: 5px solid #ff5a00;
    }

    .team-info h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 23px;
      color: #111;
    }

    .staff-grid {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      text-align: center;
    }

    .staff-role {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .staff-name {
      color: #222;
      font-size: 18px;
      font-weight: 700;
    }

    /* Mobile-only elements are hidden on desktop */
    #mobile-content {
      display: none;
    }

    .gc-button,
    .facebook-button {
      display: block;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
      text-decoration: none;
      font-weight: 800;
      border-radius: 5px;
    }

    .gc-button {
      padding: 15px 18px;
      width: min(520px, calc(100% - 32px));
      background: #ff5a00;
      color: #fff;
      margin-top: 0;
      margin-bottom: 22px;
    }

    .facebook-button {
      padding: 13px 18px;
      width: min(420px, calc(100% - 32px));
      background: #1877f2;
      color: #fff;
      margin-bottom: 26px;
    }

    .section-title {
      text-align: center;
      margin: 24px 12px 14px;
      font-size: 22px;
      font-weight: 800;
      color: #111;
    }

    .widget-wrap {
      width: 100%;
      overflow: hidden;
    }

    #gc-schedule-widget {
      width: 100%;
      min-height: 450px;
    }

    @media (max-width: 767px) {
      .team-logo {
        width: 96%;
        margin-bottom: 8px;
      }

      .season {
        font-size: 15px;
      }

      /* Keep the mobile transition clean — no orange divider lines
         between the logo/header and coaching staff. */
      .team-header {
        border-bottom: 0;
      }

      .team-info {
        border-top: 0;
      }

      /* Mobile order:
         1. Coaching staff
         2. GameChanger team/roster/stats button
         3. Facebook
         4. Schedule & Results */
      #desktop-team {
        display: none;
      }

      .team-info {
        order: 1;
        margin: 20px auto 22px;
      }

      #mobile-content {
        order: 2;
        display: block;
      }

      .staff-grid {
        gap: 20px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header class="team-header">
    <img
      class="team-logo"
      src="./cobras-logo.png"
      alt="McHenry Cobras">
    <div class="season">17U Riley • 2026 Season</div>
  </header>

  <main class="team-content">

    <!-- One coaching-staff section shared by desktop and mobile -->
    <section class="team-info">
      <h2>17U Riley Coaching Staff</h2>

      <div class="staff-grid">
        <div>
          <div class="staff-role">Head Coach</div>
          <div class="staff-name">Bryan Riley</div>
        </div>

        <div>
          <div class="staff-role">Assistant Coach</div>
          <div class="staff-name">Bob Tomlinson</div>
        </div>

        <div>
          <div class="staff-role">Assistant Coach</div>
          <div class="staff-name">Dan Dunn</div>
        </div>
      </div>
    </section>

    <!-- Desktop: full GameChanger team page -->
    <iframe
      id="desktop-team"
      src="https://web.gc.com/teams/pMdj4HZlj6tS/schedule"
      title="McHenry Cobras 17U Riley on GameChanger"
      allowfullscreen>
    </iframe>

    <!-- Mobile-only content -->
    <section id="mobile-content">

      <a
        class="gc-button"
        href="https://web.gc.com/teams/pMdj4HZlj6tS/2026-summer-mchenry-cobras---riley-17u"
        target="_blank"
        rel="noopener">
        View Team, Roster &amp; Stats on GameChanger
      </a>

      <!-- Replace this URL when the team's Facebook page is available.
           If the team has no Facebook page, remove this button. -->
      <a
        class="facebook-button"
        href="https://www.facebook.com/YOUR_TEAM_PAGE"
        target="_blank"
        rel="noopener">
        Follow 17U Riley on Facebook
      </a>

      <div class="section-title">Schedule &amp; Results</div>

      <div class="widget-wrap">
        <div id="gc-schedule-widget"></div>
      </div>

    </section>

  </main>

  <script src="https://widgets.gc.com/static/js/sdk.v1.js"></script>
  <script>
    if (window.matchMedia("(max-width: 767px)").matches) {
      window.GC.team.schedule.init({
        target: "#gc-schedule-widget",
        widgetId: "d658d31b-468e-496a-939f-11fe8966b370",
        maxVerticalGamesVisible: 4
      });
    }
  </script>

</body>
</html>
