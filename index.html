<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras Lorenz 12U</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      border-bottom: 4px solid #ff5a00;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 6px;
      color: #666;
      font-size: 15px;
    }

    .schedule {
      display: grid;
      gap: 14px;
    }

    .game {
      display: grid;
      grid-template-columns: 105px 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 16px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .date {
      text-align: center;
      border-right: 1px solid #eeeeee;
      padding-right: 15px;
    }

    .date .month {
      color: #ff5a00;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .date .day {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      margin: 3px 0;
    }

    .date .weekday {
      color: #666;
      font-size: 13px;
    }

    .opponent {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .opponent img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      border-radius: 50%;
    }

    .opponent-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .opponent-name {
      font-size: 18px;
      font-weight: 700;
    }

    .home-away {
      margin-top: 4px;
      color: #777;
      font-size: 13px;
    }

    .time {
      text-align: right;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Game results */
    .result {
      font-size: 18px;
      font-weight: 800;
    }

    .result.win {
      color: #16803c;
    }

    .result.loss {
      color: #c62828;
    }

    .result.tie {
      color: #666666;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      padding: 20px;
      border: 1px solid #e0b4b4;
      background: #fff5f5;
      color: #a00000;
      border-radius: 8px;
    }

    @media (max-width: 650px) {
      .page {
        padding: 12px;
      }

      h1 {
        font-size: 26px;
      }

      .game {
        grid-template-columns: 75px 1fr;
        gap: 12px;
      }

      .date {
        padding-right: 10px;
      }

      .date .day {
        font-size: 25px;
      }

      .time {
        grid-column: 2;
        text-align: left;
        margin-top: -8px;
      }

      .opponent-name {
        font-size: 16px;
      }

      .opponent img,
      .opponent-placeholder {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="header">
      <div class="eyebrow">McHenry Cobras Baseball</div>
      <h1>Lorenz 12U</h1>
      <div class="subtitle">2026 Fall Schedule</div>
    </header>

    <div id="schedule" class="schedule">
      <div class="loading">Loading schedule...</div>
    </div>

  </div>

  <script>
    async function loadSchedule() {
      const container = document.getElementById("schedule");

      try {
        const response = await fetch("schedule.json?v=" + Date.now());

        if (!response.ok) {
          throw new Error("Unable to load schedule.json");
        }

        const games = await response.json();

        container.innerHTML = "";

        games.forEach(game => {

          const date = new Date(game.start_ts);

          const month = new Intl.DateTimeFormat("en-US", {
            month: "short",
            timeZone: game.timezone
          }).format(date);

          const day = new Intl.DateTimeFormat("en-US", {
            day: "numeric",
            timeZone: game.timezone
          }).format(date);

          const weekday = new Intl.DateTimeFormat("en-US", {
            weekday: "short",
            timeZone: game.timezone
          }).format(date);

          const time = new Intl.DateTimeFormat("en-US", {
            hour: "numeric",
            minute: "2-digit",
            timeZone: game.timezone
          }).format(date);

          const homeAway =
            game.home_away === "home"
              ? "HOME"
              : "AWAY";

          const logo = game.opponent_team.avatar_url
            ? `<img src="${game.opponent_team.avatar_url}" alt="">`
            : `<div class="opponent-placeholder">⚾</div>`;

          /*
           * GameChanger completed-game results.
           *
           * If score information exists, display:
           * W 7-3
           * L 2-10
           * T 5-5
           *
           * If no score exists, continue displaying the game time.
           */
          let gameResult = "";

          const hasScore =
            game.score &&
            game.score.team != null &&
            game.score.opponent_team != null;

          if (hasScore) {
            const ourScore = Number(game.score.team);
            const opponentScore = Number(game.score.opponent_team);

            if (
              Number.isFinite(ourScore) &&
              Number.isFinite(opponentScore)
            ) {
              if (ourScore > opponentScore) {
                gameResult =
                  `<span class="result win">W ${ourScore}-${opponentScore}</span>`;
              } else if (ourScore < opponentScore) {
                gameResult =
                  `<span class="result loss">L ${ourScore}-${opponentScore}</span>`;
              } else {
                gameResult =
                  `<span class="result tie">T ${ourScore}-${opponentScore}</span>`;
              }
            }
          }

          const card = document.createElement("div");
          card.className = "game";

          card.innerHTML = `
            <div class="date">
              <div class="month">${month}</div>
              <div class="day">${day}</div>
              <div class="weekday">${weekday}</div>
            </div>

            <div class="opponent">
              ${logo}
              <div>
                <div class="opponent-name">
                  ${game.opponent_team.name}
                </div>
                <div class="home-away">
                  ${homeAway}
                </div>
              </div>
            </div>

            <div class="time">
              ${gameResult || time}
            </div>
          `;

          container.appendChild(card);
        });

      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="error">
            Unable to load the schedule right now.
          </div>
        `;
      }
    }

    loadSchedule();
  </script>

</body>
</html>
