<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>McHenry Cobras Team</title>

  <style>
    :root {
      --cobras-orange: #ff5a00;
      --cobras-black: #111111;
      --page-max: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    body {
      overflow-x: hidden;
    }

    /* -------------------------------------------------
       MAIN PAGE
       ------------------------------------------------- */

    .page {
      width: 100%;
      max-width: var(--page-max);
      margin: 0 auto;
      padding: 10px 18px 40px;
    }

    /* -------------------------------------------------
       COBRAS HEADER
       ------------------------------------------------- */

    .team-header {
      width: 100%;
      text-align: center;
    }

    .cobras-banner {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
    }

    .team-name {
      margin: 8px 0 0;
      font-size: clamp(26px, 3vw, 38px);
      font-weight: 700;
      line-height: 1.05;
    }

    .season {
      margin-top: 3px;
      color: #666666;
      font-size: 16px;
    }

    .orange-line {
      width: 100%;
      height: 3px;
      background: var(--cobras-orange);
      margin: 12px auto 20px;
    }

    /* -------------------------------------------------
       COACHING STAFF
       ------------------------------------------------- */

    .staff-section {
      text-align: center;
    }

    .section-title {
      margin: 0 0 20px;
      font-size: clamp(21px, 2.2vw, 28px);
      letter-spacing: 0.5px;
    }

    .staff-grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(35px, 7vw, 100px);
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .coach {
      min-width: 130px;
    }

    .coach-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .coach-role {
      color: #777777;
      font-size: 14px;
    }

    /* -------------------------------------------------
       GAMECHANGER BUTTON
       ------------------------------------------------- */

    .gamechanger-button {
      display: inline-block;
      padding: 12px 22px;
      margin: 0 auto 20px;

      background: var(--cobras-orange);
      color: #ffffff;

      border-radius: 4px;
      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition:
        background-color 0.15s ease,
        transform 0.15s ease;
    }

    .gamechanger-button:hover {
      background: #e64f00;
      transform: translateY(-1px);
    }

    /* -------------------------------------------------
       GAMECHANGER SECTION
       ------------------------------------------------- */

    .gamechanger-title {
      width: 100%;
      background: var(--cobras-orange);
      color: #ffffff;

      text-align: center;

      font-size: 17px;
      font-weight: 700;

      padding: 9px 10px;
      margin: 0;
    }

    /*
      This is intentionally wider than the old version.

      The Wix HTML element can still limit the overall width,
      but this allows the GitHub page to use essentially all
      of the width Wix gives it.
    */
    .gamechanger-wrapper {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
    }

    /*
      Keep the GameChanger frame tall enough that its own
      navigation and schedule have plenty of room.

      scrolling="no" is also applied in the HTML below.
    */
    .gamechanger-frame {
      display: block;
      width: 100%;
      height: 2200px;

      border: 0;
      margin: 0;
      padding: 0;

      overflow: hidden;
    }

    /* -------------------------------------------------
       SMALL SCREEN / WIX
       ------------------------------------------------- */

    @media (max-width: 900px) {

      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .cobras-banner {
        max-width: 100%;
      }

      .gamechanger-frame {
        height: 2200px;
      }
    }

    @media (max-width: 600px) {

      .page {
        padding: 6px;
      }

      .team-name {
        font-size: 26px;
      }

      .season {
        font-size: 14px;
      }

      .orange-line {
        margin-top: 10px;
        margin-bottom: 16px;
      }

      .section-title {
        font-size: 21px;
      }

      .staff-grid {
        gap: 20px;
      }

      .coach {
        min-width: 105px;
      }

      .coach-name {
        font-size: 15px;
      }

      .coach-role {
        font-size: 12px;
      }

      .gamechanger-button {
        font-size: 12px;
        padding: 10px 15px;
      }

      .gamechanger-title {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- ================================================
         COBRAS TEAM HEADER
         ================================================ -->

    <header class="team-header">

      <img
        src="cobras-logo.png"
        alt="McHenry Cobras"
        class="cobras-banner"
      >

      <h1
        id="teamName"
        class="team-name">
        McHenry Cobras
      </h1>

      <div
        id="season"
        class="season">
        Team Page
      </div>

      <div class="orange-line"></div>

    </header>


    <!-- ================================================
         COACHING STAFF
         ================================================ -->

    <section class="staff-section">

      <h2 class="section-title">
        COACHING STAFF
      </h2>

      <div
        id="staff"
        class="staff-grid">
      </div>

      <a
        id="gamechangerLink"
        class="gamechanger-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer">
        VIEW TEAM, ROSTER &amp; STATS ON GAMECHANGER
      </a>

    </section>


    <!-- ================================================
         GAMECHANGER
         ================================================ -->

    <section class="gamechanger-wrapper">

      <div class="gamechanger-title">
        Game Schedule &amp; Results
      </div>

      <div id="gamechangerContainer">

        <div
          id="loadingMessage"
          style="
            text-align:center;
            padding:30px;
            color:#666;
            font-size:14px;
          ">
          Loading GameChanger...
        </div>

      </div>

    </section>

  </main>


  <!-- ================================================
       TEAM CONFIGURATION
       ================================================ -->

  <script src="config.js?v=20260820"></script>


  <!-- ================================================
       PAGE LOGIC
       ================================================ -->

  <script>

    (function () {

      "use strict";


      /* -----------------------------------------------
         GET TEAM FROM URL
         ----------------------------------------------- */

      const params = new URLSearchParams(
        window.location.search
      );

      const teamKey =
        params.get("team") || "lorenz12u";


      /* -----------------------------------------------
         FIND TEAM CONFIGURATION
         ----------------------------------------------- */

      if (
        typeof COBRAS_TEAMS === "undefined" ||
        !COBRAS_TEAMS[teamKey]
      ) {

        document.getElementById("teamName").textContent =
          "McHenry Cobras";

        document.getElementById("season").textContent =
          "Team configuration unavailable";

        document.getElementById("staff").innerHTML =
          '<div style="' +
          'padding:20px;' +
          'border:1px solid #ddd;' +
          'background:#fafafa;' +
          'color:#555;' +
          '">' +
          '<strong>Team configuration unavailable</strong>' +
          '<br><br>' +
          'Please check that config.js is uploaded correctly.' +
          '</div>';

        document.getElementById(
          "gamechangerContainer"
        ).innerHTML =
          '<div style="' +
          'padding:30px;' +
          'text-align:center;' +
          'color:#666;' +
          '">' +
          'GameChanger unavailable.' +
          '</div>';

        return;
      }


      const team = COBRAS_TEAMS[teamKey];


      /* -----------------------------------------------
         TEAM NAME / SEASON
         ----------------------------------------------- */

      document.getElementById(
        "teamName"
      ).textContent = team.name || "McHenry Cobras";


      document.getElementById(
        "season"
      ).textContent = team.season || "";


      /* -----------------------------------------------
         COACHING STAFF
         ----------------------------------------------- */

      const staff =
        document.getElementById("staff");

      let staffHTML = "";


      if (team.headCoach) {

        staffHTML +=
          '<div class="coach">' +
            '<div class="coach-name">' +
              escapeHTML(team.headCoach) +
            '</div>' +
            '<div class="coach-role">' +
              'Head Coach' +
            '</div>' +
          '</div>';

      }


      if (
        Array.isArray(team.assistantCoaches)
      ) {

        team.assistantCoaches.forEach(
          function (coach) {

            if (!coach) {
              return;
            }

            staffHTML +=
              '<div class="coach">' +
                '<div class="coach-name">' +
                  escapeHTML(coach) +
                '</div>' +
                '<div class="coach-role">' +
                  'Assistant Coach' +
                '</div>' +
              '</div>';

          }
        );

      }


      staff.innerHTML = staffHTML;


      /* -----------------------------------------------
         GAMECHANGER TEAM LINK
         ----------------------------------------------- */

      const gcLink =
        document.getElementById(
          "gamechangerLink"
        );


      if (team.gameChangerTeamId) {

        /*
          GameChanger's public team URL.
        */

        gcLink.href =
          "https://web.gc.com/teams/" +
          encodeURIComponent(
            team.gameChangerTeamId
          );

      } else {

        gcLink.style.display = "none";

      }


      /* -----------------------------------------------
         LOAD GAMECHANGER WIDGET
         ----------------------------------------------- */

      const gcContainer =
        document.getElementById(
          "gamechangerContainer"
        );


      /*
        IMPORTANT:

        If a GameChanger widget ID exists in config.js,
        use the GameChanger widget SDK.

        This preserves the full GameChanger experience
        that is currently working for the Riley test.
      */

      if (
        team.gameChangerWidgetId &&
        team.gameChangerWidgetId.trim() !== ""
      ) {

        gcContainer.innerHTML =
          '<div id="gc-scoreboard-widget"></div>';


        loadGameChangerSDK(
          team.gameChangerWidgetId
        );

      } else {

        gcContainer.innerHTML =
          '<div style="' +
          'padding:30px;' +
          'text-align:center;' +
          'border:1px solid #ddd;' +
          'background:#fafafa;' +
          'color:#555;' +
          '">' +

          '<strong>GameChanger schedule coming soon</strong>' +

          '<br><br>' +

          'The GameChanger widget ID has not been added ' +
          'for this team yet.' +

          '</div>';

      }


      /* -----------------------------------------------
         GAMECHANGER SDK
         ----------------------------------------------- */

      function loadGameChangerSDK(widgetId) {

        /*
          Prevent loading the SDK twice.
        */

        if (
          document.querySelector(
            'script[data-gamechanger-sdk]'
          )
        ) {

          initializeGameChanger(
            widgetId
          );

          return;
        }


        const script =
          document.createElement("script");


        script.src =
          "https://widgets.gc.com/static/js/sdk.v1.js";


        script.async = true;


        script.setAttribute(
          "data-gamechanger-sdk",
          "true"
        );


        script.onload =
          function () {

            initializeGameChanger(
              widgetId
            );

          };


        script.onerror =
          function () {

            gcContainer.innerHTML =
              '<div style="' +
              'padding:30px;' +
              'text-align:center;' +
              'color:#666;' +
              '">' +
              'Unable to load GameChanger.' +
              '</div>';

          };


        document.body.appendChild(
          script
        );

      }


      /* -----------------------------------------------
         INITIALIZE GAMECHANGER
         ----------------------------------------------- */

      function initializeGameChanger(
        widgetId
      ) {

        /*
          Wait briefly because the SDK can take
          a moment to expose window.GC.
        */

        let attempts = 0;


        const timer =
          setInterval(
            function () {

              attempts++;


              if (
                window.GC &&
                window.GC.scoreboard &&
                typeof window.GC.scoreboard.init ===
                  "function"
              ) {

                clearInterval(timer);


                window.GC.scoreboard.init({

                  target:
                    "#gc-scoreboard-widget",

                  widgetId:
                    widgetId,

                  /*
                    Show several games vertically where
                    GameChanger supports the option.
                  */

                  maxVerticalGamesVisible: 6

                });


                return;

              }


              if (attempts >= 50) {

                clearInterval(timer);


                gcContainer.innerHTML =
                  '<div style="' +
                  'padding:30px;' +
                  'text-align:center;' +
                  'color:#666;' +
                  '">' +
                  'GameChanger could not be initialized.' +
                  '</div>';

              }

            },
            100
          );

      }


      /* -----------------------------------------------
         SIMPLE HTML ESCAPE
         ----------------------------------------------- */

      function escapeHTML(value) {

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }

    })();

  </script>

</body>
</html>
