<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>McHenry Cobras</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    /* Main page container */
    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px 18px 40px;
    }

    /* Cobras header logo */
    .team-logo {
      display: block;
      width: 100%;
      max-width: 860px;
      height: auto;
      margin: 0 auto 8px;
    }

    /* Team title */
    .team-title {
      text-align: center;
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.15;
    }

    .team-season {
      text-align: center;
      margin-top: 3px;
      color: #666;
      font-size: 17px;
    }

    .orange-line {
      width: 100%;
      height: 3px;
      background: #ff5a00;
      margin: 12px 0 22px;
    }

    /* Coaching staff */
    .section-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 16px;
    }

    .coaches {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 70px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .coach {
      min-width: 150px;
      text-align: center;
    }

    .coach-name {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .coach-role {
      font-size: 14px;
      color: #777;
    }

    /* GameChanger button */
    .gc-button-wrap {
      text-align: center;
      margin: 10px 0 22px;
    }

    .gc-button {
      display: inline-block;
      background: #ff5a00;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 4px;
    }

    .gc-button:hover {
      background: #e84f00;
    }

    /* GameChanger heading */
    .gc-heading {
      width: 100%;
      background: #ff5a00;
      color: #ffffff;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      padding: 10px 8px;
      margin: 0;
    }

    /* GameChanger container */
    .gc-container {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      overflow: hidden;
      background: #ffffff;
    }

    .gc-frame {
      display: block;
      width: 100%;
      height: 1200px;
      border: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Error / unavailable message */
    .message {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ddd;
      background: #fafafa;
      text-align: center;
      color: #555;
    }

    .message-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.5;
    }

    /* Smaller screens */
    @media (max-width: 700px) {

      .page {
        padding-left: 10px;
        padding-right: 10px;
      }

      .team-title {
        font-size: 25px;
      }

      .team-season {
        font-size: 15px;
      }

      .coaches {
        gap: 25px;
      }

      .coach {
        min-width: 120px;
      }

      .coach-name {
        font-size: 15px;
      }

      .coach-role {
        font-size: 12px;
      }

      .gc-button {
        font-size: 13px;
        padding: 10px 16px;
      }

      .gc-heading {
        font-size: 16px;
      }

      .gc-frame {
        height: 1200px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- Team logo -->
  <img
    class="team-logo"
    src="https://riles21.github.io/mchenry-cobras-gamechanger/cobras-logo.png"
    alt="McHenry Cobras"
  >

  <!-- Team information -->
  <h1 id="teamName" class="team-title">McHenry Cobras</h1>
  <div id="teamSeason" class="team-season"></div>

  <div class="orange-line"></div>

  <!-- Coaching staff -->
  <h2 class="section-title">COACHING STAFF</h2>

  <div id="coaches" class="coaches"></div>

  <!-- GameChanger link -->
  <div class="gc-button-wrap">
    <a
      id="gcButton"
      class="gc-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >
      VIEW TEAM, ROSTER &amp; STATS ON GAMECHANGER
    </a>
  </div>

  <!-- GameChanger -->
  <div class="gc-container">

    <div class="gc-heading">
      Game Schedule &amp; Results
    </div>

    <iframe
      id="gcFrame"
      class="gc-frame"
      title="GameChanger Team Page"
      scrolling="no"
      frameborder="0"
      allow="fullscreen">
    </iframe>

    <div id="gcMessage" class="message" style="display:none;">
      <div class="message-title"></div>
      <div class="message-text"></div>
    </div>

  </div>

</div>


<script src="config.js?v=5"></script>

<script>

  /*
   * ------------------------------------------------------------
   * McHenry Cobras Team Page
   * ------------------------------------------------------------
   */

  function getTeamKey() {

    const params = new URLSearchParams(window.location.search);

    return params.get("team");

  }


  function showMessage(title, text) {

    const message = document.getElementById("gcMessage");

    message.querySelector(".message-title").textContent = title;

    message.querySelector(".message-text").textContent = text;

    message.style.display = "block";

  }


  function initializePage() {

    const teamKey = getTeamKey();

    /*
     * Make sure config.js loaded correctly.
     */

    if (
      typeof COBRAS_TEAMS === "undefined" ||
      !COBRAS_TEAMS
    ) {

      document.getElementById("teamName").textContent =
        "McHenry Cobras";

      showMessage(
        "Team configuration unavailable",
        "Please check that config.js is uploaded correctly."
      );

      return;

    }


    /*
     * Find requested team.
     */

    const team = COBRAS_TEAMS[teamKey];


    if (!team || team.active === false) {

      document.getElementById("teamName").textContent =
        "McHenry Cobras";

      showMessage(
        "Team not found",
        "The requested team could not be found."
      );

      return;

    }


    /*
     * Team name and season
     */

    document.getElementById("teamName").textContent =
      team.name || "McHenry Cobras";


    document.getElementById("teamSeason").textContent =
      team.season || "";


    /*
     * Coaching staff
     */

    const coachesContainer =
      document.getElementById("coaches");

    coachesContainer.innerHTML = "";


    if (team.headCoach) {

      coachesContainer.innerHTML += `
        <div class="coach">
          <div class="coach-name">
            ${team.headCoach}
          </div>
          <div class="coach-role">
            Head Coach
          </div>
        </div>
      `;

    }


    if (Array.isArray(team.assistantCoaches)) {

      team.assistantCoaches.forEach(function(coach) {

        if (!coach) {
          return;
        }

        coachesContainer.innerHTML += `
          <div class="coach">
            <div class="coach-name">
              ${coach}
            </div>
            <div class="coach-role">
              Assistant Coach
            </div>
          </div>
        `;

      });

    }


    /*
     * GameChanger team URL
     *
     * This uses the actual GameChanger Team ID.
     */

    if (team.gameChangerTeamId) {

      const gameChangerUrl =
        "https://web.gc.com/teams/" +
        team.gameChangerTeamId;


      /*
       * Button above GameChanger
       */

      document.getElementById("gcButton").href =
        gameChangerUrl;


      /*
       * Full GameChanger team page
       *
       * This is intentionally NOT the scoreboard widget.
       */

      document.getElementById("gcFrame").src =
        gameChangerUrl;


    } else {

      /*
       * Team does not have a GameChanger team yet.
       */

      document.getElementById("gcFrame").style.display =
        "none";

      showMessage(
        "GameChanger schedule coming soon",
        "The GameChanger team page has not been added for this team yet."
      );

    }

  }


  /*
   * Initialize once the page is ready.
   */

  document.addEventListener(
    "DOMContentLoaded",
    initializePage
  );

</script>

</body>
</html>
