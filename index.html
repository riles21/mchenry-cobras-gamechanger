<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>McHenry Cobras</title>

  <style>

    :root {
      --cobras-orange: #ff5a00;
      --cobras-black: #111111;
      --content-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* =====================================================
       MAIN PAGE
       ===================================================== */

    .page {
      width: 100%;
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 10px 12px 50px;
    }


    /* =====================================================
       COBRAS HEADER
       ===================================================== */

    .team-header {
      width: 100%;
      text-align: center;
    }

    .cobras-banner {
      display: block;
      width: 100%;
      max-width: 1000px;
      height: auto;
      margin: 0 auto;
    }

    .team-name {
      margin: 8px 0 0;
      padding: 0;

      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.1;
      font-weight: 700;
    }

    .season {
      margin-top: 3px;

      color: #666666;

      font-size: 16px;
      line-height: 1.2;
    }

    .orange-line {
      width: 100%;
      height: 3px;

      margin: 12px auto 20px;

      background: var(--cobras-orange);
    }


    /* =====================================================
       COACHING STAFF
       ===================================================== */

    .staff-section {
      width: 100%;
      text-align: center;
    }

    .section-title {
      margin: 0 0 18px;

      font-size: clamp(21px, 2.2vw, 28px);
      line-height: 1.1;

      letter-spacing: 0.5px;
    }

    .staff-grid {
      display: flex;

      justify-content: center;
      align-items: flex-start;

      flex-wrap: wrap;

      gap: 35px 80px;

      width: 100%;

      margin: 0 auto 20px;
    }

    .coach {
      min-width: 130px;
      text-align: center;
    }

    .coach-name {
      margin-bottom: 3px;

      font-size: 17px;
      font-weight: 700;
    }

    .coach-role {
      color: #777777;

      font-size: 14px;
    }


    /* =====================================================
       GAMECHANGER BUTTON
       ===================================================== */

    .gamechanger-button {
      display: inline-block;

      margin: 0 auto 20px;
      padding: 12px 22px;

      background: var(--cobras-orange);
      color: #ffffff;

      border-radius: 4px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition:
        background-color 0.15s ease,
        transform 0.15s ease;
    }

    .gamechanger-button:hover {
      background: #e84f00;

      transform: translateY(-1px);
    }


    /* =====================================================
       GAMECHANGER AREA
       ===================================================== */

    .gamechanger-section {
      width: 100%;

      margin: 0 auto;

      overflow: visible;
    }

    .gamechanger-title {
      width: 100%;

      padding: 9px 10px;

      background: var(--cobras-orange);
      color: #ffffff;

      text-align: center;

      font-size: 17px;
      font-weight: 700;

      line-height: 1.2;
    }

    /*
      This is the actual GameChanger widget container.

      We deliberately do NOT put overflow:hidden on this
      element because GameChanger needs to control its
      own internal layout.
    */

    #gc-schedule-widget {
      width: 100%;

      min-height: 400px;

      margin: 0;
      padding: 0;
    }


    /* =====================================================
       LOADING / ERROR MESSAGE
       ===================================================== */

    .gc-message {
      width: 100%;

      padding: 30px;

      border: 1px solid #dddddd;

      background: #fafafa;

      color: #666666;

      text-align: center;

      font-size: 14px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 900px) {

      .page {
        padding-left: 8px;
        padding-right: 8px;
      }

      .cobras-banner {
        max-width: 100%;
      }

      .staff-grid {
        gap: 25px 45px;
      }

    }


    @media (max-width: 600px) {

      .page {
        padding-left: 5px;
        padding-right: 5px;
      }

      .team-name {
        font-size: 26px;
      }

      .season {
        font-size: 14px;
      }

      .orange-line {
        margin-top: 10px;
        margin-bottom: 16px;
      }

      .section-title {
        font-size: 21px;
      }

      .staff-grid {
        gap: 20px;
      }

      .coach {
        min-width: 105px;
      }

      .coach-name {
        font-size: 15px;
      }

      .coach-role {
        font-size: 12px;
      }

      .gamechanger-button {
        padding: 10px 15px;

        font-size: 12px;
      }

      .gamechanger-title {
        font-size: 15px;
      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =================================================
         COBRAS HEADER
         ================================================= -->

    <header class="team-header">

      <img
        src="cobras-logo.png"
        alt="McHenry Cobras"
        class="cobras-banner"
      >

      <h1
        id="teamName"
        class="team-name">
        McHenry Cobras
      </h1>

      <div
        id="season"
        class="season">
        Team Page
      </div>

      <div class="orange-line"></div>

    </header>


    <!-- =================================================
         COACHING STAFF
         ================================================= -->

    <section class="staff-section">

      <h2 class="section-title">
        COACHING STAFF
      </h2>

      <div
        id="staff"
        class="staff-grid">
      </div>


      <a
        id="gamechangerLink"
        class="gamechanger-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer">

        VIEW TEAM, ROSTER &amp; STATS ON GAMECHANGER

      </a>

    </section>


    <!-- =================================================
         GAMECHANGER
         ================================================= -->

    <section class="gamechanger-section">

      <div class="gamechanger-title">
        Game Schedule &amp; Results
      </div>


      <div id="gc-schedule-widget">

        <div
          class="gc-message"
          id="loadingMessage">

          Loading GameChanger...

        </div>

      </div>

    </section>


  </main>


  <!-- ===================================================
       COBRAS TEAM CONFIG
       =================================================== -->

  <script src="config.js?v=20260820"></script>


  <!-- ===================================================
       GAMECHANGER SDK
       =================================================== -->

  <script src="https://widgets.gc.com/static/js/sdk.v1.js"></script>


  <!-- ===================================================
       PAGE JAVASCRIPT
       =================================================== -->

  <script>

    (function () {

      "use strict";


      /* =================================================
         READ TEAM FROM URL
         ================================================= */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const teamKey =
        params.get("team") || "lorenz12u";


      /* =================================================
         CHECK CONFIG
         ================================================= */

      if (
        typeof COBRAS_TEAMS === "undefined"
      ) {

        showConfigurationError(
          "config.js could not be loaded."
        );

        return;
      }


      const team =
        COBRAS_TEAMS[teamKey];


      if (!team) {

        showConfigurationError(
          "No configuration exists for team: " +
          teamKey
        );

        return;
      }


      /* =================================================
         TEAM NAME
         ================================================= */

      document.getElementById(
        "teamName"
      ).textContent =
        team.name || "McHenry Cobras";


      /* =================================================
         SEASON
         ================================================= */

      document.getElementById(
        "season"
      ).textContent =
        team.season || "";


      /* =================================================
         COACHING STAFF
         ================================================= */

      renderCoaches(team);


      /* =================================================
         GAMECHANGER TEAM LINK
         ================================================= */

      setupGameChangerLink(team);


      /* =================================================
         GAMECHANGER WIDGET
         ================================================= */

      loadGameChanger(team);


    })();


    /* =====================================================
       RENDER COACHES
       ===================================================== */

    function renderCoaches(team) {

      const staff =
        document.getElementById("staff");

      let html = "";


      /* -------------------------------------------------
         HEAD COACH
         ------------------------------------------------- */

      if (team.headCoach) {

        html +=
          '<div class="coach">' +

            '<div class="coach-name">' +
              escapeHTML(team.headCoach) +
            '</div>' +

            '<div class="coach-role">' +
              'Head Coach' +
            '</div>' +

          '</div>';

      }


      /* -------------------------------------------------
         ASSISTANT COACHES
         ------------------------------------------------- */

      if (
        Array.isArray(team.assistantCoaches)
      ) {

        team.assistantCoaches.forEach(
          function (coach) {

            if (!coach) {
              return;
            }

            html +=
              '<div class="coach">' +

                '<div class="coach-name">' +
                  escapeHTML(coach) +
                '</div>' +

                '<div class="coach-role">' +
                  'Assistant Coach' +
                '</div>' +

              '</div>';

          }
        );

      }


      staff.innerHTML = html;

    }


    /* =====================================================
       GAMECHANGER LINK
       ===================================================== */

    function setupGameChangerLink(team) {

      const link =
        document.getElementById(
          "gamechangerLink"
        );


      if (
        team.gameChangerTeamId
      ) {

        link.href =
          "https://web.gc.com/teams/" +
          encodeURIComponent(
            team.gameChangerTeamId
          );

      } else {

        link.style.display =
          "none";

      }

    }


    /* =====================================================
       LOAD GAMECHANGER
       ===================================================== */

    function loadGameChanger(team) {

      const container =
        document.getElementById(
          "gc-schedule-widget"
        );


      /* -------------------------------------------------
         NO WIDGET ID
         ------------------------------------------------- */

      if (
        !team.gameChangerWidgetId ||
        team.gameChangerWidgetId.trim() === ""
      ) {

        container.innerHTML =
          '<div class="gc-message">' +

            '<strong>' +
              'GameChanger schedule coming soon' +
            '</strong>' +

            '<br><br>' +

            'The GameChanger widget ID has not been ' +
            'added for this team yet.' +

          '</div>';

        return;

      }


      /*
        The GameChanger SDK should already be loaded
        because the script tag appears above this script.

        We wait until window.GC.team.schedule.init
        is available before initializing.
      */

      waitForGameChanger(
        team.gameChangerWidgetId
      );

    }


    /* =====================================================
       WAIT FOR GAMECHANGER SDK
       ===================================================== */

    function waitForGameChanger(widgetId) {

      let attempts = 0;

      const maxAttempts = 100;


      const timer =
        setInterval(
          function () {

            attempts++;


            /*
              Make sure the expected GameChanger
              namespace exists.
            */

            if (
              window.GC &&
              window.GC.team &&
              window.GC.team.schedule &&
              typeof
                window.GC.team.schedule.init ===
                  "function"
            ) {

              clearInterval(timer);


              initializeGameChanger(
                widgetId
              );

              return;

            }


            /*
              Stop waiting after approximately
              10 seconds.
            */

            if (
              attempts >= maxAttempts
            ) {

              clearInterval(timer);


              showGameChangerError();

            }

          },
          100
        );

    }


    /* =====================================================
       INITIALIZE GAMECHANGER TEAM SCHEDULE
       ===================================================== */

    function initializeGameChanger(widgetId) {

      const container =
        document.getElementById(
          "gc-schedule-widget"
        );


      /*
        Clear the loading message.
      */

      container.innerHTML = "";


      /*
        IMPORTANT:

        This is the current GameChanger team
        schedule widget initialization method.

        DO NOT change this to:
          GC.scoreboard.init()

        The correct namespace is:
          GC.team.schedule.init()
      */

      try {

        window.GC.team.schedule.init({

          target:
            "#gc-schedule-widget",

          widgetId:
            widgetId,

          maxVerticalGamesVisible:
            6

        });

      }
      catch (error) {

        console.error(
          "GameChanger initialization error:",
          error
        );

        showGameChangerError();

      }

    }


    /* =====================================================
       GAMECHANGER ERROR
       ===================================================== */

    function showGameChangerError() {

      const container =
        document.getElementById(
          "gc-schedule-widget"
        );


      container.innerHTML =
        '<div class="gc-message">' +

          '<strong>' +
            'Unable to load GameChanger.' +
          '</strong>' +

          '<br><br>' +

          'Please refresh the page and try again.' +

        '</div>';

    }


    /* =====================================================
       CONFIGURATION ERROR
       ===================================================== */

    function showConfigurationError(message) {

      document.getElementById(
        "teamName"
      ).textContent =
        "McHenry Cobras";


      document.getElementById(
        "season"
      ).textContent =
        "Team configuration unavailable";


      document.getElementById(
        "staff"
      ).innerHTML =
        '<div class="gc-message">' +

          '<strong>' +
            'Team configuration unavailable' +
          '</strong>' +

          '<br><br>' +

          escapeHTML(message) +

        '</div>';


      document.getElementById(
        "gamechangerLink"
      ).style.display =
        "none";


      document.getElementById(
        "gc-schedule-widget"
      ).innerHTML =
        '<div class="gc-message">' +

          'Please check that config.js is uploaded ' +
          'correctly.' +

        '</div>';

    }


    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>


</body>

</html>
