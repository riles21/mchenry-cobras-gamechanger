
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McHenry Cobras Baseball</title>

  <style>
    :root {
      --orange: #ff5a00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 22px 70px;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .container {
      max-width: 1450px;
      margin: 0 auto;
    }

    .hero {
      background:
        linear-gradient(115deg, #101010 0%, #171717 48%, #4b210f 100%);
      border-radius: 10px;
      padding: 28px 30px;
      text-align: center;
      box-shadow: 0 5px 12px rgba(0,0,0,.18);
      margin-bottom: 24px;
    }

    .hero img {
      width: 620px;
      max-width: 90%;
      height: auto;
      display: inline-block;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 15px 0 8px;
      font-weight: 800;
    }

    .season {
      text-align: center;
      color: #ff5a00;
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 17px;
    }

    .orange-line {
      height: 4px;
      background: #ff5a00;
      margin: 0 0 25px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;
      margin: 0 0 10px;
    }

    /* =========================
       PAGE NAVIGATION
    ========================== */

    .page-nav {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background: #111;
      border-left: 5px solid #ff5a00;
      border-radius: 9px;
      padding: 6px;
      margin-bottom: 30px;
      box-shadow: 0 3px 8px rgba(0,0,0,.14);
    }

    .page-nav-links {
      display: contents;
    }

    .page-nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .35px;
      padding: 10px 14px;
      border-radius: 6px;
      text-align: center;
    }

    .page-nav a:hover,
    .page-nav a.active {
      background: #ff5a00;
      color: #111;
    }

    .page-nav-hint {
      display: none;
    }

    /* Organization record */

    .org-record {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 38px;
    }

    .record-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
      padding: 19px 12px 17px;
      box-shadow: 0 2px 4px rgba(0,0,0,.08);
    }

    .record-number {
      font-size: 38px;
      font-weight: 800;
      line-height: 1;
    }

    .record-label {
      margin-top: 9px;
      font-size: 13px;
      letter-spacing: 1px;
      font-weight: 800;
      color: #555;
    }

    /* Teams */

    .age-group {
      margin-bottom: 26px;
    }

    .age-title {
      font-size: 22px;
      font-weight: 900;
      border-bottom: 3px solid #ff5a00;
      padding-bottom: 8px;
      margin-bottom: 13px;
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .team-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 128px;
      background: #fff;
      border: 1px solid #ddd;
      border-left: 5px solid #ff5a00;
      border-radius: 8px;
      padding: 20px 22px;
      text-decoration: none;
      color: #111;
      box-shadow: 0 2px 4px rgba(0,0,0,.06);
      transition: box-shadow .15s ease, transform .15s ease;
    }

    .team-card:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,.13);
      transform: translateY(-1px);
    }

    .team-info {
      min-width: 0;
      padding-right: 20px;
    }

    .team-name {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .coach-label {
      color: var(--orange);
      font-weight: 900;
    }

    .coaches {
      font-size: 16px;
      line-height: 1.35;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      color: #a00000;
      background: #fff1f1;
      border: 1px solid #e5aaaa;
      border-radius: 7px;
      padding: 15px;
    }

    .record-line {
      font-size: 28px;
      line-height: 1;
      font-weight: 900;
      color: #ff5a00;
      white-space: nowrap;
    }

    .arrow {
      color: #ff5a00;
      font-weight: 900;
    }

    @media (max-width: 900px) {
      body { padding: 18px 12px 50px; }
      h1 { font-size: 34px; }
      .org-record { grid-template-columns: repeat(3, 1fr); }
      .teams-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .team-card { min-height: 122px; padding: 17px; }
      .team-name { font-size: 21px; }
      .coaches { font-size: 13px; }
      .team-record { min-width: 125px; padding-left: 14px; }
      .record-line { font-size: 25px; font-weight: 900; color: #ff5a00; }
    }

    @media (max-width: 650px) {
      body { padding: 12px 8px 40px; }
      .hero { padding: 18px 10px; }
      h1 { font-size: 27px; }
      .season { font-size: 19px; }
      .page-nav { grid-template-columns: 1fr; }
      .page-nav a { min-height: 47px; font-size: 14px; }
      .org-record { grid-template-columns: repeat(2, 1fr); gap: 9px; }
      .record-card { min-height: 96px; padding: 15px 8px; }
      .record-number { font-size: 31px; }
      .record-label { font-size: 10px; }
      .age-title { font-size: 19px; }
      .teams-grid { grid-template-columns: 1fr; gap: 11px; }
      .team-card { min-height: 116px; padding: 16px; }
      .team-name { font-size: 21px; }
      .coaches { font-size: 13px; }
      .team-record { min-width: 115px; padding-left: 12px; }
      .record-line { font-size: 23px; font-weight: 900; color: #ff5a00; }
      .record-caption { font-size: 10px; }

    @media (max-width: 390px) {
      .team-card { padding: 14px 12px; }
      .team-name { font-size: 19px; }
      .coaches { font-size: 12px; }
      .team-record { min-width: 100px; padding-left: 9px; }
      .record-line { font-size: 20px; font-weight: 900; color: #ff5a00; }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>McHenry Cobras Baseball</h1>

  <div class="season">2027 SEASON</div>

  <div class="orange-line"></div>

  <div class="page-nav">
    <div class="page-nav-links">
      <a href="index.html" class="active">Organization &amp; Teams</a>
      <a href="#teams">Team Directory</a>
      <a href="calendar.html">Cobras Calendar</a>
    </div>
    <div class="page-nav-hint">2027 Season</div>
  </div>

  <div class="section-title">Cobras Organization</div>

  <div class="org-record">
    <div class="record-card">
      <div class="record-number" id="activeTeams">0</div>
      <div class="record-label">ACTIVE TEAMS</div>
    </div>

    <div class="record-card">
      <div class="record-number" id="orgWins">0</div>
      <div class="record-label">WINS</div>
    </div>

    <div class="record-card">
      <div class="record-number" id="orgLosses">0</div>
      <div class="record-label">LOSSES</div>
    </div>

    <div class="record-card">
      <div class="record-number" id="orgTies">0</div>
      <div class="record-label">TIES</div>
    </div>

    <div class="record-card">
      <div class="record-number" id="orgWinPct">.000</div>
      <div class="record-label">WINNING %</div>
    </div>
  </div>

  <div class="section-title">Cobras Teams</div>

  <div id="teams">
    <div class="loading">Loading Cobras teams...</div>
  </div>

</div>

<script src="config.js"></script>

<script>
  /*
    Organization page

    Records are calculated directly from:
      schedules/<team-key>.json

    A completed game contributes:
      win  = team score > opponent score
      loss = team score < opponent score
      tie  = team score === opponent score

    This keeps the organization record consistent with
    the individual team pages.
  */

  const BASE_PATH = "";

  function getAgeGroup(teamName) {
    const match = teamName.match(/^(\d+)U/i);
    return match ? parseInt(match[1], 10) : 999;
  }

  function getRecordFromGames(games) {
    let wins = 0;
    let losses = 0;
    let ties = 0;

    if (!Array.isArray(games)) {
      return { wins, losses, ties };
    }

    games.forEach(game => {
      if (
        game &&
        game.game_status === "completed" &&
        game.score &&
        typeof game.score.team === "number" &&
        typeof game.score.opponent_team === "number"
      ) {
        if (game.score.team > game.score.opponent_team) {
          wins++;
        } else if (game.score.team < game.score.opponent_team) {
          losses++;
        } else {
          ties++;
        }
      }
    });

    return { wins, losses, ties };
  }

  async function loadTeamRecord(teamKey) {

    try {

      /*
        Use the same normalized calendar feed as the main
        calendar and individual team pages.
      */

      const response =
        await fetch(
          `${BASE_PATH}calendar-events.json?cache=${Date.now()}`,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {
        throw new Error(
          `Calendar request failed: ${response.status}`
        );
      }


      const feed =
        await response.json();


      if (
        !feed ||
        !Array.isArray(feed.events)
      ) {
        throw new Error(
          "Calendar feed does not contain an events array."
        );
      }


      /*
        Only count GameChanger games for this specific team.
      */

      const teamGames =
        feed.events.filter(
          event =>
            event &&
            event.type === "gamechanger" &&
            event.teamKey === teamKey
        );


      let wins = 0;
      let losses = 0;
      let ties = 0;


      teamGames.forEach(
        game => {

          if (game.result === "win") {

            wins++;

          } else if (
            game.result === "loss"
          ) {

            losses++;

          } else if (
            game.result === "tie"
          ) {

            ties++;

          }

        }
      );


      return {
        wins,
        losses,
        ties
      };


    } catch (error) {

      console.warn(
        `Error loading calendar record for ${teamKey}:`,
        error
      );


      return {
        wins: 0,
        losses: 0,
        ties: 0
      };

    }

  }


  function createTeamCard(teamKey, team, record) {
    const coaches = [
      team.headCoach,
      ...(team.assistantCoaches || [])
    ].filter(Boolean).join(" · ");
const card = document.createElement("a");

    card.className = "team-card";

    card.href = `team.html?team=${encodeURIComponent(teamKey)}`;

    card.innerHTML = `
      <div class="team-info">
        <div class="team-name">${escapeHtml(team.name)}</div>
        <div class="coaches">
          <span class="coach-label">Coaches:</span> ${escapeHtml(coaches || "Coaching staff")}
        </div>
      </div>

      <div class="team-record">
        <div class="record-line">
          ${record.wins}-${record.losses}-${record.ties}
          <span class="arrow">→</span>
        </div>
      </div>
    `;

    return card;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function loadOrganization() {

    const teamsContainer = document.getElementById("teams");

    if (
      typeof COBRAS_TEAMS === "undefined" ||
      !COBRAS_TEAMS ||
      typeof COBRAS_TEAMS !== "object"
    ) {
      teamsContainer.innerHTML =
        `<div class="error">Unable to load Cobras team configuration.</div>`;
      return;
    }

    const activeTeams = Object.entries(COBRAS_TEAMS)
      .filter(([key, team]) => team && team.active === true)
      .sort((a, b) => {
        const ageA = getAgeGroup(a[1].name);
        const ageB = getAgeGroup(b[1].name);

        if (ageA !== ageB) {
          return ageA - ageB;
        }

        return a[1].name.localeCompare(b[1].name);
      });

    document.getElementById("activeTeams").textContent =
      activeTeams.length;

    if (activeTeams.length === 0) {
      teamsContainer.innerHTML =
        `<div class="error">No active Cobras teams found.</div>`;
      return;
    }

    teamsContainer.innerHTML = "";

    let organizationWins = 0;
    let organizationLosses = 0;
    let organizationTies = 0;

    /*
      Load every team schedule.

      Promise.all is used so one slow team does not hold up
      the other teams unnecessarily.
    */

    const results = await Promise.all(
      activeTeams.map(async ([teamKey, team]) => {
        const record = await loadTeamRecord(teamKey);

        console.log(
          `[Cobras] ${team.name} record:`,
          record
        );

        return {
          teamKey,
          team,
          record
        };
      })
    );

    /*
      Group teams by age.
    */

    const groups = {};

    results.forEach(result => {
      const age = getAgeGroup(result.team.name);

      if (!groups[age]) {
        groups[age] = [];
      }

      groups[age].push(result);

      organizationWins += result.record.wins;
      organizationLosses += result.record.losses;
      organizationTies += result.record.ties;
    });

    /*
      Display organization totals.
    */

    document.getElementById("orgWins").textContent =
      organizationWins;

    document.getElementById("orgLosses").textContent =
      organizationLosses;

    document.getElementById("orgTies").textContent =
      organizationTies;

    const organizationGames =
      organizationWins + organizationLosses + organizationTies;

    const organizationWinPct = organizationGames === 0
      ? 0
      : ((organizationWins + organizationTies * 0.5) / organizationGames) * 100;

    document.getElementById("orgWinPct").textContent =
      `${(organizationWinPct / 100).toFixed(3).replace(/^0/, '')}`;

    /*
      Display teams by age group.
    */

    Object.keys(groups)
      .sort((a, b) => Number(a) - Number(b))
      .forEach(age => {

        const group = document.createElement("div");
        group.className = "age-group";

        const title = document.createElement("div");
        title.className = "age-title";
        title.textContent = `${age}U`;

        const grid = document.createElement("div");
        grid.className = "teams-grid";

        groups[age]
          .sort((a, b) =>
            a.team.name.localeCompare(b.team.name)
          )
          .forEach(result => {
            grid.appendChild(
              createTeamCard(
                result.teamKey,
                result.team,
                result.record
              )
            );
          });

        group.appendChild(title);
        group.appendChild(grid);

        teamsContainer.appendChild(group);
      });
  }

  loadOrganization();
</script>

</body>
</html>
