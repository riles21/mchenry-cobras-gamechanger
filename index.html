<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>McHenry Cobras</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        color: #111111;
    }

    body {
        overflow-x: hidden;
    }

    .page {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px 50px;
    }

    /* COBRAS LOGO */
    .logo-wrap {
        width: 100%;
        text-align: center;
        margin: 0 auto;
        padding-top: 10px;
    }

    .logo {
        display: block;
        width: 100%;
        max-width: 1000px;
        height: auto;
        margin: 0 auto;
    }

    /* TEAM HEADER */
    .team-name {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        margin-top: 8px;
        margin-bottom: 2px;
    }

    .season {
        text-align: center;
        font-size: 18px;
        color: #666666;
        margin-bottom: 16px;
    }

    .orange-line {
        height: 4px;
        width: 100%;
        background: #ff5a00;
        margin: 0 auto 22px;
    }

    /* COACHING STAFF */
    .staff-title {
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 18px;
    }

    .staff {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 70px;
        flex-wrap: wrap;
        margin-bottom: 24px;
    }

    .coach {
        min-width: 150px;
        text-align: center;
    }

    .coach-name {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .coach-role {
        font-size: 14px;
        color: #777777;
    }

    /* GAMECHANGER BUTTON */
    .gc-button-wrap {
        text-align: center;
        margin: 10px 0 24px;
    }

    .gc-button {
        display: inline-block;
        background: #ff5a00;
        color: #ffffff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 700;
        padding: 14px 24px;
        border-radius: 4px;
    }

    .gc-button:hover {
        background: #e84f00;
    }

    /* GAMECHANGER HEADER */
    .gc-title {
        width: 100%;
        background: #ff5a00;
        color: #ffffff;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        padding: 10px;
        margin-bottom: 0;
    }

    /*
       IMPORTANT:
       Give GameChanger a large enough area that the embedded
       schedule does not create its own vertical scrollbar.
    */
    .gc-container {
        width: 100%;
        height: 1600px;
        overflow: hidden;
        position: relative;
        background: #ffffff;
    }

    .gc-iframe {
        display: block;
        width: 100%;
        height: 1600px;
        border: 0;
        overflow: hidden;
    }

    /* MOBILE */
    @media (max-width: 700px) {

        .page {
            padding: 0 10px 35px;
        }

        .logo-wrap {
            padding-top: 5px;
        }

        .team-name {
            font-size: 27px;
        }

        .season {
            font-size: 16px;
        }

        .orange-line {
            height: 3px;
            margin-bottom: 18px;
        }

        .staff-title {
            font-size: 22px;
            margin-bottom: 15px;
        }

        .staff {
            gap: 20px;
            margin-bottom: 20px;
        }

        .coach {
            min-width: 110px;
        }

        .coach-name {
            font-size: 16px;
        }

        .coach-role {
            font-size: 13px;
        }

        .gc-button {
            font-size: 14px;
            padding: 12px 17px;
        }

        .gc-title {
            font-size: 17px;
            padding: 9px;
        }

        /*
           Mobile GameChanger pages need more vertical room
           because the layout stacks vertically.
        */
        .gc-container {
            height: 1900px;
        }

        .gc-iframe {
            height: 1900px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <!-- COBRAS LOGO -->
    <div class="logo-wrap">
        <img
            src="cobras-logo.png"
            alt="McHenry Cobras"
            class="logo">
    </div>

    <!-- TEAM INFORMATION -->
    <div id="teamName" class="team-name"></div>
    <div id="season" class="season"></div>

    <div class="orange-line"></div>

    <!-- COACHING STAFF -->
    <div class="staff-title">COACHING STAFF</div>

    <div id="staff" class="staff"></div>

    <!-- GAMECHANGER BUTTON -->
    <div class="gc-button-wrap">
        <a
            id="gcButton"
            class="gc-button"
            target="_blank"
            rel="noopener">
            VIEW TEAM, ROSTER &amp; STATS ON GAMECHANGER
        </a>
    </div>

    <!-- GAMECHANGER -->
    <div class="gc-title">
        Game Schedule &amp; Results
    </div>

    <div id="gcContainer" class="gc-container"></div>

</div>

<script src="config.js"></script>

<script>
(function () {

    /* -----------------------------------------
       Determine which team was requested
       ----------------------------------------- */

    const params = new URLSearchParams(window.location.search);
    const teamKey = params.get("team");

    const teams = window.COBRAS_TEAMS || {};

    let team = teamKey ? teams[teamKey] : null;

    /*
       If no team was specified, show the first
       active team rather than a blank page.
    */
    if (!team) {
        const activeKey = Object.keys(teams).find(function (key) {
            return teams[key] && teams[key].active;
        });

        if (activeKey) {
            team = teams[activeKey];
        }
    }

    if (!team) {
        document.getElementById("teamName").textContent =
            "McHenry Cobras";

        document.getElementById("season").textContent =
            "Team information unavailable";

        return;
    }

    /* -----------------------------------------
       Team information
       ----------------------------------------- */

    document.getElementById("teamName").textContent =
        team.name || "McHenry Cobras";

    document.getElementById("season").textContent =
        team.season || "";

    /* -----------------------------------------
       Coaching staff
       ----------------------------------------- */

    const staffContainer = document.getElementById("staff");

    if (team.headCoach) {

        const head = document.createElement("div");
        head.className = "coach";

        head.innerHTML =
            '<div class="coach-name">' +
            escapeHtml(team.headCoach) +
            '</div>' +
            '<div class="coach-role">Head Coach</div>';

        staffContainer.appendChild(head);
    }

    if (Array.isArray(team.assistantCoaches)) {

        team.assistantCoaches.forEach(function (coachName) {

            if (!coachName) {
                return;
            }

            const assistant = document.createElement("div");
            assistant.className = "coach";

            assistant.innerHTML =
                '<div class="coach-name">' +
                escapeHtml(coachName) +
                '</div>' +
                '<div class="coach-role">Assistant Coach</div>';

            staffContainer.appendChild(assistant);
        });
    }

    /* -----------------------------------------
       GameChanger button
       ----------------------------------------- */

    const gcButton = document.getElementById("gcButton");

    if (team.gameChangerTeamId) {

        gcButton.href =
            "https://web.gc.com/teams/" +
            encodeURIComponent(team.gameChangerTeamId) +
            "/schedule";

    } else {

        gcButton.style.display = "none";
    }

    /* -----------------------------------------
       GameChanger schedule
       ----------------------------------------- */

    const gcContainer =
        document.getElementById("gcContainer");

    if (team.gameChangerTeamId) {

        /*
           Desktop / fallback:
           Load the GameChanger schedule directly.

           The large iframe height plus overflow:hidden
           prevents the inner scrollbar from appearing.
        */

        const iframe = document.createElement("iframe");

        iframe.className = "gc-iframe";

        iframe.src =
            "https://web.gc.com/teams/" +
            encodeURIComponent(team.gameChangerTeamId) +
            "/schedule";

        iframe.title =
            team.name + " GameChanger Schedule";

        iframe.setAttribute("scrolling", "no");
        iframe.setAttribute("frameborder", "0");

        gcContainer.appendChild(iframe);
    }

})();


/* -----------------------------------------
   Simple HTML escaping
   ----------------------------------------- */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
