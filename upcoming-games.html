<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobras Next Up</title>
<style>
  :root {
    --orange: #ff5a00;
    --black: #0d0d0d;
    --white: #ffffff;
    --gray: #b7b7b7;
    --line: rgba(255,255,255,.14);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
  }

  body { overflow: hidden; }

  .widget {
    min-height: 100vh;
    padding: 18px 20px 14px;
    background:
      radial-gradient(circle at 90% 0%, rgba(255,90,0,.16), transparent 42%),
      linear-gradient(135deg, #101010 0%, #090909 100%);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--orange);
    padding-bottom: 8px;
    margin-bottom: 3px;
  }

  .title {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .subtitle {
    color: var(--orange);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #games {
    display: flex;
    flex-direction: column;
  }

  .game {
    display: grid;
    grid-template-columns: 57px minmax(0,1fr) auto;
    gap: 11px;
    align-items: center;
    min-height: 56px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }

  .game:hover {
    background: rgba(255,90,0,.06);
  }

  .date {
    text-align: center;
    border-right: 1px solid var(--line);
    padding-right: 9px;
  }

  .month {
    color: var(--orange);
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .day {
    font-size: 22px;
    line-height: 21px;
    font-weight: 900;
  }

  .dow {
    color: var(--gray);
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .team-name {
    font-size: 12px;
    font-weight: 900;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .opponent {
    font-size: 11px;
    color: #eeeeee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    color: var(--gray);
    font-size: 8px;
    font-weight: 700;
    margin-top: 3px;
    text-transform: uppercase;
  }

  .time {
    text-align: right;
    font-size: 12px;
    font-weight: 900;
    white-space: nowrap;
  }

  .ha {
    color: var(--orange);
    font-size: 8px;
    margin-top: 2px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 9px;
  }

  .footer a {
    color: var(--black);
    background: var(--orange);
    text-decoration: none;
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 8px 11px;
    border-radius: 3px;
  }

  .status {
    color: var(--gray);
    text-align: center;
    padding: 28px 10px;
    font-size: 12px;
  }

  .error { color: #ff9b75; }

  @media (max-width: 600px) {
    .widget { padding: 14px 13px 11px; }
    .title { font-size: 18px; }
    .game { grid-template-columns: 52px minmax(0,1fr) auto; gap: 8px; }
    .team-name, .opponent { font-size: 10px; }
    .time { font-size: 10px; }
  }
</style>
</head>

<body>
<div class="widget">
  <div class="header">
    <div class="title">Cobras Next Up</div>
    <div class="subtitle">Upcoming Games</div>
  </div>

  <div id="games">
    <div class="status">Loading Cobras schedules...</div>
  </div>

  <div class="footer">
    <a href="https://riles21.github.io/mchenry-cobras-gamechanger/index.html"
       target="_blank" rel="noopener">
      View All Teams →
    </a>
  </div>
</div>

<script>
(async function () {
  const ROOT =
    "https://riles21.github.io/mchenry-cobras-gamechanger/";

  const MAX_GAMES = 15;
  const gamesEl = document.getElementById("games");

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(ts) {
    const d = new Date(ts);

    return {
      month: new Intl.DateTimeFormat("en-US", {
        month: "short",
        timeZone: "America/Chicago"
      }).format(d),

      day: new Intl.DateTimeFormat("en-US", {
        day: "numeric",
        timeZone: "America/Chicago"
      }).format(d),

      dow: new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        timeZone: "America/Chicago"
      }).format(d),

      time: new Intl.DateTimeFormat("en-US", {
        hour: "numeric",
        minute: "2-digit",
        timeZone: "America/Chicago"
      }).format(d)
    };
  }

  function renderGame(item) {
    const game = item.game;
    const d = formatDate(game.start_ts);

    const opponent =
      game.opponent_team?.name || "Opponent";

    const homeAway =
      game.home_away === "away" ? "Away" : "Home";

    return `
      <a class="game"
         href="${ROOT}team.html?team=${encodeURIComponent(item.teamKey)}"
         target="_blank"
         rel="noopener">

        <div class="date">
          <div class="month">${escapeHtml(d.month)}</div>
          <div class="day">${escapeHtml(d.day)}</div>
          <div class="dow">${escapeHtml(d.dow)}</div>
        </div>

        <div>
          <div class="team-name">
            ${escapeHtml(item.teamName)}
          </div>

          <div class="opponent">
            ${escapeHtml(opponent)}
          </div>

          <div class="meta">
            ${escapeHtml(item.season || "")}
          </div>
        </div>

        <div class="time">
          ${escapeHtml(d.time)}
          <div class="ha">${homeAway}</div>
        </div>
      </a>
    `;
  }

  try {
    const response = await fetch(
      ROOT + "upcoming-games.json?cache=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "upcoming-games.json returned HTTP " +
        response.status
      );
    }

    const games = await response.json();

    if (!Array.isArray(games) || games.length === 0) {
      gamesEl.innerHTML =
        '<div class="status">No upcoming Cobras games found.</div>';
      return;
    }

    const upcoming = games
      .filter(item =>
        item &&
        item.game &&
        item.game.start_ts &&
        new Date(item.game.start_ts).getTime() >= Date.now()
      )
      .sort(
        (a, b) =>
          new Date(a.game.start_ts) -
          new Date(b.game.start_ts)
      )
      .slice(0, MAX_GAMES);

    if (!upcoming.length) {
      gamesEl.innerHTML =
        '<div class="status">No upcoming Cobras games found.</div>';
      return;
    }

    gamesEl.innerHTML =
      upcoming.map(renderGame).join("");

  } catch (error) {
    console.error("Cobras Next Up error:", error);

    gamesEl.innerHTML =
      '<div class="status error">Unable to load Cobras schedule.</div>';
  }
})();
</script>
</body>
</html>
