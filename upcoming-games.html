<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobras Next Up</title>

<style>
  :root {
    --orange: #ff5a00;
    --black: #0d0d0d;
    --white: #ffffff;
    --gray: #b8b8b8;
    --line: rgba(255,255,255,.13);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    overflow: hidden;
  }

  .widget {
    width: 100%;
    min-height: 100vh;
    padding: 10px 14px 8px;
    background:
      radial-gradient(
        circle at 92% 5%,
        rgba(255,90,0,.16),
        transparent 40%
      ),
      linear-gradient(
        135deg,
        #101010 0%,
        #090909 100%
      );
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 3px;
    border-bottom: 2px solid var(--orange);
    padding-bottom: 7px;
  }

  .title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .live {
    color: var(--orange);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #games {
    display: flex;
    flex-direction: column;
  }

  .game {
    display: grid;
    grid-template-columns: 43px minmax(0,1fr) 92px;
    gap: 10px;
    align-items: center;
    min-height: 47px;
    padding: 5px 0;
    border-bottom: 1px solid var(--line);
  }

  .date {
    text-align: center;
    border-right: 1px solid var(--line);
    padding-right: 8px;
  }

  .date .month {
    color: var(--orange);
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .date .day {
    font-size: 21px;
    line-height: 20px;
    font-weight: 900;
  }

  .date .dow {
    color: var(--gray);
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .team-name {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .opponent {
    font-size: 12px;
    color: #eeeeee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    display: none;
  }

  .time {
    text-align: right;
    color: var(--white);
    font-size: 16px;
    line-height: 17px;
    font-weight: 900;
    white-space: nowrap;
  }

  .home-away {
    color: var(--orange);
    font-size: 11px;
    line-height: 12px;
    margin-top: 1px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .footer a {
    display: inline-block;
    color: var(--black);
    background: var(--orange);
    text-decoration: none;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 4px;
  }

  .footer a:hover {
    background: #ff6b1a;
  }

  .status {
    color: var(--gray);
    text-align: center;
    padding: 28px 10px;
    font-size: 13px;
  }

  .error {
    color: #ff9b75;
  }

  @media (max-width: 600px) {

    .widget {
      padding: 10px 10px 8px;
    }

    .title {
      font-size: 19px;
    }

    .game {
      grid-template-columns: 43px minmax(0,1fr) 78px;
      gap: 8px;
    }

    .team-name,
    .opponent {
      font-size: 11px;
    }

    .time {
      font-size: 14px;
    }

    .home-away {
      font-size: 10px;
    }
  }
</style>

</head>

<body>

<div class="widget">

  <div class="header">

    <div class="title">
      Cobras On Deck
    </div>

    <div class="live">
      Upcoming Games
    </div>

  </div>


  <div id="games">

    <div class="status">
      Loading Cobras schedules...
    </div>

  </div>


  <div class="footer">

    <a
      href="https://riles21.github.io/mchenry-cobras-gamechanger/index.html"
      target="_blank"
      rel="noopener"
    >
      View All Teams →
    </a>

  </div>

</div>


<script>

(async function () {

  const gamesEl =
    document.getElementById("games");

  const ROOT =
    "https://riles21.github.io/mchenry-cobras-gamechanger/";

  const MAX_GAMES = 10;

  /*
    Use Central Time for determining whether a game
    has already started.

    The schedule data uses ISO timestamps, so JavaScript
    can safely compare them against the current time.
  */
  const now =
    new Date();


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function formatDate(ts) {

    const d =
      new Date(ts);

    return {

      month:
        new Intl.DateTimeFormat(
          "en-US",
          {
            month: "short",
            timeZone: "America/Chicago"
          }
        ).format(d),

      day:
        new Intl.DateTimeFormat(
          "en-US",
          {
            day: "numeric",
            timeZone: "America/Chicago"
          }
        ).format(d),

      dow:
        new Intl.DateTimeFormat(
          "en-US",
          {
            weekday: "short",
            timeZone: "America/Chicago"
          }
        ).format(d),

      time:
        new Intl.DateTimeFormat(
          "en-US",
          {
            hour: "numeric",
            minute: "2-digit",
            timeZone: "America/Chicago"
          }
        ).format(d)

    };

  }


  function gameCard(item) {

    const d =
      formatDate(
        item.game.start_ts
      );

    const opponent =
      item.game.opponent_team?.name ||
      "Opponent";

    const homeAway =
      item.game.home_away === "away"
        ? "Away"
        : "Home";


    return `

      <a
        class="game"
        href="${ROOT}team.html?team=${encodeURIComponent(item.teamKey)}"
        target="_blank"
        rel="noopener"
        style="color:inherit;text-decoration:none"
      >

        <div class="date">

          <div class="month">
            ${escapeHtml(d.month)}
          </div>

          <div class="day">
            ${escapeHtml(d.day)}
          </div>

          <div class="dow">
            ${escapeHtml(d.dow)}
          </div>

        </div>


        <div>

          <div class="team-name">
            ${escapeHtml(item.teamName)}
          </div>

          <div class="opponent">
            ${escapeHtml(opponent)}
          </div>

        </div>


        <div class="time">

          ${escapeHtml(d.time)}

          <div class="home-away">
            ${escapeHtml(homeAway)}
          </div>

        </div>

      </a>

    `;

  }


  try {

    /*
      Add a cache-busting parameter so Wix/browser/CDN
      caching is much less likely to give us an old JSON file.
    */

    const response =
      await fetch(
        ROOT +
        "upcoming-games.json?cache=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Could not load upcoming-games.json (" +
        response.status +
        ")"
      );

    }


    const data =
      await response.json();


    if (
      !Array.isArray(data)
    ) {

      throw new Error(
        "upcoming-games.json did not contain an array."
      );

    }


    /*
      IMPORTANT FIX
      --------------

      Do NOT assume that upcoming-games.json has already
      removed old games.

      Filter the schedule here using the actual game start time.
    */

    const futureGames =
      data
        .filter(item => {

          const start =
            item?.game?.start_ts;

          if (!start) {
            return false;
          }

          const startTime =
            new Date(start);

          if (
            Number.isNaN(
              startTime.getTime()
            )
          ) {
            return false;
          }

          /*
            Only show games that have not started yet.
          */

          return startTime.getTime() > now.getTime();

        })


        /*
          Sort from soonest to latest.
        */

        .sort((a, b) => {

          const aTime =
            new Date(
              a.game.start_ts
            ).getTime();

          const bTime =
            new Date(
              b.game.start_ts
            ).getTime();

          return aTime - bTime;

        });


    console.log(
      "[Cobras Next Up] Total games loaded:",
      data.length
    );

    console.log(
      "[Cobras Next Up] Future games:",
      futureGames.length
    );


    /*
      If there are no future games, give the user
      a clean message instead of showing stale games.
    */

    if (
      !futureGames.length
    ) {

      gamesEl.innerHTML =
        '<div class="status">' +
        'No upcoming Cobras games found.' +
        '</div>';

      return;

    }


    /*
      NOW take the first 15.

      This is important — we filter first,
      then slice.
    */

    gamesEl.innerHTML =
      futureGames
        .slice(0, MAX_GAMES)
        .map(gameCard)
        .join("");


  } catch (error) {

    console.error(
      "Cobras Next Up error:",
      error
    );


    gamesEl.innerHTML =
      '<div class="status error">' +
      'Unable to load Cobras schedules.' +
      '</div>';

  }

})();

</script>

</body>
</html>
