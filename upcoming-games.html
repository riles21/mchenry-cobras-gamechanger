<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobras Next Up</title>
<style>
  :root {
    --orange: #ff5a00;
    --black: #0d0d0d;
    --white: #ffffff;
    --gray: #b8b8b8;
    --line: rgba(255,255,255,.13);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: Arial, Helvetica, sans-serif;
  }

  body { overflow: hidden; }

  .widget {
    width: 100%;
    min-height: 100vh;
    padding: 20px 24px 16px;
    background:
      radial-gradient(circle at 92% 5%, rgba(255,90,0,.16), transparent 40%),
      linear-gradient(135deg, #101010 0%, #090909 100%);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    border-bottom: 2px solid var(--orange);
    padding-bottom: 9px;
  }

  .title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  .live {
    color: var(--orange);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #games {
    display: flex;
    flex-direction: column;
  }

  .game {
    display: grid;
    grid-template-columns: 62px minmax(0,1fr) auto;
    gap: 12px;
    align-items: center;
    min-height: 64px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }

  .date {
    text-align: center;
    border-right: 1px solid var(--line);
    padding-right: 10px;
  }

  .date .month {
    color: var(--orange);
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .date .day {
    font-size: 24px;
    line-height: 24px;
    font-weight: 900;
  }

  .date .dow {
    color: var(--gray);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .team-name {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .opponent {
    font-size: 12px;
    color: #eeeeee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta {
    color: var(--gray);
    font-size: 9px;
    font-weight: 700;
    margin-top: 4px;
    text-transform: uppercase;
  }

  .time {
    text-align: right;
    color: var(--white);
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
  }

  .home-away {
    color: var(--orange);
    font-size: 9px;
    margin-top: 3px;
    font-weight: 900;
    text-transform: uppercase;
  }

  .footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 11px;
  }

  .footer a {
    display: inline-block;
    color: var(--black);
    background: var(--orange);
    text-decoration: none;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    padding: 9px 13px;
    border-radius: 4px;
  }

  .footer a:hover { background: #ff6b1a; }

  .status {
    color: var(--gray);
    text-align: center;
    padding: 28px 10px;
    font-size: 13px;
  }

  .error { color: #ff9b75; }

  @media (max-width: 600px) {
    .widget { padding: 15px 14px 12px; }
    .title { font-size: 19px; }
    .game { grid-template-columns: 56px minmax(0,1fr) auto; gap: 9px; }
    .team-name, .opponent { font-size: 11px; }
    .time { font-size: 11px; }
  }
</style>
</head>

<body>
<div class="widget">
  <div class="header">
    <div class="title">Cobras Next Up</div>
    <div class="live">Upcoming Games</div>
  </div>

  <div id="games">
    <div class="status">Loading Cobras schedules...</div>
  </div>

  <div class="footer">
    <a href="https://riles21.github.io/mchenry-cobras-gamechanger/index.html"
       target="_blank" rel="noopener">View All Teams →</a>
  </div>
</div>

<script>
(async function () {
  const gamesEl = document.getElementById("games");

  // Always use the GitHub Pages root as the data source.
  const ROOT =
    "https://riles21.github.io/mchenry-cobras-gamechanger/";

  const MAX_GAMES = 6;

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function chicagoDate(ts) {
    return new Date(ts);
  }

  function formatDate(ts) {
    const d = chicagoDate(ts);

    return {
      month: new Intl.DateTimeFormat("en-US", {
        month: "short",
        timeZone: "America/Chicago"
      }).format(d),

      day: new Intl.DateTimeFormat("en-US", {
        day: "numeric",
        timeZone: "America/Chicago"
      }).format(d),

      dow: new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        timeZone: "America/Chicago"
      }).format(d),

      time: new Intl.DateTimeFormat("en-US", {
        hour: "numeric",
        minute: "2-digit",
        timeZone: "America/Chicago"
      }).format(d)
    };
  }

  function gameCard(item) {
    const d = formatDate(item.game.start_ts);
    const opponent =
      item.game.opponent_team?.name || "Opponent";

    const homeAway =
      item.game.home_away === "away" ? "Away" : "Home";

    return `
      <a class="game"
         href="${ROOT}team.html?team=${encodeURIComponent(item.teamKey)}"
         target="_blank"
         rel="noopener"
         style="color:inherit;text-decoration:none">

        <div class="date">
          <div class="month">${escapeHtml(d.month)}</div>
          <div class="day">${escapeHtml(d.day)}</div>
          <div class="dow">${escapeHtml(d.dow)}</div>
        </div>

        <div>
          <div class="team-name">${escapeHtml(item.teamName)}</div>
          <div class="opponent">${escapeHtml(opponent)}</div>
          <div class="meta">${escapeHtml(homeAway)}</div>
        </div>

        <div class="time">
          ${escapeHtml(d.time)}
          <div class="home-away">${escapeHtml(homeAway)}</div>
        </div>
      </a>
    `;
  }

  try {
    const configResponse = await fetch(
      ROOT + "config.js?cache=" + Date.now(),
      { cache: "no-store" }
    );

    if (!configResponse.ok) {
      throw new Error(
        "Could not load config.js (" +
        configResponse.status + ")"
      );
    }

    const configText = await configResponse.text();

    /*
      config.js defines COBRAS_TEAMS. This evaluates only the
      configuration file and returns that object.
    */
    const teams = new Function(
      configText + "\nreturn COBRAS_TEAMS;"
    )();

    if (!teams || typeof teams !== "object") {
      throw new Error("COBRAS_TEAMS was not found");
    }

    const teamEntries = Object.entries(teams)
      .filter(([key, team]) =>
        team &&
        team.active === true &&
        team.gameChangerTeamId
      );

    const results = await Promise.all(
      teamEntries.map(async ([teamKey, team]) => {
        const url =
          ROOT +
          "schedules/" +
          encodeURIComponent(teamKey) +
          ".json?cache=" +
          Date.now();

        try {
          const response = await fetch(url, {
            cache: "no-store"
          });

          if (!response.ok) {
            console.warn(
              `Schedule unavailable for ${teamKey}: HTTP ${response.status}`
            );
            return [];
          }

          const games = await response.json();

          if (!Array.isArray(games)) {
            console.warn(
              `Unexpected schedule format for ${teamKey}`
            );
            return [];
          }

          return games
            .filter(game =>
              game &&
              game.start_ts &&
              !Number.isNaN(
                new Date(game.start_ts).getTime()
              ) &&
              new Date(game.start_ts).getTime() >= Date.now() &&
              game.game_status !== "completed"
            )
            .map(game => ({
              teamKey,
              teamName: team.name,
              game
            }));

        } catch (error) {
          console.warn(
            `Could not load ${teamKey}:`,
            error
          );
          return [];
        }
      })
    );

    const upcoming = results
      .flat()
      .sort(
        (a, b) =>
          new Date(a.game.start_ts) -
          new Date(b.game.start_ts)
      )
      .slice(0, MAX_GAMES);

    if (!upcoming.length) {
      gamesEl.innerHTML =
        '<div class="status">No upcoming Cobras games found.</div>';
      return;
    }

    gamesEl.innerHTML =
      upcoming.map(gameCard).join("");

  } catch (error) {
    console.error("Cobras Next Up error:", error);

    gamesEl.innerHTML =
      '<div class="status error">Unable to load Cobras schedules.</div>';
  }
})();
</script>
</body>
</html>
