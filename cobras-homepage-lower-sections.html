<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McHenry Cobras Homepage Sections</title>
<style>
:root{
  --orange:#ff5a00;
  --black:#0d0d0d;
  --charcoal:#171717;
  --brown:#3b1b0d;
  --cream:#f5f3f0;
  --line:#dedbd7;
  --muted:#686868;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  background:#f5f5f5;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}
body{overflow-x:hidden}
.cobras-home{
  width:100%;
  padding:24px 8px 42px;
}
.container{
  width:100%;
  max-width:none;
  margin:0 auto;
}
.section{
  margin:0 0 34px;
}
.section-header{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:14px;
}
.eyebrow{
  color:var(--orange);
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:5px;
}
.section-title{
  margin:0;
  font-size:30px;
  line-height:1;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
}
.section-title span{color:var(--orange)}
.section-link{
  color:#111;
  text-decoration:none;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
  border-bottom:2px solid var(--orange);
  padding-bottom:4px;
}
.section-link:hover{color:var(--orange)}

/* UPCOMING EVENTS */
.events-panel{
  background:linear-gradient(115deg,#101010 0%,#171717 52%,#35190d 100%);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,.13);
}
.events-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.event-card{
  min-height:145px;
  padding:20px 18px 17px;
  color:#fff;
  text-decoration:none;
  border-right:1px solid rgba(255,255,255,.13);
  position:relative;
  transition:background .15s ease,transform .15s ease;
}
.event-card:last-child{border-right:0}
.event-card:hover{background:rgba(255,90,0,.12)}
.event-date{
  color:var(--orange);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}
.event-day{
  font-size:32px;
  line-height:1;
  font-weight:900;
  margin:3px 0 7px;
}
.event-month{
  color:#bbb;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1px;
}
.event-name{
  font-size:16px;
  line-height:1.15;
  font-weight:900;
  margin-top:10px;
}
.event-desc{
  color:#c7c7c7;
  font-size:11px;
  line-height:1.35;
  margin-top:6px;
}
.event-arrow{
  position:absolute;
  right:15px;
  bottom:13px;
  color:var(--orange);
  font-size:18px;
  font-weight:900;
}
.status{
  color:#777;
  text-align:center;
  padding:28px 15px;
  font-size:13px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
}
.events-panel .status{
  background:transparent;
  border:0;
  color:#bbb;
}

/* TEAM SELECTOR */
.team-selector{
  background:linear-gradient(115deg,#101010 0%,#171717 55%,#35190d 100%);
  border-radius:10px;
  padding:24px;
  box-shadow:0 5px 15px rgba(0,0,0,.13);
}
.age-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:3px;
  scrollbar-width:thin;
}
.age-tab{
  flex:0 0 auto;
  border:1px solid rgba(255,255,255,.18);
  background:#202020;
  color:#fff;
  border-radius:5px;
  padding:10px 15px;
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  cursor:pointer;
}
.age-tab:hover,.age-tab.active{
  background:var(--orange);
  color:#111;
  border-color:var(--orange);
}
.team-panel{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

/* ALL TEAMS / ORGANIZATION SUMMARY */
.org-summary{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
}
.org-stat{
  background:#fff;
  color:#111;
  border-left:5px solid var(--orange);
  border-radius:7px;
  min-height:108px;
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.18);
}
.org-stat-value{
  font-size:30px;
  line-height:1;
  font-weight:900;
}
.org-stat-label{
  margin-top:8px;
  color:#555;
  font-size:10px;
  line-height:1.1;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.team-choice{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-height:92px;
  padding:17px 19px;
  background:#fff;
  color:#111;
  text-decoration:none;
  border-left:5px solid var(--orange);
  border-radius:7px;
  box-shadow:0 2px 7px rgba(0,0,0,.18);
  transition:transform .15s ease,box-shadow .15s ease;
}
.team-choice:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 14px rgba(0,0,0,.24);
}
.team-choice-name{
  font-size:20px;
  font-weight:900;
  line-height:1.05;
}
.team-choice-coaches{
  color:#555;
  font-size:11px;
  line-height:1.35;
  margin-top:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.team-choice-record{
  color:var(--orange);
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}
.team-choice-arrow{
  color:var(--orange);
  font-size:20px;
  font-weight:900;
  margin-left:5px;
}

@media(max-width:900px){
  .events-grid{grid-template-columns:repeat(3,1fr)}
  .org-summary{grid-template-columns:repeat(3,1fr)}
  .event-card:nth-child(3){border-right:0}
  .event-card:nth-child(n+4){border-top:1px solid rgba(255,255,255,.13)}
}
@media(max-width:620px){
  .cobras-home{padding:20px 8px 34px}
  .section-title{font-size:24px}
  .section-header{align-items:flex-start}
  .section-link{font-size:10px}
  .events-grid{grid-template-columns:repeat(2,1fr)}
  .event-card:nth-child(2){border-right:0}
  .event-card:nth-child(3){border-right:1px solid rgba(255,255,255,.13)}
  .event-card:nth-child(4){border-right:0}
  .event-card:nth-child(n+3){border-top:1px solid rgba(255,255,255,.13)}
  .event-card{min-height:135px;padding:16px 14px}
  .event-day{font-size:27px}
  .event-name{font-size:14px}
  .team-selector{padding:16px}
  .team-panel{grid-template-columns:1fr}
  .org-summary{grid-template-columns:repeat(2,1fr)}
  .team-choice{min-height:86px}
  .team-choice-name{font-size:18px}
}
@media(max-width:390px){
  .events-grid{grid-template-columns:1fr}
  .org-summary{grid-template-columns:1fr}
  .event-card,
  .event-card:nth-child(3){border-right:0;border-top:1px solid rgba(255,255,255,.13)}
  .event-card:first-child{border-top:0}
}
</style>
</head>

<body>
<div class="cobras-home">
<div class="container">

  <!-- =========================
       UPCOMING EVENTS
  ========================== -->
  <section class="section">
    <div class="section-header">
      <div>
        <div class="eyebrow">What's Happening</div>
        <h2 class="section-title">Upcoming <span>Cobras Events</span></h2>
      </div>
      <a class="section-link" href="https://riles210.wixsite.com/mchenrycobras2027/calendars" target="_blank" rel="noopener">View Full Calendar →</a>
    </div>

    <div class="events-panel">
      <div id="events" class="events-grid">
        <div class="status" style="grid-column:1/-1">Loading upcoming events...</div>
      </div>
    </div>
  </section>

  <!-- =========================
       TEAM SELECTOR
  ========================== -->
  <section class="section">
    <div class="section-header">
      <div>
        <div class="eyebrow">Find Your Team</div>
        <h2 class="section-title">Follow Your <span>Cobras</span></h2>
      </div>
      <a class="section-link" href="https://riles210.wixsite.com/mchenrycobras2027/teams" target="_blank" rel="noopener">All Teams →</a>
    </div>

    <div class="team-selector">
      <div id="ageTabs" class="age-tabs">
        <div class="status" style="width:100%;padding:16px">Loading teams...</div>
      </div>

      <div id="teamPanel" class="team-panel"></div>
    </div>
  </section>

</div>
</div>

<script src="https://riles21.github.io/mchenry-cobras-gamechanger/config.js"></script>
<script>
(function(){
  "use strict";

  const ROOT = "https://riles21.github.io/mchenry-cobras-gamechanger/";
  const CALENDAR = ROOT + "calendar-events.json?t=" + Date.now();

  function escapeHtml(value){
    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }

  function localDate(value){
    if(!value) return null;
    if(typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)){
      const [y,m,d] = value.split("-").map(Number);
      return new Date(y,m-1,d);
    }
    return new Date(value);
  }

  function formatEventDate(value){
    const d = localDate(value);
    return {
      month:new Intl.DateTimeFormat("en-US",{month:"short"}).format(d),
      day:new Intl.DateTimeFormat("en-US",{day:"numeric"}).format(d),
      weekday:new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(d)
    };
  }

  function getAge(name){
    const m = String(name || "").match(/^(\d+)U/i);
    return m ? parseInt(m[1],10) : 999;
  }

  function getRecord(teamKey, events){
    let w=0,l=0,t=0;
    events.filter(e =>
      e &&
      e.type === "gamechanger" &&
      e.teamKey === teamKey &&
      e.gameStatus === "completed"
    ).forEach(e => {
      if(e.result === "win") w++;
      else if(e.result === "loss") l++;
      else if(e.result === "tie") t++;
    });
    return `${w}-${l}-${t}`;
  }

  function renderEvents(feed){
    const el = document.getElementById("events");
    const now = Date.now();

    const events = (Array.isArray(feed.events) ? feed.events : [])
      .filter(e => e && e.type === "organization")
      .filter(e => {
        const d = localDate(e.start);
        return d && d.getTime() >= now - 86400000;
      })
      .sort((a,b) => localDate(a.start) - localDate(b.start))
      .slice(0,5);

    if(!events.length){
      el.innerHTML = '<div class="status" style="grid-column:1/-1">No upcoming Cobras events scheduled.</div>';
      return;
    }

    el.innerHTML = events.map(e => {
      const d = formatEventDate(e.start);
      const href = e.id === "steak-fry-2027"
        ? "https://riles210.wixsite.com/mchenrycobras2027/steakfry"
        : "https://riles210.wixsite.com/mchenrycobras2027/calendars";

      return `
        <a class="event-card" href="${href}" target="_blank" rel="noopener">
          <div class="event-date">${escapeHtml(d.weekday)}</div>
          <div class="event-day">${escapeHtml(d.day)}</div>
          <div class="event-month">${escapeHtml(d.month)} ${escapeHtml(localDate(e.start).getFullYear())}</div>
          <div class="event-name">${escapeHtml(e.title || "Cobras Event")}</div>
          <div class="event-desc">${escapeHtml(e.description || "")}</div>
          <div class="event-arrow">→</div>
        </a>
      `;
    }).join("");
  }

  function renderTeams(feed){
    const tabs = document.getElementById("ageTabs");
    const panel = document.getElementById("teamPanel");

    if(typeof COBRAS_TEAMS === "undefined" || !COBRAS_TEAMS){
      tabs.innerHTML = '<div class="status">Unable to load Cobras teams.</div>';
      return;
    }

    const teams = Object.entries(COBRAS_TEAMS)
      .filter(([key,team]) => team && team.active === true)
      .map(([key,team]) => ({key,team}))
      .sort((a,b) => {
        const ageDiff = getAge(a.team.name) - getAge(b.team.name);
        return ageDiff || a.team.name.localeCompare(b.team.name);
      });

    if(!teams.length){
      tabs.innerHTML = '<div class="status">No active Cobras teams found.</div>';
      return;
    }

    const groups = {};
    teams.forEach(item => {
      const age = getAge(item.team.name);
      if(!groups[age]) groups[age] = [];
      groups[age].push(item);
    });

    const ages = Object.keys(groups).sort((a,b)=>Number(a)-Number(b));

    const completedGames = (Array.isArray(feed.events) ? feed.events : [])
      .filter(e =>
        e &&
        e.type === "gamechanger" &&
        e.gameStatus === "completed" &&
        teams.some(item => item.key === e.teamKey)
      );

    let orgW = 0, orgL = 0, orgT = 0;
    completedGames.forEach(e => {
      if(e.result === "win") orgW++;
      else if(e.result === "loss") orgL++;
      else if(e.result === "tie") orgT++;
    });

    const orgTotal = orgW + orgL + orgT;
    const orgPct = orgTotal
      ? ((orgW + (orgT * 0.5)) / orgTotal).toFixed(3).replace(/^0/, "")
      : ".000";

    tabs.innerHTML =
      `<button type="button" class="age-tab active" data-age="ALL">All Teams</button>` +
      ages.map(age =>
        `<button type="button" class="age-tab" data-age="${escapeHtml(age)}">${escapeHtml(age)}U</button>`
      ).join("");

    function showAll(){
      tabs.querySelectorAll(".age-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.age === "ALL");
      });

      panel.innerHTML = `
        <div class="org-summary">
          <div class="org-stat">
            <div class="org-stat-value">${teams.length}</div>
            <div class="org-stat-label">Active Teams</div>
          </div>
          <div class="org-stat">
            <div class="org-stat-value">${orgW}</div>
            <div class="org-stat-label">Wins</div>
          </div>
          <div class="org-stat">
            <div class="org-stat-value">${orgL}</div>
            <div class="org-stat-label">Losses</div>
          </div>
          <div class="org-stat">
            <div class="org-stat-value">${orgT}</div>
            <div class="org-stat-label">Ties</div>
          </div>
          <div class="org-stat">
            <div class="org-stat-value">${orgPct}</div>
            <div class="org-stat-label">Winning %</div>
          </div>
        </div>
      `;
    }

    function showAge(age){
      tabs.querySelectorAll(".age-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.age === String(age));
      });

      panel.innerHTML = groups[age].map(item => {
        const team = item.team;
        const coaches = [
          team.headCoach,
          ...(Array.isArray(team.assistantCoaches) ? team.assistantCoaches : [])
        ].filter(Boolean).join(" · ");

        return `
          <a class="team-choice" href="${ROOT}team.html?team=${encodeURIComponent(item.key)}" target="_blank" rel="noopener">
            <div style="min-width:0">
              <div class="team-choice-name">${escapeHtml(team.name)}</div>
              <div class="team-choice-coaches"><strong>Coaches:</strong> ${escapeHtml(coaches || "Coaching staff")}</div>
            </div>
            <div>
              <span class="team-choice-record">${escapeHtml(getRecord(item.key, feed.events || []))}</span>
              <span class="team-choice-arrow">→</span>
            </div>
          </a>
        `;
      }).join("");
    }

    tabs.querySelectorAll(".age-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        if(btn.dataset.age === "ALL"){
          showAll();
        } else {
          showAge(btn.dataset.age);
        }
      });
    });

    // Default to the organization-wide view.
    showAll();
  }

  fetch(CALENDAR,{cache:"no-store"})
    .then(r => {
      if(!r.ok) throw new Error("Calendar feed failed: " + r.status);
      return r.json();
    })
    .then(feed => {
      renderEvents(feed);
      renderTeams(feed);
    })
    .catch(err => {
      console.error("Cobras homepage data error:",err);
      document.getElementById("events").innerHTML =
        '<div class="status" style="grid-column:1/-1">Unable to load upcoming Cobras events.</div>';
      renderTeams({events:[]});
    });
})();
</script>
</body>
</html>
